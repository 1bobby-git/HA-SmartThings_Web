name: Apply 0.1.162

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply162.py
          python /tmp/apply162.py
          python -m compileall -q custom_components/smartthings_web
          npm ci
          npm run typecheck
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-0.1.162.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix device-only entity IDs and Home Monitor control'
          git push origin HEAD:main
