name: Apply 0.1.162

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply entity ID and Home Monitor fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          init_path = Path('custom_components/smartthings_web/__init__.py')
          text = init_path.read_text(encoding='utf-8')
          primary = '''def _primary_switch_collision_targets(
              registry: object,
              current_registry_entries: Sequence[object],
              inventory: BridgeInventory,
          ) -> dict[str, str]:
              """Return device-name-only IDs for generated primary switches."""
              rows: list[tuple[object, object, str, str]] = []
              for entity_entry in _all_registry_entries(registry, current_registry_entries):
                  domain = getattr(entity_entry, "domain", "")
                  domain_value = getattr(domain, "value", domain)
                  if (
                      getattr(entity_entry, "platform", None) != DOMAIN
                      or domain_value != "switch"
                      or getattr(entity_entry, "name", None) is not None
                  ):
                      continue
                  device, state = _registry_primary_switch_state(entity_entry, inventory)
                  if device is None or state is None:
                      continue
                  object_id = canonical_primary_control_object_id(inventory, device)
                  if not object_id:
                      continue
                  rows.append(
                      (
                          entity_entry,
                          device,
                          str(getattr(entity_entry, "unique_id", "")),
                          object_id,
                      )
                  )

              grouped: dict[str, list[tuple[object, object, str, str]]] = {}
              for row in rows:
                  grouped.setdefault(f"switch.{row[3]}", []).append(row)

              targets: dict[str, str] = {}
              current_unique_ids = {
                  str(getattr(entity_entry, "unique_id", ""))
                  for entity_entry in current_registry_entries
                  if getattr(entity_entry, "platform", None) == DOMAIN
              }
              for exact_entity_id, group in grouped.items():
                  ordered_group = sorted(
                      group,
                      key=lambda row: (
                          _primary_switch_location_room_key(inventory, row[1]),
                          row[2],
                      ),
                  )
                  generated_group = [
                      row
                      for row in ordered_group
                      if _generated_primary_switch_entity_id(
                          row[0],
                          row[3],
                          qualified_object_id=_qualified_primary_switch_object_id(
                              inventory,
                              row[1],
                              row[3],
                          ),
                          qualified_device_suffix=(
                              slugify(str(getattr(row[1], "device_id", ""))) or row[2]
                          ),
                      )
                  ]
                  if not generated_group:
                      continue

                  generated_unique_ids = {row[2] for row in generated_group}
                  next_index = 1
                  for entity_entry, _device, unique_id, _object_id in generated_group:
                      candidate: str | None = None
                      for index in range(next_index, 1000):
                          numbered_candidate = (
                              exact_entity_id
                              if index == 1
                              else f"{exact_entity_id}_{index}"
                          )
                          occupant = registry.async_get(numbered_candidate)
                          occupant_unique_id = (
                              str(getattr(occupant, "unique_id", ""))
                              if occupant is not None
                              else ""
                          )
                          if (
                              occupant is not None
                              and occupant_unique_id not in generated_unique_ids
                          ):
                              continue
                          candidate = numbered_candidate
                          next_index = index + 1
                          break
                      if candidate is None:
                          break
                      if unique_id not in current_unique_ids:
                          continue
                      if candidate == str(getattr(entity_entry, "entity_id", "")):
                          continue
                      targets[unique_id] = candidate
              return targets


          '''
          pattern = re.compile(
              r'def _primary_switch_collision_targets\(.*?(?=def _generated_primary_switch_entity_id\()',
              re.S,
          )
          text, count = pattern.subn(primary, text, count=1)
          if count != 1:
              raise SystemExit('primary switch collision function not found')

          generated = '''def _generated_primary_switch_entity_id(
              entity_entry: object,
              object_id: str,
              *,
              qualified_object_id: str | None = None,
              qualified_device_suffix: str | None = None,
          ) -> bool:
              """Return whether the current switch ID is one of our generated forms."""
              current_object_id = str(getattr(entity_entry, "entity_id", "")).partition(".")[2]
              if not current_object_id:
                  return False
              generated = {
                  object_id,
                  f"{object_id}_switch",
              }
              if qualified_object_id:
                  generated.add(qualified_object_id)
                  if qualified_device_suffix:
                      generated.add(f"{qualified_object_id}_{qualified_device_suffix}")
              if current_object_id in generated:
                  return True
              for generated_object_id in generated:
                  numbered_prefix = f"{generated_object_id}_"
                  if current_object_id.startswith(numbered_prefix):
                      suffix = current_object_id[len(numbered_prefix) :]
                      if suffix.isdigit() and int(suffix) >= 2:
                          return True
              return _generated_primary_switch_feedback_object_id(current_object_id, object_id)


          '''
          pattern = re.compile(
              r'def _generated_primary_switch_entity_id\(.*?(?=def _generated_primary_switch_feedback_object_id\()',
              re.S,
          )
          text, count = pattern.subn(generated, text, count=1)
          if count != 1:
              raise SystemExit('generated primary switch helper not found')
          init_path.write_text(text, encoding='utf-8')

          command_path = Path('bridge/src/browser/command-page.ts')
          text = command_path.read_text(encoding='utf-8')
          old = '''        const monitor = page.getByRole("button", {
          name: /^(?:SmartThings\\s+)?Home Monitor$|^홈 모니터$/iu
        });'''
          new = '''        const monitor = page.getByRole("button", {
          name: homeMonitorName(input.locationNames?.[input.locationId])
        });'''
          if old not in text:
              raise SystemExit('Home Monitor locator not found')
          text = text.replace(old, new, 1)
          marker = '''function controlLabelFor(attribute: string): string | undefined {'''
          helper = '''function homeMonitorName(locationName?: string): RegExp {
            const normalizedLocationName = locationName?.trim();
            const locationPrefix = normalizedLocationName
              ? `(?:${escapeRegExp(normalizedLocationName)}\\\\s*)?`
              : "";
            return new RegExp(
              `^\\\\s*${locationPrefix}(?:(?:SmartThings\\\\s*)?Home\\\\s*Monitor|홈\\\\s*모니터)\\\\s*$`,
              "iu"
            );
          }

          '''
          if marker not in text:
              raise SystemExit('control label marker not found')
          text = text.replace(marker, helper + marker, 1)
          command_path.write_text(text, encoding='utf-8')

          manifest = Path('custom_components/smartthings_web/manifest.json')
          text = manifest.read_text(encoding='utf-8')
          if '"version": "0.1.161"' not in text:
              raise SystemExit('manifest version mismatch')
          manifest.write_text(text.replace('"version": "0.1.161"', '"version": "0.1.162"', 1), encoding='utf-8')

          addon = Path('addon/smartthings_web_bridge/config.yaml')
          text = addon.read_text(encoding='utf-8')
          if 'version: 0.1.161' not in text:
              raise SystemExit('addon version mismatch')
          addon.write_text(text.replace('version: 0.1.161', 'version: 0.1.162', 1), encoding='utf-8')

          package = Path('package.json')
          text = package.read_text(encoding='utf-8')
          package.write_text(text.replace('"version": "0.1.161"', '"version": "0.1.162"', 1), encoding='utf-8')

          lock = Path('package-lock.json')
          text = lock.read_text(encoding='utf-8')
          count = text.count('"version": "0.1.161"')
          if count < 2:
              raise SystemExit(f'package-lock version count mismatch: {count}')
          lock.write_text(text.replace('"version": "0.1.161"', '"version": "0.1.162"', 2), encoding='utf-8')

          changelog = Path('addon/smartthings_web_bridge/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if not text.startswith('## 0.1.161'):
              raise SystemExit('unexpected changelog head')
          notes = '''## 0.1.162

          - 기본 스위치 엔티티 ID는 위치·방 접두사 없이 SmartThings 기기 이름만 사용합니다. 동일 이름 충돌은 `_2`, `_3` 숫자 접미사로만 구분합니다.
          - 기존 generated 위치·방 접두사 ID를 기기명 기반 ID로 자동 이전하며, 사용자 지정 ID와 다른 통합이 점유한 ID는 보존합니다.
          - Home Monitor 카드 선택에서 위치명 접두사와 `홈모니터`/`홈 모니터` 및 영문 변형을 정확히 지원합니다.

          '''
          changelog.write_text(notes + text, encoding='utf-8')
          PY

      - name: Validate edited sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/smartthings_web
          npm ci
          npm run typecheck
          grep -q '"version": "0.1.162"' custom_components/smartthings_web/manifest.json
          grep -q '^version: 0.1.162$' addon/smartthings_web_bridge/config.yaml

      - name: Commit to main and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-0.1.162.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix device-only entity IDs and Home Monitor control'
          git push origin HEAD:main
