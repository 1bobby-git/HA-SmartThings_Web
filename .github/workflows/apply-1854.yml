name: Apply and validate 1.8.54
on:
  push:
    branches: [fix/native-session-capture-1.8.54]
    paths: [.github/workflows/apply-1854.yml]
permissions:
  contents: write
concurrency:
  group: native-session-1854
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/native-session-capture-1.8.54
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply deterministic 1.8.54 edits
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_1854_edit.py
          python3 tools/_1854_finish_edits.py
          python3 tools/_1854_finish_more.py
          python3 tools/_1854_add_regressions.py
          python3 tools/_1854_local_parity.py
          python3 tools/_1854_release_edit.py
          git diff --check
      - name: Full Node and security validation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run audit:api-free
          npm run audit:secrets
      - name: Real Chromium session regressions
        shell: bash
        run: |
          set -euo pipefail
          npx playwright-core install --with-deps chromium
          node tools/ci-native-session-smoke.mjs
          node tools/ci-native-login-dom-regression.mjs
          xvfb-run -a node tools/ci-native-login-policy-smoke.mjs
          xvfb-run -a node tools/ci-session-continuity-smoke.mjs
      - name: Commit validated production candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/_1854_edit.py tools/_1854_finish_edits.py tools/_1854_finish_more.py tools/_1854_add_regressions.py tools/_1854_local_parity.py tools/_1854_release_edit.py
          rm -f tools/_release_1854_patch.b64 tools/_release_1854_01.b64 tools/_release_1854_02.b64 tools/_release_1854_03.b64 tools/_release_1854_04.b64 tools/_capture_1854_1.b64
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make SmartThings session observability resilient (1.8.54)'
          git push origin HEAD:fix/native-session-capture-1.8.54
