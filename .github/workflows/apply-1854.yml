name: Apply and validate 1.8.54
on:
  push:
    branches: [fix/native-session-capture-1.8.54]
    paths: [.github/workflows/apply-1854.yml]
permissions:
  contents: write
concurrency:
  group: native-session-1854
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/native-session-capture-1.8.54
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply exact locally validated patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded=''.join(Path(f'tools/_release_1854_{i:02}.b64').read_text().strip() for i in range(1,5))
          data=lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '3d7f00ca645b1d44426bab4abdf141f12756816e155c06b892a5f086ad5882da'
          Path('/tmp/1854.patch').write_bytes(data)
          PY
          git apply --check /tmp/1854.patch
          git apply /tmp/1854.patch
          git diff --check
      - name: Full Node and security validation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run audit:api-free
          npm run audit:secrets
      - name: Real Chromium session regressions
        shell: bash
        run: |
          set -euo pipefail
          npx playwright-core install --with-deps chromium
          node tools/ci-native-session-smoke.mjs
          node tools/ci-native-login-dom-regression.mjs
          xvfb-run -a node tools/ci-native-login-policy-smoke.mjs
          xvfb-run -a node tools/ci-session-continuity-smoke.mjs
      - name: Commit validated production candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make SmartThings session observability resilient (1.8.54)'
          git push origin HEAD:fix/native-session-capture-1.8.54
