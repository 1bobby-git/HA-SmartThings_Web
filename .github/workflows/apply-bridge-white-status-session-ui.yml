name: Apply Bridge white status and session-aware UI

"on":
  push:
    branches:
      - ui/bridge-white-status-session-aware
    paths:
      - .github/workflows/apply-bridge-white-status-session-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/bridge-white-status-session-aware

      - name: Apply patch and run focused validation
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply-bridge-white-status-session-ui.py
          npm ci
          npm run typecheck
          npx vitest run bridge/tests/server/status-page.test.ts bridge/tests/server/health.test.ts tests/addon-line-endings.test.ts tests/branding-assets.test.ts
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: make Bridge status session-aware and surface-based'
          git push origin HEAD:refs/heads/ui/bridge-white-status-session-aware
