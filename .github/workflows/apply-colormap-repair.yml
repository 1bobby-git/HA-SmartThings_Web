name: Apply verified ColorMap repair
on:
  push:
    branches:
      - fix/light-colormap-1.8.26
    paths:
      - .github/workflows/apply-colormap-repair.yml
permissions:
  contents: write
concurrency:
  group: apply-colormap-repair-1.8.26
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-colormap-1.8.26
          fetch-depth: 0
      - name: Verify reviewed patch and resulting source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('.')
          payload = '.github/colormap-1.8.26.patch.xz.b64'
          workflow = '.github/workflows/apply-colormap-repair.yml'
          base = '9aca2d9e221f6bca055cfa148897eeb1ee7dcb65'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          if git('rev-parse', 'origin/main') != base:
              raise SystemExit('Main advanced; re-review before applying')
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) != {payload, workflow}:
              raise SystemExit('Unexpected branch changes')
          patch = lzma.decompress(base64.b64decode((root / payload).read_text(), validate=True), memlimit=128*1024*1024)
          expected = 'e767550e96775e888f0a4c254c7de690ae076da668ce51d82445a0d9b3d46e44'
          if len(patch) != 25925 or hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed patch checksum mismatch')
          if json.loads((root / 'package.json').read_text())['version'] != '1.8.25':
              raise SystemExit('Unexpected base version')
          allowed = {
              'CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md',
              'addon/smartthings_web_bridge/config.yaml', 'bridge/src/advanced/color-argument.ts',
              'bridge/src/command/command-service.ts', 'bridge/src/runtime.ts',
              'bridge/tests/advanced/color-argument.test.ts', 'bridge/tests/command/light-plan.test.ts',
              'bridge/tests/runtime.test.ts', 'custom_components/smartthings_web/manifest.json',
              'custom_components/smartthings_web/tests/fixtures/light-schema-annotations.json',
              'custom_components/smartthings_web/tests/test_light_capabilities.py',
              'docs/LIGHT_COLORMAP_1.8.26.md', 'package-lock.json', 'package.json',
              'protocol/version.json', 'tests/addon-config.test.ts', 'tests/protocol-version-contract.test.ts'
          }
          if set(re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M)) != allowed:
              raise SystemExit('Unexpected patch scope')
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'rm', '--', payload], check=True)
          verify_index = (root / '.git/colormap-verify-index').resolve()
          shutil.copyfile('.git/index', verify_index)
          env = {**os.environ, 'GIT_INDEX_FILE': str(verify_index)}
          try:
              git('update-index', '--force-remove', workflow, env=env)
              tree = git('write-tree', env=env)
              if tree != '1bdd1bf1dacdaa4491f0bcd69d95971785ecdb51':
                  raise SystemExit('Source tree does not match the reviewed 1.8.26 patch: ' + tree)
          finally:
              verify_index.unlink(missing_ok=True)
          print('Verified patch SHA256:', expected)
          print('Verified final source tree:', tree)
          print('Reviewed files:', len(allowed))
          PY
          git diff --cached --check
          git diff --cached --stat
      - name: Commit only to the repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: accept valid optional ColorMap schemas (1.8.26)'
          git push origin HEAD:fix/light-colormap-1.8.26
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
