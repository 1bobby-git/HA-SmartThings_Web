name: Apply verified control repair
on:
  push:
    branches: [fix/control-dispatch-1.8.20]
    paths: [.github/workflows/apply-control-fix.yml]
permissions:
  contents: write
concurrency:
  group: apply-control-repair-1.8.20
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-SmartThings_Web' && github.ref == 'refs/heads/fix/control-dispatch-1.8.20'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1
        with:
          ref: fix/control-dispatch-1.8.20
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Verify patch bytes and apply reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7a9856acdf7c205c42dc8b7beec9cdc0291a8777 HEAD
          git diff --quiet 7a9856acdf7c205c42dc8b7beec9cdc0291a8777 HEAD -- bridge/src custom_components package.json package-lock.json protocol/version.json addon README.md
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          assert json.loads(Path('package.json').read_text())['version'] == '1.8.19'
          encoded = ''.join(Path(f'tools/control-fix.xz{i:02}').read_text().strip() for i in range(1, 22))
          assert len(encoded) == 36988
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 123169
          assert hashlib.sha256(patch).hexdigest() == '7f4ebed78ddfdb48fc3b171d0f235c4a70f63f94881d4497f0eb576fa08cea9b'
          Path('/tmp/control-fix.patch').write_bytes(patch)
          PY
          git apply --check /tmp/control-fix.patch
          git apply /tmp/control-fix.patch
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {
            'README.md': '5c4dbcb76057baab92c92a0cf119d45a5124b67709300caab1b2664c5295038b',
            'bridge/src/command/command-service.ts': 'd22d703358646a2978af21a996f1996c128b657068bc72696bc5e47f09c6f25a',
            'bridge/src/command/light-plan.ts': '2774c356c825e178d0c01ad7eb287c85b29c9f46b2af452e3848f43d9bd9e248',
            'bridge/src/advanced/command-adapter.ts': 'd56303dc968cb7f79a69ba2722a6a74bb31375416cc8c20c9f7111be4d311302',
            'bridge/src/runtime.ts': '661eb2b0e26c3c2bd6ba09547027deadf36306096f33f56bc8e28acadf09cf99',
            'custom_components/smartthings_web/light.py': '38f70582b2322d4f4942619cb25b17804ee00f924bc852f2956988d879ce1495',
            'custom_components/smartthings_web/fan.py': '326c188847f3da4263ef05ba157be9d8bdbdc7282d173b9cab5bcc695a6e96bf',
            'custom_components/smartthings_web/models.py': 'bfae5ef1841a85fa7c79e9342bb86191078fb88eb6ff3df35ccbe7683a971818'
          }
          for name, digest in expected.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          assert json.loads(Path('package.json').read_text())['version'] == '1.8.20'
          assert json.loads(Path('custom_components/smartthings_web/manifest.json').read_text())['version'] == '1.8.20'
          for i in range(1, 22):
            Path(f'tools/control-fix.xz{i:02}').unlink()
          Path('tools/control-release.part1').unlink()
          for name in ('control-source.yml', 'control-test-runtime.yml', 'apply-control-fix.yml'):
            Path('.github/workflows', name).unlink()
          PY
          git diff --check
      - name: Run full Node and Python regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test > /tmp/control-node.log 2>&1 || { tail -150 /tmp/control-node.log; exit 1; }
          tail -12 /tmp/control-node.log
          npm run build
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures
          npm run package:addon
          python -m venv /tmp/control-tests
          source /tmp/control-tests/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.10,<4' 'voluptuous>=0.15,<1'
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python custom_components/smartthings_web/tests/test_light_capabilities.py --isolated
          python custom_components/smartthings_web/tests/test_fan_power_binding.py --isolated
          git diff --check
      - name: Commit tested source to isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: batch verified light controls and repair fan power binding; release 1.8.20'
          git push origin HEAD:refs/heads/fix/control-dispatch-1.8.20
