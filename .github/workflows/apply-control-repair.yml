name: Apply verified control repair
on:
  push:
    branches:
      - fix/light-monitor-confirmation-20260908
    paths:
      - .github/workflows/apply-control-repair.yml
permissions:
  contents: write
concurrency:
  group: apply-control-repair-20260908
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-monitor-confirmation-20260908
          fetch-depth: 0
      - name: Verify exact reviewed patch and apply to working branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, pathlib, re, subprocess, zlib
          root = pathlib.Path('.')
          expected = '805f43b6287f885c9edab1c61930c699429937901fac82449806b3a55f297a3b'
          encoded = ''.join((root / f'.github/control-repair.patch.b64.{n}').read_text().strip() for n in (1, 2))
          # Repair one known transport transcription; the full SHA256 remains mandatory.
          encoded = encoded.replace('VmvVpuVV30', 'VmvVpuV30')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed patch checksum mismatch; refusing all changes')
          if json.loads((root / 'package.json').read_text())['version'] != '1.8.23':
              raise SystemExit('Unexpected base version; refusing stale repair')
          allowed = {
              'CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md',
              'addon/smartthings_web_bridge/config.yaml', 'bridge/src/command/command-service.ts',
              'bridge/src/command/light-plan.ts', 'bridge/src/runtime.ts',
              'bridge/tests/command/light-plan.test.ts', 'bridge/tests/runtime.test.ts',
              'custom_components/smartthings_web/alarm_control_panel.py',
              'custom_components/smartthings_web/light.py',
              'custom_components/smartthings_web/manifest.json',
              'custom_components/smartthings_web/tests/test_alarm_control_panel.py',
              'custom_components/smartthings_web/tests/test_light_capabilities.py',
              'docs/LIGHT_MONITOR_DELIVERY_1.8.24.md', 'package-lock.json', 'package.json',
              'protocol/version.json', 'tests/addon-config.test.ts',
              'tests/protocol-version-contract.test.ts',
          }
          changed = set(re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M))
          if changed != allowed:
              raise SystemExit('Unexpected patch scope')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          print('Verified patch SHA256:', expected)
          print('Applied reviewed files:', len(allowed))
          PY
          git rm .github/control-repair.patch.b64.1 .github/control-repair.patch.b64.2
          git diff --cached --check
          git diff --cached --stat
      - name: Commit repair without touching main or release gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: deliver verified light and Home Monitor state promptly (1.8.24)'
          git push origin HEAD:fix/light-monitor-confirmation-20260908
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
