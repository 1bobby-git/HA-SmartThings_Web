name: Apply entity registry backpressure fix 0.1.171 v2

on:
  push:
    branches:
      - fix/entity-registry-backpressure-0.1.171
    paths:
      - .github/workflows/apply-entity-registry-backpressure-0.1.171-v2.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply, test, build, and commit registry fix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/entity-registry-backpressure-0.1.171
          fetch-depth: 0

      - name: Apply source, tests, and version changes
        run: python tools/apply_entity_registry_backpressure_0_1_171.py

      - name: Validate patch formatting
        run: |
          git diff --check
          git status --short

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check "aiohttp>=3.10,<4" "yarl>=1.9,<2" "voluptuous>=0.15,<1"

      - name: Compile integration
        run: python -m compileall -q custom_components/smartthings_web

      - name: Run Home Assistant integration tests
        run: python -m unittest discover -s custom_components/smartthings_web/tests -p "test_*.py"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full Node tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build Bridge
        run: npm run build

      - name: Package Bridge app
        run: npm run package:addon

      - name: Commit verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            addon/smartthings_web_bridge/CHANGELOG.md \
            addon/smartthings_web_bridge/config.yaml \
            bridge/src/runtime.ts \
            custom_components/smartthings_web/__init__.py \
            custom_components/smartthings_web/binary_sensor.py \
            custom_components/smartthings_web/sensor.py \
            custom_components/smartthings_web/manifest.json \
            custom_components/smartthings_web/tests/test_init.py \
            custom_components/smartthings_web/tests/test_binary_sensor.py \
            package.json \
            package-lock.json \
            protocol/version.json \
            tests/addon-config.test.ts \
            tests/protocol-version-contract.test.ts
          git commit -m "fix: bound entity registry churn and release 0.1.171"
          git push origin "HEAD:${GITHUB_REF_NAME}"
