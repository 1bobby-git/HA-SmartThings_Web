name: Materialize HAOS live regression fixes 0.1.182

on:
  push:
    branches:
      - fix/haos-live-control-discovery-naming-backpressure-0.1.182
    paths:
      - .github/workflows/apply-haos-live-fix-0.1.182.yml

permissions:
  contents: write

concurrency:
  group: materialize-haos-live-fix-0.1.182
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/0.1.182/payload-*.b64 > /tmp/apply-0.1.182.b64
          base64 --decode /tmp/apply-0.1.182.b64 | gzip --decompress > /tmp/apply-0.1.182.py
          printf '%s  %s\n' \
            'ea6d33d30c0d1875c85545846d43462cb63cac71a748cf7b82ddeb7be10bc96e' \
            '/tmp/apply-0.1.182.py' | sha256sum --check --strict
          python .github/scripts/0.1.182/fix-patch-source.py
          python /tmp/apply-0.1.182.py
          python .github/scripts/0.1.182/fix-post-apply.py
          rm -rf .github/scripts/0.1.182
          rm -f .github/scripts/apply_haos_live_fix_0_1_182.py
          rm -f .github/workflows/apply-haos-live-fix-0.1.182.yml

      - name: Commit materialized candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: address HAOS live regressions 0.1.182'
          git push origin HEAD:fix/haos-live-control-discovery-naming-backpressure-0.1.182
