name: Apply HAOS live regression fixes 0.1.182

on:
  push:
    branches:
      - fix/haos-live-control-discovery-naming-backpressure-0.1.182
    paths:
      - .github/workflows/apply-haos-live-fix-0.1.182.yml

permissions:
  contents: write

concurrency:
  group: apply-haos-live-fix-0.1.182
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reassemble and apply reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/0.1.182/payload-*.b64 > /tmp/apply-0.1.182.b64
          base64 --decode /tmp/apply-0.1.182.b64 | gzip --decompress > /tmp/apply-0.1.182.py
          printf '%s  %s\n' \
            'ea6d33d30c0d1875c85545846d43462cb63cac71a748cf7b82ddeb7be10bc96e' \
            '/tmp/apply-0.1.182.py' | sha256sum --check --strict
          python /tmp/apply-0.1.182.py
          rm -rf .github/scripts/0.1.182
          rm -f .github/scripts/apply_haos_live_fix_0_1_182.py

      - name: Validate shell syntax
        run: |
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/publish-discovery
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/prepare-data
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/maintain-profile
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/bridge/run
          bash -n tools/ci-haos-runtime-smoke.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Node, type, build and packaged runtime validation
        run: |
          npm test
          npm run typecheck
          npm run build
          tools/ci-haos-runtime-smoke.sh

      - name: Run Python integration validation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Run repository audits
        run: |
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-haos-live-fix-0.1.182.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: address HAOS live regressions 0.1.182'
          git push origin HEAD:fix/haos-live-control-discovery-naming-backpressure-0.1.182
