name: Apply reviewed Home Monitor 1.8.5 fix

on:
  push:
    branches:
      - fix/home-monitor-lifecycle-1.8.5
    paths:
      - .github/workflows/apply-home-monitor-1.8.5.yml

permissions:
  contents: write

concurrency:
  group: apply-home-monitor-1.8.5
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed source transformer
        run: python .github/scripts/apply_home_monitor_1_8_5.py
      - name: Commit source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_home_monitor_1_8_5.py
          # GITHUB_TOKEN has contents permission, not workflows permission.
          # Workflow edits and helper removal are done separately by the authorized connector.
          git restore .github/workflows/validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: retain Home Monitor page through state confirmation 1.8.5'
          git push origin HEAD:fix/home-monitor-lifecycle-1.8.5
