name: Integrate Home Monitor dashboard recovery 1.8.4

on:
  push:
    branches:
      - fix/home-monitor-dashboard-1.8.4
    paths:
      - .github/workflows/apply-home-monitor-card-1.8.4.yml
      - tools/ci-home-monitor-card-smoke.mjs
      - bridge/src/browser/home-monitor-card.ts

permissions:
  contents: write

concurrency:
  group: integrate-home-monitor-dashboard-1.8.4
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Integrate scoped dashboard probe and version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor: {old!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          command = 'bridge/src/browser/command-page.ts'
          replace(command,
              'import { clickExactSceneCard } from "./scene-dom.js";',
              'import { clickExactSceneCard } from "./scene-dom.js";\nimport { clickHomeMonitorCardAction, type HomeMonitorCardDiagnostics } from "./home-monitor-card.js";')
          replace(command,
              '  onHomeMonitorDialogDiagnostic?: (diagnostics: HomeMonitorDialogDiagnostics) => void;',
              '  onHomeMonitorDialogDiagnostic?: (diagnostics: HomeMonitorDialogDiagnostics) => void;\n  onHomeMonitorCardDiagnostic?: (diagnostics: HomeMonitorCardDiagnostics) => void;')
          replace(command,
              '  readonly #onHomeMonitorDialogDiagnostic: ((diagnostics: HomeMonitorDialogDiagnostics) => void) | undefined;',
              '  readonly #onHomeMonitorDialogDiagnostic: ((diagnostics: HomeMonitorDialogDiagnostics) => void) | undefined;\n  readonly #onHomeMonitorCardDiagnostic: ((diagnostics: HomeMonitorCardDiagnostics) => void) | undefined;')
          replace(command,
              '    this.#onHomeMonitorDialogDiagnostic = options?.onHomeMonitorDialogDiagnostic;',
              '    this.#onHomeMonitorDialogDiagnostic = options?.onHomeMonitorDialogDiagnostic;\n    this.#onHomeMonitorCardDiagnostic = options?.onHomeMonitorCardDiagnostic;')
          insertion = '''      // The dashboard may already expose two security actions, including SVG text.
                // Probe that exact card before attempting to open its current-state dialog.
                const dashboardResult = await clickHomeMonitorCardAction(
                  page, monitorLabels, modeLabelGroups,
                  { armAway: 0, armStay: 1, disarm: 2 }[input.action],
                  1_800, this.#onHomeMonitorCardDiagnostic
                );
                if (dashboardResult === "clicked") return;
                if (dashboardResult === "ambiguous") throw new Error("command_control_ambiguous");
                if (dashboardResult === "blocked") throw new Error("command_control_not_found");
                if (dashboardResult === "dialog") {
                  const modalResult = await clickRequestedText(10_000);
                  if (modalResult === "clicked") return;
                  if (modalResult === "ambiguous") throw new Error("command_control_ambiguous");
                  // Never fall through to an obscured dashboard when a modal is already open.
                  throw new Error("command_control_not_found");
                }

                let action = await findHomeMonitorCardAction('''
          insertion = '\n'.join(line[10:] if line.startswith('          ') else line for line in insertion.splitlines())
          replace(command, '      let action = await findHomeMonitorCardAction(', insertion)

          runtime = 'bridge/src/runtime.ts'
          callback = '''      onHomeMonitorCardDiagnostic: (diagnostics) =>
                  log.info(
                    `home_monitor_card:${diagnostics.outcome}` +
                    `:titles_${diagnostics.titles}:mode_groups_${diagnostics.modeGroups}` +
                    `:html_${diagnostics.htmlModes}:svg_${diagnostics.svgModes}` +
                    `:pseudo_${diagnostics.pseudoModes}:canvas_${diagnostics.canvases}` +
                    `:dialogs_${diagnostics.dialogs}:targets_${diagnostics.targets}`
                  ),
                onHomeMonitorDialogDiagnostic: (diagnostics) =>'''
          callback = '\n'.join(line[10:] if line.startswith('          ') else line for line in callback.splitlines())
          replace(runtime, '      onHomeMonitorDialogDiagnostic: (diagnostics) =>', callback)
          replace(runtime, 'const bridgeVersion = "1.8.3";', 'const bridgeVersion = "1.8.4";')
          replace('addon/smartthings_web_bridge/config.yaml', 'version: 1.8.3', 'version: 1.8.4')
          for file in ['package.json', 'package-lock.json', 'custom_components/smartthings_web/manifest.json', 'protocol/version.json']:
              p = Path(file)
              value = json.loads(p.read_text(encoding='utf-8'))
              field = 'bridge_version' if file == 'protocol/version.json' else 'version'
              if value[field] != '1.8.3':
                  raise SystemExit(f'{file}: unexpected version {value[field]}')
              value[field] = '1.8.4'
              if file == 'package-lock.json':
                  value['packages']['']['version'] = '1.8.4'
              p.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          for file in ['tests/addon-config.test.ts', 'tests/protocol-version-contract.test.ts']:
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              if '1.8.3' not in text:
                  raise SystemExit(f'{file}: missing current version assertion')
              p.write_text(text.replace('1.8.3', '1.8.4'), encoding='utf-8')
          replace('.github/workflows/validate.yml',
              '          node tools/ci-home-monitor-dialog-smoke.mjs',
              '          node tools/ci-home-monitor-dialog-smoke.mjs\n          node tools/ci-home-monitor-card-smoke.mjs')
          replace('README.md', '**현재 상태: `1.8.3` · 실환경 부분 검증**', '**현재 상태: `1.8.4` · 실환경 부분 검증**')
          replace('README.md',
              '`1.8.3`은 `0.1.183`에 반영된 최신 수정을 보존하며 Home Monitor 팝업 내부의 native 선택 상자·라디오·접근성 라벨·적용 버튼 처리를 보강합니다. 합성 화면을 실제 Chromium에서 검증하지만, 사용자 계정의 실제 Home Monitor 모드 변경 성공은 추가 확인이 필요합니다. Scene은 사용자가 실제 실행을 확인했고 이번 버전에서 실행 경로를 변경하지 않았습니다. 완료 확인 타임아웃은 별도 문제로 남습니다.',
              '`1.8.4`는 기존 팝업 처리를 유지하면서 대시보드 Home Monitor 카드의 `보안(실내)`·`보안(외출)` 직접 제어를 먼저 탐색합니다. HTML 외 SVG text/tspan, CSS 표시 문구와 분리된 접근성 라벨을 지원하며 Playwright 실제 포인터 클릭을 사용합니다. 최신 HA 로그에서 제어 실패가 계속됨을 확인했으며, 스크린샷만으로 실제 SVG 사용 여부나 근본 원인을 확정하지 않습니다. 합성 화면의 Chromium 회귀 테스트는 사용자 Samsung 계정의 실동작 검증과 구분합니다. Scene 실행 경로와 완료 확인 타임아웃 처리는 이번 버전에서 변경하지 않았습니다.')
          p = Path('addon/smartthings_web_bridge/CHANGELOG.md')
          notes = '''## 1.8.4

          - 사용자 최신 HA Core 로그의 Home Monitor `command_control_not_found`와 대시보드의 `보안(실내)`·`보안(외출)` 직접 제어 화면을 기준으로, 정확한 Home Monitor 카드의 모드 버튼을 팝업보다 먼저 찾는 경로를 추가했습니다.
          - 기존 `HTMLElement` 전용 텍스트 탐색이 SVG text/tspan을 제외하는 코드 결함을 합성 화면에서 재현하고 보완했습니다. SVG·HTML·CSS literal 표시 및 aria-labelledby를 구분하고 실제 Playwright 포인터 클릭을 사용합니다. 스크린샷만으로 실제 사용자 페이지가 SVG라고 확정하지 않습니다.
          - 중복 후보, 비활성 모드, 다른 카드 및 열린 모달 뒤쪽의 버튼은 클릭하지 않습니다. 탐색 노드와 시간을 제한하며 Canvas 좌표나 알 수 없는 모드 이름은 추측하지 않습니다. 실제 보안 상태 이벤트를 통한 성공 확인은 유지합니다.
          - `home_monitor_card:*` 로그에 HTML/SVG/CSS/Canvas 및 후보 개수만 기록합니다. 로그인·기기명·계정·쿠키·페이지 문구는 기록하지 않습니다.
          - 실제 Chromium에서 대시보드 회귀 시나리오 및 전체 command-page 경로를 검증하는 영구 CI 테스트를 추가했습니다. 실제 삼성 계정의 Home Monitor 성공은 아직 확인하지 않았습니다. Scene·로그인 세션·엔티티 ID·이벤트 폭주 억제 코드는 변경하지 않았습니다.

          '''
          notes = '\n'.join(line[10:] if line.startswith('          ') else line for line in notes.splitlines()) + '\n'
          p.write_text(notes + p.read_text(encoding='utf-8'), encoding='utf-8')
          PY
          rm .github/workflows/apply-home-monitor-card-1.8.4.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Unit tests, type checks and build
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Real Chromium dashboard and dialog regression
        run: |
          npx playwright-core install --with-deps chromium
          node tools/ci-home-monitor-card-smoke.mjs
          node tools/ci-home-monitor-dialog-smoke.mjs
      - name: Python integration validation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web
      - name: Package startup and repository audits
        run: |
          tools/ci-haos-runtime-smoke.sh
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: prioritize exact Home Monitor dashboard controls 1.8.4'
          git push origin HEAD:fix/home-monitor-dashboard-1.8.4
