name: Apply Home Monitor lifecycle 1.8.5

on:
  push:
    branches:
      - fix/home-monitor-confirmed-lifecycle-1.8.5
    paths:
      - .github/workflows/apply-home-monitor-lifecycle-1.8.5.yml
      - .github/scripts/apply_home_monitor_lifecycle_1_8_5.py
      - .github/scripts/complete_home_monitor_state_1_8_5.py
      - bridge/src/browser/home-monitor-post-action.ts
      - tools/ci-home-monitor-lifecycle-smoke.mjs

permissions:
  contents: write

concurrency:
  group: apply-home-monitor-lifecycle-1.8.5
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Reproduce the 1.8.4 lifecycle and metadata defects before applying the patch
        run: |
          npm ci
          npm run build
          npx playwright-core install --with-deps chromium
          node tools/ci-home-monitor-lifecycle-smoke.mjs --baseline
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { DeviceStore } from './dist/bridge/src/state/device-store.js';
          const store = new DeviceStore();
          store.observeAdvancedInventorySnapshot({locations:[{locationId:'loc_001',name:'Home'}]});
          const text = '42'+JSON.stringify(['api/subscription SECURITY_ARM_STATE_EVENT',{data:{location_id:'loc_001',arm_state:'ARMED_AWAY',event_time:'2026-08-25T00:00:02Z'}}]);
          store.observe({__sanitized:true,source:'playwright-websocket-frame',receivedAt:new Date().toISOString(),payload:{direction:'received',frame:{payload:text,truncated:false}},payloadHash:text});
          assert.equal(store.snapshot().locations[0].armState,'ARMED_AWAY');
          store.observeAdvancedInventorySnapshot({locations:[{locationId:'loc_001',name:'Home'}]});
          assert.equal(store.snapshot().locations[0].armState,undefined);
          store.close();
          console.log('REPRODUCED 1.8.4: Advanced location metadata erases observed security state');
          JS

      - name: Apply reviewed source and release update
        run: |
          python .github/scripts/apply_home_monitor_lifecycle_1_8_5.py
          python .github/scripts/complete_home_monitor_state_1_8_5.py

      - name: Validate Node, TypeScript and actual Chromium lifecycle
        run: |
          npm test
          npm run typecheck
          npm run build
          node tools/ci-home-monitor-dialog-smoke.mjs
          node tools/ci-home-monitor-card-smoke.mjs
          node tools/ci-home-monitor-lifecycle-smoke.mjs

      - name: Validate Python integration
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Validate packaged runtime and audits
        run: |
          tools/ci-haos-runtime-smoke.sh
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures

      - name: Commit verified product source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_home_monitor_lifecycle_1_8_5.py
          rm -f .github/scripts/complete_home_monitor_state_1_8_5.py
          # Workflow edits are applied separately through the authorized maintainer connection.
          # Do not ask the contents-only Actions token to update workflow definitions.
          git restore --source=HEAD --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --stat
          git commit -m 'fix: retain Home Monitor page and observed security state 1.8.5'
          git push origin HEAD:fix/home-monitor-confirmed-lifecycle-1.8.5
