name: Apply Home Monitor stability 0.1.170 v3

on:
  push:
    branches:
      - fix/home-monitor-stability-0.1.170
    paths:
      - .github/workflows/apply-home-monitor-stability-0.1.170-v3.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply, test, build, and commit stability patch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/home-monitor-stability-0.1.170
          fetch-depth: 0

      - name: Apply source patch from verified v2 recipe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(".github/workflows/apply-home-monitor-stability-0.1.170-v2.yml").read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit("v2 patch recipe markers changed")
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          recipe = dedent(body)
          namespace = {"__name__": "__main__"}
          exec(compile(recipe, "apply-home-monitor-stability-v2.py", "exec"), namespace)

          test_path = Path("bridge/tests/browser/home-monitor-stability.test.ts")
          test = test_path.read_text(encoding="utf-8")
          replacements = {
              "  filter(): MissingLocator { return new MissingLocator(); }":
                  "  filter(_options?: unknown): MissingLocator { return new MissingLocator(); }",
              "  getByRole(): MissingLocator { return new MissingLocator(); }":
                  "  getByRole(_role?: string, _options?: { name?: string | RegExp }): MissingLocator { return new MissingLocator(); }",
              "  getByText(): MissingLocator { return new MissingLocator(); }":
                  "  getByText(_text?: string, _options?: { exact?: boolean }): MissingLocator { return new MissingLocator(); }",
              "  locator(): MissingLocator { return new MissingLocator(); }":
                  "  locator(_selector?: string): MissingLocator { return new MissingLocator(); }",
              "  readonly evaluate = vi.fn(async () => false);":
                  "  async evaluate<Result>(_pageFunction?: unknown, _argument?: unknown): Promise<Result> { return false as Result; }",
              "  getByRole(): MissingLocator { return new MissingLocator(); }\n  getByText(text: string): MissingLocator {":
                  "  getByRole(_role?: string, _options?: { name?: string | RegExp }): MissingLocator { return new MissingLocator(); }\n  getByText(text: string, _options?: { exact?: boolean }): MissingLocator {",
              "  locator(): MissingLocator { return new MissingLocator(); }\n}":
                  "  locator(_selector?: string): MissingLocator { return new MissingLocator(); }\n}",
          }
          for old, new in replacements.items():
              if old not in test:
                  raise SystemExit(f"generated test signature changed: {old}")
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding="utf-8")
          PY

          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused regressions
        run: npm test -- bridge/tests/browser/home-monitor-stability.test.ts bridge/tests/browser/command-page.test.ts bridge/tests/runtime.test.ts

      - name: Run full tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build Bridge
        run: npm run build

      - name: Package Bridge app
        run: npm run package:addon

      - name: Compile Home Assistant integration
        run: python -m compileall -q custom_components/smartthings_web

      - name: Commit verified source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bridge/src/runtime.ts \
            bridge/src/browser/command-page.ts \
            bridge/tests/runtime.test.ts \
            bridge/tests/browser/home-monitor-stability.test.ts \
            custom_components/smartthings_web/manifest.json \
            addon/smartthings_web_bridge/config.yaml \
            addon/smartthings_web_bridge/CHANGELOG.md \
            package.json \
            package-lock.json \
            protocol/version.json \
            tests/addon-config.test.ts \
            tests/protocol-version-contract.test.ts
          git commit -m "fix: keep realtime stable during Home Monitor commands"
          git push origin "HEAD:${GITHUB_REF_NAME}"
