name: Apply Home Monitor stability 0.1.170

on:
  push:
    branches:
      - fix/home-monitor-stability-0.1.170
    paths:
      - .github/workflows/apply-home-monitor-stability-0.1.170.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply, test, and commit stability patch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/home-monitor-stability-0.1.170
          fetch-depth: 0

      - name: Apply source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              lines = dedent(value).strip("\n").splitlines()
              if any(not line.startswith("|") for line in lines):
                  raise SystemExit("invalid block margin")
              return "\n".join(line[1:] for line in lines)

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          runtime_path = "bridge/src/runtime.ts"

          replace_once(
              runtime_path,
              'const SESSION_TOUCH_INTERVAL_MS = 5 * 60_000;\n',
              'const SESSION_TOUCH_INTERVAL_MS = 5 * 60_000;\nconst DETAIL_DISCOVERY_INTERVAL_MS = 15_000;\n',
          )

          replace_once(
              runtime_path,
              block("""
              |  const detailDiscoveryInterval = setInterval(() => {
              |    void detailDiscovery.runOne().then((result) => {
              |      if (result !== "failed") return;
              |      const current = status.getSnapshot();
              |      status.update({
              |        detailDiscoveryFailureCount: current.detailDiscoveryFailureCount + 1
              |      });
              |      const failure = detailDiscovery.lastFailure();
              |      log.warn(
              |        failure
              |          ? `detail_discovery_failed:${failure.reason}:${failure.deviceId}`
              |          : "detail_discovery_failed"
              |      );
              |    });
              |  }, 1_000);
              """),
              block("""
              |  const detailDiscoveryInterval = setInterval(() => {
              |    void detailDiscovery.runOne().then((result) => {
              |      if (result !== "failed") return;
              |      const current = status.getSnapshot();
              |      status.update({
              |        detailDiscoveryFailureCount: current.detailDiscoveryFailureCount + 1
              |      });
              |      const failure = detailDiscovery.lastFailure();
              |      log.warn(
              |        failure
              |          ? `detail_discovery_failed:${failure.reason}:${failure.deviceId}`
              |          : "detail_discovery_failed"
              |      );
              |    });
              |  }, DETAIL_DISCOVERY_INTERVAL_MS);
              |  detailDiscoveryInterval.unref();
              """),
          )

          replace_once(
              runtime_path,
              block("""
              |  installBrowserObserver(context, sink, redact, {
              |    onRawWebSocketFrame: (direction, payload, connectionId) => {
              |      volatileIdentifiers.observeRawWebSocketFrame(direction, payload);
              |      cameraImages.observeRawWebSocketFrame(direction, payload, connectionId);
              |    },
              |    onRawWebSocketBinaryFrame: (direction, payload, connectionId) => {
              |      cameraImages.observeRawWebSocketBinaryFrame(direction, payload, connectionId);
              |    },
              |    onSmartThingsWebSocketFrame: observeSmartThingsWebSocketFrame,
              |    onSmartThingsWebSocketClose: recoverSmartThingsWebSocket
              |  });
              """),
              block("""
              |  installBrowserObserver(context, sink, redact, {
              |    onRawWebSocketFrame: (direction, payload, connectionId) => {
              |      volatileIdentifiers.observeRawWebSocketFrame(direction, payload);
              |      cameraImages.observeRawWebSocketFrame(direction, payload, connectionId);
              |    },
              |    onRawWebSocketBinaryFrame: (direction, payload, connectionId) => {
              |      cameraImages.observeRawWebSocketBinaryFrame(direction, payload, connectionId);
              |    }
              |  });
              """),
          )

          replace_once(
              runtime_path,
              block("""
              |      observeSmartThingsWebSocketFrame,
              |      recoverSmartThingsWebSocket,
              |      onAdvancedDeviceSnapshot
              |    );
              """),
              block("""
              |      observeSmartThingsWebSocketFrame,
              |      recoverSmartThingsWebSocket,
              |      onAdvancedDeviceSnapshot,
              |      () => keeperManager.currentKeeper() === page
              |    );
              """),
          )

          replace_once(
              runtime_path,
              block("""
              |    observeSmartThingsWebSocketFrame,
              |    recoverSmartThingsWebSocket,
              |    onAdvancedDeviceSnapshot
              |  );
              """),
              block("""
              |    observeSmartThingsWebSocketFrame,
              |    recoverSmartThingsWebSocket,
              |    onAdvancedDeviceSnapshot,
              |    (page) => keeperManager.currentKeeper() === page
              |  );
              """),
          )

          replace_once(
              runtime_path,
              block("""
              |  onSmartThingsWebSocketFrame: (direction: "sent" | "received") => void,
              |  onSmartThingsWebSocketClose: () => void,
              |  onAdvancedDeviceSnapshot: (snapshot: unknown, url: string) => void
              |): Promise<void> {
              |  await Promise.all(
              """),
              block("""
              |  onSmartThingsWebSocketFrame: (direction: "sent" | "received") => void,
              |  onSmartThingsWebSocketClose: () => void,
              |  onAdvancedDeviceSnapshot: (snapshot: unknown, url: string) => void,
              |  isRealtimeKeeper: (page: BrowserPageLike) => boolean
              |): Promise<void> {
              |  await Promise.all(
              """),
          )

          replace_once(
              runtime_path,
              block("""
              |        onSmartThingsWebSocketFrame,
              |        onSmartThingsWebSocketClose,
              |        onAdvancedDeviceSnapshot
              |      )
              """),
              block("""
              |        onSmartThingsWebSocketFrame,
              |        onSmartThingsWebSocketClose,
              |        onAdvancedDeviceSnapshot,
              |        () => isRealtimeKeeper(page)
              |      )
              """),
          )

          replace_once(
              runtime_path,
              block("""
              |  onSmartThingsWebSocketFrame: (direction: "sent" | "received") => void,
              |  onSmartThingsWebSocketClose: () => void,
              |  onAdvancedDeviceSnapshot: (snapshot: unknown, url: string) => void
              |): Promise<void> {
              |  if (observedCdpPages.has(page) || !context.newCDPSession) {
              """),
              block("""
              |  onSmartThingsWebSocketFrame: (direction: "sent" | "received") => void,
              |  onSmartThingsWebSocketClose: () => void,
              |  onAdvancedDeviceSnapshot: (snapshot: unknown, url: string) => void,
              |  isRealtimeKeeper: () => boolean
              |): Promise<void> {
              |  if (observedCdpPages.has(page) || !context.newCDPSession) {
              """),
          )

          replace_once(
              runtime_path,
              block("""
              |      onSmartThingsWebSocketFrame,
              |      onSmartThingsWebSocketClose,
              |      onSmartThingsAdvancedDeviceSnapshot: (snapshot, url) => {
              """),
              block("""
              |      onSmartThingsWebSocketFrame: (direction, url, connectionId) => {
              |        if (isRealtimeKeeper()) {
              |          onSmartThingsWebSocketFrame(direction, url, connectionId);
              |        }
              |      },
              |      onSmartThingsWebSocketClose: (url, connectionId) => {
              |        if (isRealtimeKeeper()) {
              |          onSmartThingsWebSocketClose(url, connectionId);
              |        }
              |      },
              |      onSmartThingsAdvancedDeviceSnapshot: (snapshot, url) => {
              """),
          )

          replace_once(
              runtime_path,
              block("""
              |        (snapshot, url) => {
              |          onAdvancedDeviceSnapshot(snapshot, url);
              |          if (isWholeAdvancedDevicesSnapshotUrl(url)) {
              |            wholeSnapshotSeen = true;
              |            resolveWholeSnapshot?.();
              |          }
              |        }
              |      )
              """),
              block("""
              |        (snapshot, url) => {
              |          onAdvancedDeviceSnapshot(snapshot, url);
              |          if (isWholeAdvancedDevicesSnapshotUrl(url)) {
              |            wholeSnapshotSeen = true;
              |            resolveWholeSnapshot?.();
              |          }
              |        },
              |        () => false
              |      )
              """),
          )

          command_path = "bridge/src/browser/command-page.ts"

          replace_once(
              command_path,
              block("""
              |      const actionName = locationActionName(input.action);
              |      const locationName = input.locationNames?.[input.locationId];
              |      const monitorName = homeMonitorName(locationName);
              |      let action = await findHomeMonitorCardAction(
              |        page,
              |        monitorName,
              |        homeMonitorLabels(locationName),
              |        actionName,
              |        15_000
              |      );
              """),
              block("""
              |      const actionName = locationActionName(input.action);
              |      const locationName = input.locationNames?.[input.locationId];
              |      const monitorName = homeMonitorName(locationName);
              |      const monitorLabels = homeMonitorLabels(locationName);
              |      let action = await findHomeMonitorCardAction(
              |        page,
              |        monitorName,
              |        monitorLabels,
              |        actionName,
              |        15_000
              |      );
              |      if (
              |        !action &&
              |        await clickHomeMonitorCardActionByText(
              |          page,
              |          monitorLabels,
              |          locationActionLabels(input.action)
              |        )
              |      ) {
              |        return;
              |      }
              """),
          )

          old_helpers = block("""
          |async function findLocationActionControl(
          |  scope: CommandControlSurface,
          |  actionName: RegExp,
          |  timeoutMs: number
          |): Promise<CommandLocatorLike | undefined> {
          |  for (const role of ["button", "radio", "tab"]) {
          |    const candidate = scope.getByRole(role, { name: actionName });
          |    const count = await candidate.count();
          |    if (count > 1) throw new Error("command_control_ambiguous");
          |    if (count !== 1) continue;
          |    try {
          |      await candidate.first().waitFor({ state: "visible", timeout: timeoutMs });
          |      return candidate;
          |    } catch {
          |      continue;
          |    }
          |  }
          |  return undefined;
          |}
          |
          |async function findHomeMonitorCardAction(
          |  scope: CommandControlSurface,
          |  monitorName: RegExp,
          |  monitorLabels: readonly string[],
          |  actionName: RegExp,
          |  timeoutMs: number
          |): Promise<CommandLocatorLike | undefined> {
          |  let title: CommandLocatorLike | undefined;
          |  const heading = scope.getByRole("heading", { name: monitorName });
          |  const headingCount = await heading.count();
          |  if (headingCount > 1) throw new Error("command_control_ambiguous");
          |  if (headingCount === 1) {
          |    try {
          |      await heading.first().waitFor({ state: "visible", timeout: timeoutMs });
          |      title = heading.first();
          |    } catch {
          |      // Exact text variants below cover non-heading card titles.
          |    }
          |  }
          |
          |  if (!title) {
          |    for (const label of monitorLabels) {
          |      const candidate = scope.getByText(label, { exact: true });
          |      const count = await candidate.count();
          |      if (count > 1) throw new Error("command_control_ambiguous");
          |      if (count !== 1) continue;
          |      try {
          |        await candidate.first().waitFor({ state: "visible", timeout: timeoutMs });
          |        title = candidate.first();
          |        break;
          |      } catch {
          |        continue;
          |      }
          |    }
          |  }
          |  if (!title) return undefined;
          |
          |  let cardScope = title;
          |  for (let depth = 0; depth < 8; depth += 1) {
          |    const action = await findLocationActionControl(
          |      cardScope,
          |      actionName,
          |      Math.min(timeoutMs, 250)
          |    );
          |    if (action) return action;
          |    cardScope = cardScope.locator("..");
          |  }
          |  return undefined;
          |}
          |async function findHomeMonitorControl(
          |  scope: CommandControlSurface,
          |  monitorName: RegExp
          |): Promise<CommandLocatorLike | undefined> {
          |  for (const role of ["button", "link"]) {
          |    const candidate = scope.getByRole(role, { name: monitorName });
          |    const count = await candidate.count();
          |    if (count > 1) throw new Error("command_control_ambiguous");
          |    if (count === 1) {
          |      try {
          |        await candidate.first().waitFor({ state: "visible", timeout: 15_000 });
          |        return candidate;
          |      } catch {
          |        continue;
          |      }
          |    }
          |  }
          |  return undefined;
          |}
          """)

          new_helpers = block("""
          |async function firstVisibleCandidate(
          |  candidates: readonly CommandLocatorLike[],
          |  timeoutMs: number
          |): Promise<CommandLocatorLike | undefined> {
          |  if (candidates.length === 0) return undefined;
          |  try {
          |    return await Promise.any(
          |      candidates.map(async (candidate) => {
          |        await candidate.first().waitFor({
          |          state: "visible",
          |          timeout: Math.max(1, timeoutMs)
          |        });
          |        return candidate;
          |      })
          |    );
          |  } catch {
          |    return undefined;
          |  }
          |}
          |
          |async function findLocationActionControl(
          |  scope: CommandControlSurface,
          |  actionName: RegExp,
          |  timeoutMs: number
          |): Promise<CommandLocatorLike | undefined> {
          |  const candidate = await firstVisibleCandidate(
          |    ["button", "radio", "tab"].map((role) =>
          |      scope.getByRole(role, { name: actionName })
          |    ),
          |    timeoutMs
          |  );
          |  if (!candidate) return undefined;
          |  const count = await candidate.count();
          |  if (count > 1) throw new Error("command_control_ambiguous");
          |  return count === 1 ? candidate : undefined;
          |}
          |
          |async function findHomeMonitorCardAction(
          |  scope: CommandControlSurface,
          |  monitorName: RegExp,
          |  monitorLabels: readonly string[],
          |  actionName: RegExp,
          |  timeoutMs: number
          |): Promise<CommandLocatorLike | undefined> {
          |  const title = await firstVisibleCandidate(
          |    [
          |      scope.getByRole("heading", { name: monitorName }),
          |      ...monitorLabels.map((label) => scope.getByText(label, { exact: true }))
          |    ],
          |    timeoutMs
          |  );
          |  if (!title) return undefined;
          |  const titleCount = await title.count();
          |  if (titleCount > 1) throw new Error("command_control_ambiguous");
          |  if (titleCount !== 1) return undefined;
          |
          |  let cardScope = title;
          |  for (let depth = 0; depth < 8; depth += 1) {
          |    const action = await findLocationActionControl(
          |      cardScope,
          |      actionName,
          |      Math.min(timeoutMs, 250)
          |    );
          |    if (action) return action;
          |    cardScope = cardScope.locator("..");
          |  }
          |  return undefined;
          |}
          |
          |async function findHomeMonitorControl(
          |  scope: CommandControlSurface,
          |  monitorName: RegExp
          |): Promise<CommandLocatorLike | undefined> {
          |  const candidate = await firstVisibleCandidate(
          |    ["button", "link"].map((role) =>
          |      scope.getByRole(role, { name: monitorName })
          |    ),
          |    15_000
          |  );
          |  if (!candidate) return undefined;
          |  const count = await candidate.count();
          |  if (count > 1) throw new Error("command_control_ambiguous");
          |  return count === 1 ? candidate : undefined;
          |}
          |
          |async function clickHomeMonitorCardActionByText(
          |  page: CommandPageLike,
          |  monitorLabels: readonly string[],
          |  actionLabels: readonly string[]
          |): Promise<boolean> {
          |  if (!page.evaluate) return false;
          |  try {
          |    return await page.evaluate(
          |      ({ monitorLabels, actionLabels }) => {
          |        const normalize = (value: string | null | undefined) =>
          |          (value ?? "").replace(/\\s+/gu, " ").trim().toLocaleLowerCase();
          |        const visible = (element: Element) => {
          |          const style = getComputedStyle(element);
          |          const rect = element.getBoundingClientRect();
          |          return (
          |            style.display !== "none" &&
          |            style.visibility !== "hidden" &&
          |            rect.width > 0 &&
          |            rect.height > 0
          |          );
          |        };
          |        const monitorNames = new Set(monitorLabels.map(normalize));
          |        const actionNames = new Set(actionLabels.map(normalize));
          |        const titles = [...document.querySelectorAll("h1,h2,h3,h4,h5,h6,div,span,p")]
          |          .filter((element) => visible(element) && monitorNames.has(normalize(element.textContent)));
          |        const matches = new Set<HTMLElement>();
          |        for (const title of titles) {
          |          let scope: Element | null = title;
          |          for (let depth = 0; scope && depth < 8; depth += 1, scope = scope.parentElement) {
          |            const controls = scope.matches("button,[role='button'],a,input[type='button'],input[type='submit']")
          |              ? [scope]
          |              : [...scope.querySelectorAll("button,[role='button'],a,input[type='button'],input[type='submit']")];
          |            for (const control of controls) {
          |              if (!(control instanceof HTMLElement) || !visible(control)) continue;
          |              const inputValue = control instanceof HTMLInputElement ? control.value : undefined;
          |              const label =
          |                control.getAttribute("aria-label") ??
          |                inputValue ??
          |                control.textContent;
          |              if (actionNames.has(normalize(label))) matches.add(control);
          |            }
          |            if (matches.size > 0) break;
          |          }
          |        }
          |        if (matches.size !== 1) return false;
          |        [...matches][0]?.click();
          |        return true;
          |      },
          |      { monitorLabels: [...monitorLabels], actionLabels: [...actionLabels] }
          |    );
          |  } catch {
          |    return false;
          |  }
          |}
          """)
          replace_once(command_path, old_helpers, new_helpers)

          replace_once(
              command_path,
              block("""
              |function locationActionName(action: "armAway" | "armStay" | "disarm"): RegExp {
              """),
              block("""
              |function locationActionLabels(action: "armAway" | "armStay" | "disarm"): string[] {
              |  if (action === "armAway") {
              |    return ["Arm away", "Away", "Away mode", "외출", "외출 모드", "외출 중", "외출중", "보안(외출)", "보안 외출"];
              |  }
              |  if (action === "armStay") {
              |    return ["Arm stay", "Stay", "Stay mode", "실내", "실내 모드", "재실", "재실 모드", "재실 중", "재실중", "집에 있음", "귀가", "보안(실내)", "보안(재실)", "보안 실내", "보안 재실"];
              |  }
              |  return ["Disarm", "Disarmed", "Off", "해제", "해제됨", "보안 해제", "보안(해제)", "사용 안 함"];
              |}
              |
              |function locationActionName(action: "armAway" | "armStay" | "disarm"): RegExp {
              """),
          )

          Path("bridge/tests/browser/home-monitor-stability.test.ts").write_text(
              block("""
              |import { readFileSync } from "node:fs";
              |import { describe, expect, test, vi } from "vitest";
              |
              |import { SmartThingsWebUiCommandExecutor } from "../../src/browser/command-page.js";
              |
              |class MissingLocator {
              |  click = vi.fn(async () => undefined);
              |  async count(): Promise<number> { return 0; }
              |  dispatchEvent = vi.fn(async () => undefined);
              |  fill = vi.fn(async () => undefined);
              |  filter(): MissingLocator { return this; }
              |  first(): MissingLocator { return this; }
              |  getByRole(): MissingLocator { return this; }
              |  getByText(): MissingLocator { return this; }
              |  async isVisible(): Promise<boolean> { return false; }
              |  locator(): MissingLocator { return this; }
              |  async waitFor(): Promise<void> { throw new Error("not visible"); }
              |}
              |
              |class ActionLocator extends MissingLocator {
              |  override click = vi.fn(async () => undefined);
              |  override async count(): Promise<number> { return 1; }
              |  override async waitFor(): Promise<void> { return undefined; }
              |}
              |
              |class CardLocator extends MissingLocator {
              |  constructor(private readonly action: ActionLocator) { super(); }
              |  override getByRole(role: string, options?: { name?: string | RegExp }): MissingLocator {
              |    return role === "button" && options?.name instanceof RegExp && options.name.test("보안(외출)")
              |      ? this.action
              |      : new MissingLocator();
              |  }
              |}
              |
              |class DelayedTitleLocator extends MissingLocator {
              |  constructor(private readonly card: CardLocator) { super(); }
              |  override async count(): Promise<number> { return 1; }
              |  override async waitFor(): Promise<void> {
              |    await new Promise((resolve) => setTimeout(resolve, 20));
              |  }
              |  override locator(selector: string): MissingLocator {
              |    return selector === ".." ? this.card : new MissingLocator();
              |  }
              |}
              |
              |class DelayedDashboardPage {
              |  currentUrl = "https://my.smartthings.com/location/raw-sparkplus";
              |  closed = false;
              |  readonly close = vi.fn(async () => { this.closed = true; });
              |  readonly goto = vi.fn(async (url: string) => { this.currentUrl = url; });
              |  readonly action = new ActionLocator();
              |  readonly card = new CardLocator(this.action);
              |  readonly title = new DelayedTitleLocator(this.card);
              |  readonly evaluate = vi.fn(async () => false);
              |  url(): string { return this.currentUrl; }
              |  isClosed(): boolean { return this.closed; }
              |  getByRole(): MissingLocator { return new MissingLocator(); }
              |  getByText(text: string): MissingLocator {
              |    return text === "SmartThings Home Monitor" ? this.title : new MissingLocator();
              |  }
              |  locator(): MissingLocator { return new MissingLocator(); }
              |}
              |
              |describe("Home Monitor command stability", () => {
              |  test("waits for the Sparkplus dashboard to hydrate before clicking 보안(외출)", async () => {
              |    const page = new DelayedDashboardPage();
              |    const manager = { openCommandPage: vi.fn(async () => page) };
              |    const executor = new SmartThingsWebUiCommandExecutor(
              |      () => manager,
              |      () => "loc_spark",
              |      { resolveRawLocationId: () => "raw-sparkplus" }
              |    );
              |
              |    await executor.executeLocationAction({
              |      locationId: "loc_spark",
              |      locationNames: { loc_spark: "Sparkplus" },
              |      action: "armAway"
              |    });
              |
              |    expect(page.action.click).toHaveBeenCalledWith({ timeout: 15_000 });
              |    expect(page.close).toHaveBeenCalledTimes(1);
              |  });
              |
              |  test("limits realtime close recovery to the persistent keeper page", () => {
              |    const runtime = readFileSync("bridge/src/runtime.ts", "utf8");
              |    expect(runtime).not.toContain("onSmartThingsWebSocketClose: recoverSmartThingsWebSocket");
              |    expect(runtime).toContain("() => keeperManager.currentKeeper() === page");
              |    expect(runtime).toContain("if (isRealtimeKeeper())");
              |    expect(runtime).toContain("() => false");
              |  });
              |
              |  test("does not open a full detail page every second", () => {
              |    const runtime = readFileSync("bridge/src/runtime.ts", "utf8");
              |    expect(runtime).toContain("const DETAIL_DISCOVERY_INTERVAL_MS = 15_000;");
              |    expect(runtime).toContain("}, DETAIL_DISCOVERY_INTERVAL_MS);");
              |  });
              |});
              """),
              encoding="utf-8",
          )

          replace_once(runtime_path, 'const bridgeVersion = "0.1.169";', 'const bridgeVersion = "0.1.170";')
          replace_once(
              "custom_components/smartthings_web/manifest.json",
              '"version": "0.1.169"',
              '"version": "0.1.170"',
          )
          replace_once(
              "addon/smartthings_web_bridge/config.yaml",
              "version: 0.1.169",
              "version: 0.1.170",
          )
          replace_once("package.json", '"version": "0.1.169"', '"version": "0.1.170"')

          lock_path = Path("package-lock.json")
          lock_text = lock_path.read_text(encoding="utf-8")
          if lock_text.count('"version": "0.1.169"') != 2:
              raise SystemExit("package-lock.json: unexpected current-version count")
          lock_path.write_text(
              lock_text.replace('"version": "0.1.169"', '"version": "0.1.170"'),
              encoding="utf-8",
          )

          protocol_path = Path("protocol/version.json")
          protocol_text = protocol_path.read_text(encoding="utf-8")
          if protocol_text.count("0.1.169") != 1:
              raise SystemExit("protocol/version.json: unexpected current-version count")
          protocol_path.write_text(protocol_text.replace("0.1.169", "0.1.170"), encoding="utf-8")

          for name, expected in {
              "tests/addon-config.test.ts": 6,
              "tests/protocol-version-contract.test.ts": 2,
          }.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              actual = text.count("0.1.169")
              if actual != expected:
                  raise SystemExit(f"{name}: expected {expected} old-version matches, found {actual}")
              path.write_text(text.replace("0.1.169", "0.1.170"), encoding="utf-8")

          changelog_path = Path("addon/smartthings_web_bridge/CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          if not changelog.startswith("## 0.1.169\n"):
              raise SystemExit("CHANGELOG.md: unexpected release head")
          notes = (
              "## 0.1.170\n\n"
              "- 임시 명령·상세 조회 페이지의 Socket.IO 종료를 영구 Location keeper 연결 종료로 오인하지 않도록 실시간 복구 신호를 keeper 페이지에만 제한했습니다.\n"
              "- 수백 개 장치의 상세 페이지를 1초마다 연속으로 열던 자동 탐색을 15초 간격으로 완화해 Chromium CPU·메모리 급증과 Home Assistant 연결 끊김을 줄였습니다.\n"
              "- Sparkplus 대시보드의 React 렌더링이 끝날 때까지 `SmartThings Home Monitor` 카드와 `보안(외출)`·`보안(실내)` 컨트롤을 기다리고, 접근성 역할이 없는 경우에도 카드 내부의 정확한 표시 문자열만 제한적으로 클릭합니다.\n"
              "- 임시 페이지 종료 범위, 지연 렌더링 Home Monitor 및 상세 탐색 주기에 대한 회귀 테스트를 추가했습니다.\n\n"
          )
          changelog_path.write_text(notes + changelog, encoding="utf-8")
          PY

          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused regressions
        run: npm test -- bridge/tests/browser/home-monitor-stability.test.ts bridge/tests/browser/command-page.test.ts bridge/tests/runtime.test.ts

      - name: Run full tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build Bridge
        run: npm run build

      - name: Package Bridge app
        run: npm run package:addon

      - name: Compile Home Assistant integration
        run: python -m compileall -q custom_components/smartthings_web

      - name: Commit verified source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bridge/src/runtime.ts \
            bridge/src/browser/command-page.ts \
            bridge/tests/browser/home-monitor-stability.test.ts \
            custom_components/smartthings_web/manifest.json \
            addon/smartthings_web_bridge/config.yaml \
            addon/smartthings_web_bridge/CHANGELOG.md \
            package.json \
            package-lock.json \
            protocol/version.json \
            tests/addon-config.test.ts \
            tests/protocol-version-contract.test.ts
          git commit -m "fix: keep realtime stable during Home Monitor commands"
          git push origin "HEAD:${GITHUB_REF_NAME}"
