name: Apply Home Monitor text-pill 0.1.172 v3

on:
  push:
    branches:
      - fix/home-monitor-text-pill-0.1.172
    paths:
      - .github/workflows/apply-home-monitor-text-pill-0.1.172-v3.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply, test, build, and commit 0.1.172
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/home-monitor-text-pill-0.1.172
          fetch-depth: 0

      - name: Apply source patch from v2 recipe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/apply-home-monitor-text-pill-0.1.172-v2.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          compile(script, "apply-home-monitor-0.1.172", "exec")
          exec(script, {"__name__": "__main__"})
          PY

          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check "aiohttp>=3.10,<4" "yarl>=1.9,<2" "voluptuous>=0.15,<1"

      - name: Run focused regressions
        run: >-
          npm test --
          bridge/tests/browser/home-monitor-dom.test.ts
          bridge/tests/browser/home-monitor-stability.test.ts
          bridge/tests/browser/command-page.test.ts
          bridge/tests/runtime.test.ts

      - name: Run full Node tests
        run: npm test

      - name: Type-check and build
        run: |
          npm run typecheck
          npm run build
          npm run package:addon

      - name: Run Home Assistant integration tests
        run: |
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p "test_*.py"

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "1bobby-git"
          git config user.email "66291955+1bobby-git@users.noreply.github.com"
          git add \
            addon/smartthings_web_bridge/CHANGELOG.md \
            addon/smartthings_web_bridge/config.yaml \
            bridge/src/browser/command-page.ts \
            bridge/src/runtime.ts \
            custom_components/smartthings_web/manifest.json \
            package-lock.json \
            package.json \
            protocol/version.json \
            tests/addon-config.test.ts \
            tests/protocol-version-contract.test.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: control text-only Home Monitor mode pills"
          git push origin HEAD
