name: Apply inventory backpressure 0.1.175

on:
  push:
    branches:
      - fix/inventory-backpressure-0.1.175
    paths:
      - tools/apply-inventory-backpressure-0.1.175.py.gz.b64
      - .github/workflows/apply-inventory-backpressure-0.1.175.yml

permissions:
  contents: write

concurrency:
  group: apply-inventory-backpressure-0.1.175
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Decode and apply source changes
        run: |
          base64 --decode tools/apply-inventory-backpressure-0.1.175.py.gz.b64 | gzip --decompress > tools/apply-inventory-backpressure-0.1.175.py
          python -m py_compile tools/apply-inventory-backpressure-0.1.175.py
          python tools/apply-inventory-backpressure-0.1.175.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run focused inventory backpressure tests
        run: |
          npx vitest run bridge/tests/state/inventory-backpressure.test.ts bridge/tests/server/sse-event-writer.test.ts
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_inventory_backpressure.py'

      - name: Run full Node validation
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Run full Python validation
        run: |
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Run security and API audits
        run: |
          npm run audit:api-free
          npm run audit:secrets

      - name: Remove one-time transformer
        run: |
          rm -f tools/apply-inventory-backpressure-0.1.175.py
          rm -f tools/apply-inventory-backpressure-0.1.175.py.gz.b64
          rm -f .github/workflows/apply-inventory-backpressure-0.1.175.yml

      - name: Commit verified product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: bound SmartThings inventory event storms 0.1.175'
          git push origin HEAD:fix/inventory-backpressure-0.1.175
