name: Apply verified inventory worker
on:
  push:
    branches: [fix/inventory-worker-1.8.35]
    paths: [.github/workflows/apply-inventory-worker.yml]
permissions:
  contents: write
concurrency:
  group: apply-inventory-worker-1.8.35
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/inventory-worker-1.8.35
          fetch-depth: 0
      - name: Verify patch checksum, scope and exact final source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('.')
          base = '0110aefdafd452bfc69b99bcc276633f04dcfe24'
          payloads = [f'.github/inventory-worker.patch.b64.{n}' for n in (1, 2, 3)]
          workflow = '.github/workflows/apply-inventory-worker.yml'
          validation = '.github/workflows/validate.yml'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          if git('rev-parse', 'origin/main') != base:
              raise SystemExit('Main advanced; review required')
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) != {*payloads, workflow, validation}:
              raise SystemExit('Unexpected branch changes')
          if git('hash-object', validation) != '15643e5e6f4c767dc6cfb8bacdbf4739bb781663':
              raise SystemExit('Validation gate differs from reviewed candidate')
          encoded = ''.join((root / path).read_text().strip() for path in payloads)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=128*1024*1024)
          expected = '114507aefb8206870996f5f255cdd9ea5c16efa81dcb793a1ee3776e2de3510b'
          if len(patch) != 59787 or hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed patch checksum mismatch')
          if json.loads((root / 'package.json').read_text())['version'] != '1.8.34':
              raise SystemExit('Unexpected base version')
          allowed = {
              'CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md',
              'addon/smartthings_web_bridge/config.yaml',
              'addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/prepare-data',
              'bridge/src/runtime.ts', 'bridge/src/state/device-store.ts',
              'bridge/src/state/inventory-writer-thread.ts', 'bridge/src/state/inventory-writer.ts',
              'bridge/tests/runtime.test.ts', 'bridge/tests/state/inventory-worker.test.ts',
              'custom_components/smartthings_web/manifest.json', 'docs/INVENTORY_WORKER_1.8.35.md',
              'package-lock.json', 'package.json', 'protocol/version.json',
              'tests/addon-config.test.ts', 'tests/protocol-version-contract.test.ts',
              'tools/ci-haos-runtime-smoke.sh', 'tools/ci-inventory-worker-smoke.mjs'
          }
          if set(re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M)) != allowed:
              raise SystemExit('Unexpected patch scope')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'rm', '--', *payloads], check=True)
          verify_index = (root / '.git/inventory-verify-index').resolve()
          shutil.copyfile('.git/index', verify_index)
          env = {**os.environ, 'GIT_INDEX_FILE': str(verify_index)}
          try:
              git('update-index', '--force-remove', workflow, env=env)
              tree = git('write-tree', env=env)
              if tree != 'fb7613848ebd0651474f53174dd348a51d14a92c':
                  raise SystemExit('Unexpected final source tree: ' + tree)
          finally:
              verify_index.unlink(missing_ok=True)
          print('Verified patch SHA256:', expected)
          print('Verified final source tree:', tree)
          PY
          git diff --cached --check
          git diff --cached --stat
      - name: Commit isolated candidate without touching main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: move inventory serialization and SQLite writes off the command event loop (1.8.35)'
          git push origin HEAD:fix/inventory-worker-1.8.35
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
