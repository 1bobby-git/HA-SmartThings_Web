name: Apply light confirmation repair
on:
  push:
    branches: [fix/light-confirmation-1.8.19]
    paths: [.github/workflows/apply-light-confirmation.yml]
permissions:
  contents: write
concurrency:
  group: apply-light-confirmation-1.8.19
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-SmartThings_Web' && github.ref == 'refs/heads/fix/light-confirmation-1.8.19'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-confirmation-1.8.19
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Apply exact source and regression changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5da701feb1bd28751ae6af83d2d8b7419ff103e0 HEAD
          git diff --quiet bbb252f97515a12d16fd8f5d7dedbc1ef193546f HEAD -- bridge/src custom_components package.json package-lock.json protocol/version.json addon README.md
          python tools/prepare-light-confirmation.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('custom_components/smartthings_web/tests/test_light.py')
          text = p.read_text()
          old = '''            async def async_execute_command(self, **kwargs: object) -> None:
                          self.calls.append(kwargs)
          
                  client = Client()
                  runtime = SimpleNamespace(
                      client=client,
                      inventory=SimpleNamespace(devices={device.device_id: device}),
                  )'''
          new = '''            async def async_execute_command(self, **kwargs: object) -> None:
                          self.calls.append(kwargs)
          
                      async def async_get_inventory(self) -> BridgeInventory:
                          return runtime.inventory
          
                  client = Client()
                  runtime = SmartThingsWebRuntime(
                      client, "loc_001",
                      BridgeInventory(1, True, "test", "5", {}, {}, {device.device_id: device}),
                  )'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          expected = {
              'bridge/src/command/command-service.ts': '7e61a0a68801e56d236306e7d6bb5419913a118789b1c48773941346fbbf9e50',
              'bridge/src/state/device-store.ts': 'a4e75fcc1e87a00e182325ed09d6c198999215928a781b170c54f88b107218e4',
              'bridge/src/runtime.ts': '042c0ae7b9b2d511c3ec99a3240d084aac4ff81529091c1a77b86ea5245dc786',
              'custom_components/smartthings_web/light.py': '3a4f789a1c0a7f4e0696f9eee5cb2e045044e0c8ee3ed89918ddd4a74ffe7e9c',
              'README.md': '5c4dbcb76057baab92c92a0cf119d45a5124b67709300caab1b2664c5295038b',
          }
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          PY
          rm tools/light-confirmation.patch.part1 tools/prepare-light-confirmation.py tools/light-confirmation-node.txt tools/light-confirmation-python.txt tools/light-confirmation-notes.txt
          rm .github/workflows/light-confirmation-source.yml .github/workflows/apply-light-confirmation.yml
          git diff --check
      - name: Verify Node and Python regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures
          python -m venv /tmp/light-confirmation-tests
          source /tmp/light-confirmation-tests/bin/activate
          python -m pip install --disable-pip-version-check 'aiohttp>=3.10,<4' 'voluptuous>=0.15,<1'
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python custom_components/smartthings_web/tests/test_light_capabilities.py --isolated
      - name: Verify regression fails against old confirmation implementation
        shell: bash
        run: |
          set -euo pipefail
          cp bridge/src/command/command-service.ts /tmp/fixed-command-service.ts
          trap 'cp /tmp/fixed-command-service.ts bridge/src/command/command-service.ts' EXIT
          git show bbb252f97515a12d16fd8f5d7dedbc1ef193546f:bridge/src/command/command-service.ts > bridge/src/command/command-service.ts
          if npx vitest run bridge/tests/command/command-service.test.ts -t 'rechecks delayed level state' --testTimeout=500 > /tmp/baseline-light-regression.log 2>&1; then
            cat /tmp/baseline-light-regression.log
            echo 'Expected the old single-read implementation to fail the delayed-state regression.' >&2
            exit 1
          fi
          cat /tmp/baseline-light-regression.log
          grep -q 'Test timed out' /tmp/baseline-light-regression.log
      - name: Commit tested source only to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bounded light state confirmation and HA catch-up; release 1.8.19'
          git push origin HEAD:refs/heads/fix/light-confirmation-1.8.19
