name: Apply verified light controls
on:
  push:
    branches: [fix/light-capabilities-1.8.17]
    paths: [.github/workflows/apply-light-controls.yml]
permissions:
  contents: write
concurrency:
  group: apply-light-controls-1.8.17
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-SmartThings_Web' && github.ref == 'refs/heads/fix/light-capabilities-1.8.17'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-capabilities-1.8.17
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Verify and apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor beff11dcbc2d27038cf88df9a77bb41ad0d8741b HEAD
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          assert json.loads(Path('package.json').read_text())['version'] == '1.8.16'
          encoded = ''.join(Path(f'tools/light-release.part{i}').read_text().strip() for i in range(1, 6))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          print('Prepared patch SHA-256:', digest)
          assert digest == 'fb2cea47673078432ff37c0aede7fa3e73bc4dfabc16bfeeadc5cf4dafdc130a'
          Path('/tmp/light-controls.patch').write_bytes(patch)
          PY
          git apply --check /tmp/light-controls.patch
          git apply /tmp/light-controls.patch
          rm tools/light-release.part{1,2,3,4,5}
          git diff --check
      - name: Verify Python integration and light regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/light-tests
          source /tmp/light-tests/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.10,<4' 'yarl>=1.9,<2' 'voluptuous>=0.15,<1'
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python custom_components/smartthings_web/tests/test_light_capabilities.py --isolated
      - name: Verify locked Node tests, types and build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified source on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md addon bridge custom_components docs package.json package-lock.json protocol tests tools/light-release.part{1,2,3,4,5}
          git commit -m 'fix: restore dynamic light brightness, color and temperature controls for 1.8.17'
          git push origin HEAD:refs/heads/fix/light-capabilities-1.8.17
