name: Apply verified light dispatch candidate
on:
  push:
    branches: [perf/light-dispatch-1.8.28]
    paths: [.github/workflows/apply-light-dispatch.yml]
permissions:
  contents: write
concurrency:
  group: apply-light-dispatch-1.8.28
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/light-dispatch-1.8.28
          fetch-depth: 0
      - name: Verify exact reviewed patch and final source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('.')
          payload = '.github/light-dispatch-1.8.28.patch.xz.b64'
          workflow = '.github/workflows/apply-light-dispatch.yml'
          base = '99c41c454060712b74f1cc705afc875ae989e2c3'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          if git('rev-parse', 'origin/main') != base:
              raise SystemExit('Main advanced: review before applying')
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) != {payload, workflow}:
              raise SystemExit('Unexpected branch changes')
          patch = lzma.decompress(base64.b64decode((root / payload).read_text(), validate=True), memlimit=128*1024*1024)
          expected = '8ff3648fb6d1ecd0a070d0456e627a1be261b5cf163fea355495db1719b70902'
          if len(patch) != 44031 or hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed patch checksum mismatch')
          if json.loads((root / 'package.json').read_text())['version'] != '1.8.27':
              raise SystemExit('Unexpected base version')
          allowed = {
              'CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md',
              'addon/smartthings_web_bridge/config.yaml',
              'bridge/src/advanced/authenticated-session.ts', 'bridge/src/advanced/inventory-adapter.ts',
              'bridge/src/command/command-service.ts', 'bridge/src/command/light-dispatch-plan.ts',
              'bridge/src/runtime.ts', 'bridge/tests/advanced/authenticated-session.test.ts',
              'bridge/tests/advanced/inventory-adapter.test.ts',
              'bridge/tests/command/light-dispatch-plan.test.ts', 'bridge/tests/command/light-plan.test.ts',
              'bridge/tests/runtime.test.ts', 'custom_components/smartthings_web/manifest.json',
              'docs/LIGHT_DISPATCH_1.8.28.md', 'package-lock.json', 'package.json',
              'protocol/version.json', 'tests/addon-config.test.ts', 'tests/protocol-version-contract.test.ts'
          }
          if set(re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M)) != allowed:
              raise SystemExit('Unexpected patch scope')
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'rm', '--', payload], check=True)
          verify_index = (root / '.git/light-dispatch-verify-index').resolve()
          shutil.copyfile('.git/index', verify_index)
          env = {**os.environ, 'GIT_INDEX_FILE': str(verify_index)}
          try:
              git('update-index', '--force-remove', workflow, env=env)
              tree = git('write-tree', env=env)
              if tree != 'b473281de33a70fe3b401b5dd8af9a88a7b7c2b6':
                  raise SystemExit('Unexpected final source tree: ' + tree)
          finally:
              verify_index.unlink(missing_ok=True)
          print('Verified patch SHA256:', expected)
          print('Verified final source tree:', tree)
          print('Reviewed files:', len(allowed))
          PY
          git diff --cached --check
          git diff --cached --stat
      - name: Commit candidate only to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: prune freshly verified duplicate light POSTs (1.8.28)'
          git push origin HEAD:perf/light-dispatch-1.8.28
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
