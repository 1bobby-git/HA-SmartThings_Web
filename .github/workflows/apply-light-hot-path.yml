name: Apply verified light hot path
on:
  push:
    branches: [perf/light-hot-path-1.8.29]
    paths: [.github/workflows/apply-light-hot-path.yml]
permissions:
  contents: write
concurrency:
  group: apply-light-hot-path-1.8.29
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/light-hot-path-1.8.29
          fetch-depth: 0
      - name: Verify exact patch, allowed paths and final tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('.')
          payload = '.github/light-hot-path-1.8.29.patch.xz.b64'
          workflow = '.github/workflows/apply-light-hot-path.yml'
          validate = '.github/workflows/validate.yml'
          base = '277a19390ec4775609f57a23c55638608a3eee97'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          if git('rev-parse', 'origin/main') != base:
              raise SystemExit('Main advanced; review required')
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) != {payload, workflow, validate}:
              raise SystemExit('Unexpected branch changes')
          if git('hash-object', validate) != '0dd2d2a9311168af3f1e38382ccef1accacb35bc':
              raise SystemExit('Unexpected validation workflow')
          patch = lzma.decompress(base64.b64decode((root / payload).read_text(), validate=True), memlimit=128*1024*1024)
          expected = 'e355059ddc26d871a60c839957b8f2d9fb975dc96f1132a79e7f8d916e4c4b0b'
          if len(patch) != 46658 or hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch')
          allowed = {
              'CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md', 'addon/smartthings_web_bridge/config.yaml',
              'bridge/src/advanced/authenticated-session.ts', 'bridge/src/command/command-service.ts',
              'bridge/src/command/light-dispatch-cache.ts', 'bridge/src/command/light-dispatch-plan.ts',
              'bridge/src/runtime.ts', 'bridge/tests/advanced/authenticated-session.test.ts',
              'bridge/tests/command/light-dispatch-plan.test.ts', 'bridge/tests/command/light-plan.test.ts',
              'bridge/tests/runtime.test.ts', 'custom_components/smartthings_web/manifest.json',
              'docs/LIGHT_HOT_PATH_1.8.29.md', 'package-lock.json', 'package.json', 'protocol/version.json',
              'tests/addon-config.test.ts', 'tests/protocol-version-contract.test.ts', 'tools/ci-advanced-timing-smoke.mjs'
          }
          if set(re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M)) != allowed:
              raise SystemExit('Unexpected patch scope')
          if json.loads((root / 'package.json').read_text())['version'] != '1.8.28':
              raise SystemExit('Unexpected base version')
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'rm', '--', payload], check=True)
          index = (root / '.git/hot-path-index').resolve()
          shutil.copyfile('.git/index', index)
          env = {**os.environ, 'GIT_INDEX_FILE': str(index)}
          try:
              git('update-index', '--force-remove', workflow, env=env)
              tree = git('write-tree', env=env)
              if tree != 'bb3e113df23f9e57ebbfd65c9f0297c7563f868a':
                  raise SystemExit('Tree does not match tested source: ' + tree)
          finally:
              index.unlink(missing_ok=True)
          print('Verified patch:', expected)
          print('Verified source tree:', tree)
          PY
          git diff --cached --check
          git diff --cached --stat
      - name: Commit candidate without changing main or release gates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: reduce repeated light preflight waits and measure POST phases (1.8.29)'
          git push origin HEAD:perf/light-hot-path-1.8.29
