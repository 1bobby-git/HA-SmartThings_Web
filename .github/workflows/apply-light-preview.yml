name: Apply verified light preview candidate
on:
  push:
    branches: [fix/light-preview-evidence-1.8.31]
    paths: [.github/workflows/apply-light-preview.yml]
permissions:
  contents: write
concurrency:
  group: apply-light-preview-1.8.31
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-preview-evidence-1.8.31
          fetch-depth: 0
      - name: Verify exact patch checksum, scope, and final source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('.')
          payload = '.github/light-preview.patch.xz.b64'
          workflow = '.github/workflows/apply-light-preview.yml'
          base = '5e7577a35f35002e12eaa857f3b5c4f654b56cd7'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          if git('rev-parse', 'origin/main') != base:
              raise SystemExit('Main advanced; review required')
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) != {payload, workflow}:
              raise SystemExit('Unexpected branch changes')
          patch = lzma.decompress(base64.b64decode((root / payload).read_text().strip(), validate=True), memlimit=256*1024*1024)
          expected = 'fd471a455134b28870f651cc5d7977c6fc332db2ddc58a3dd44d9df841f80f1e'
          if len(patch) != 43176 or hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed patch checksum mismatch')
          if json.loads((root / 'package.json').read_text())['version'] != '1.8.30':
              raise SystemExit('Unexpected base version')
          allowed = {
              'CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md',
              'addon/smartthings_web_bridge/config.yaml', 'bridge/src/command/command-service.ts',
              'bridge/src/command/light-dispatch-plan.ts', 'bridge/src/runtime.ts',
              'bridge/tests/command/light-dispatch-plan.test.ts', 'bridge/tests/command/light-plan.test.ts',
              'bridge/tests/runtime.test.ts', 'custom_components/smartthings_web/manifest.json',
              'docs/LIGHT_PREVIEW_EVIDENCE_1.8.31.md', 'package-lock.json', 'package.json',
              'protocol/version.json', 'tests/addon-config.test.ts', 'tests/protocol-version-contract.test.ts'
          }
          if set(re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M)) != allowed:
              raise SystemExit('Unexpected patch scope')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'rm', '--', payload], check=True)
          verify_index = (root / '.git/preview-verify-index').resolve()
          shutil.copyfile('.git/index', verify_index)
          env = {**os.environ, 'GIT_INDEX_FILE': str(verify_index)}
          try:
              git('update-index', '--force-remove', workflow, env=env)
              tree = git('write-tree', env=env)
              if tree != 'e5f870d4d05b079a7cd372ded6b3be1c3406c504':
                  raise SystemExit('Unexpected final source tree: ' + tree)
          finally:
              verify_index.unlink(missing_ok=True)
          print('Verified patch SHA256:', expected)
          print('Verified source tree:', tree)
          PY
          git diff --cached --check
          git diff --cached --stat
      - name: Commit candidate on isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate mixed-source light previews without redundant power commands (1.8.31)'
          git push origin HEAD:fix/light-preview-evidence-1.8.31
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
