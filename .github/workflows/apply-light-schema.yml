name: Apply light schema repair
on:
  push:
    branches: [fix/light-schema-1.8.18]
    paths: [.github/workflows/apply-light-schema.yml]
permissions:
  contents: write
concurrency:
  group: apply-light-schema-1.8.18
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-SmartThings_Web' && github.ref == 'refs/heads/fix/light-schema-1.8.18'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-schema-1.8.18
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Apply exact source and regression changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 496da2ef3f8b3b135bda0eba53a9646622e67b0e HEAD
          git diff --quiet 6d5e6bd2e233d05580a42352528142f4bd9d08aa HEAD -- bridge/src custom_components package.json package-lock.json protocol/version.json addon README.md
          python tools/prepare-light-schema.py
          python tools/finish-light-schema.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'bridge/src/advanced/command-catalog.ts': 'b8622e76a49034b6ad3066c1a8a922e426f8138c9613073f0d6ca7b71b15a08a',
              'bridge/tests/advanced/light-schema-catalog.test.ts': '2bb8f98b523416c2e5b0d588cd451bcb30f892a290772fd4db84236b27ae399c',
              'custom_components/smartthings_web/tests/test_light_capabilities.py': '5ad88cca64eb818d1185273d5d4b424c112bb7b0c75df1e0b59dfd46cf11fddd',
              'custom_components/smartthings_web/tests/fixtures/light-schema-annotations.json': 'c87c2d5e7cf3fab16f3abcf52c9e2e64d17371de627146b151bdb49705c24b47',
              'README.md': '5c4dbcb76057baab92c92a0cf119d45a5124b67709300caab1b2664c5295038b',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
          rm tools/prepare-light-schema.py tools/finish-light-schema.py tools/light-schema-release.b64
          rm .github/workflows/light-schema-source.yml .github/workflows/apply-light-schema.yml
          git diff --check
      - name: Verify Node and Python regressions
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures
          python -m venv /tmp/light-schema-tests
          source /tmp/light-schema-tests/bin/activate
          python -m pip install --disable-pip-version-check 'aiohttp>=3.10,<4' 'voluptuous>=0.15,<1'
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python custom_components/smartthings_web/tests/test_light_capabilities.py --isolated
      - name: Commit tested source only to the fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: retain annotated numeric light commands; release 1.8.18'
          git push origin HEAD:refs/heads/fix/light-schema-1.8.18
