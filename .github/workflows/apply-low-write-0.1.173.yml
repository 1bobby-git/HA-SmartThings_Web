name: Apply low-write 0.1.173

on:
  push:
    branches:
      - fix/low-write-storage-guard-0.1.173
    paths:
      - tools/apply-low-write-0.1.173.py
      - .github/workflows/apply-low-write-0.1.173.yml

permissions:
  contents: write

concurrency:
  group: apply-low-write-0.1.173
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: python tools/apply-low-write-0.1.173.py

      - name: Validate shell syntax
        run: sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/prepare-data

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests and build
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Compile Python sources
        run: python -m compileall -q custom_components/smartthings_web

      - name: Remove one-time transformer
        run: |
          rm -f tools/apply-low-write-0.1.173.py
          rm -f .github/workflows/apply-low-write-0.1.173.yml

      - name: Commit verified product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: reduce SmartThings Web storage writes 0.1.173'
          git push origin HEAD:fix/low-write-storage-guard-0.1.173
