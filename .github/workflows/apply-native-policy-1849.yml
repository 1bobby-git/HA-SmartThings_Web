name: Verify native login policy candidate
on:
  push:
    branches: [fix/native-keep-signed-in-1.8.49]
    paths: [.github/workflows/apply-native-policy-1849.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/native-keep-signed-in-1.8.49
      - name: Verify and apply the locally reviewed patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib, subprocess
          p = Path('.maintenance')
          chunks = [(p / f'native-policy-1849.part{i}').read_text().strip() for i in range(1, 6)]
          chunks[0] = chunks[0].replace('GVpeX2zmil', 'GVpe2zmil')
          chunks[1] = chunks[1].replace('qXZS7P1', 'qXZS7+P1')
          boundary = 'NJcvAAZyTBDj5IW0f0'
          assert chunks[2].count(boundary) == 1
          chunks[2] = chunks[2].split(boundary)[0] + boundary
          patch = zlib.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fe0840db501545ae0847055809cecadbc84532a63dbce68fe834e4d0add4cc20'
          Path('/tmp/native-policy.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/native-policy.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/native-policy.patch'], check=True)
          p = Path('tools/ci-native-login-policy-smoke.mjs')
          s = p.read_text().replace('<head><title>Synthetic settings', '<head><meta charset="utf-8"><title>Synthetic settings')
          s = s.replace("contentType: 'text/html'", "contentType: 'text/html; charset=utf-8'")
          s = s.replace('  const result = await ensureNativeKeepSignedIn(page, target, { enabled: !opts.optOut, timeoutMs: 350 });', "  assert.equal(await page.locator('#open').getAttribute('aria-label'), opts.english ? 'Settings' : '설정', 'fixture labels must retain their UTF-8 encoding');\n  const result = await ensureNativeKeepSignedIn(page, target, { enabled: !opts.optOut, timeoutMs: 350 });")
          p.write_text(s)
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Unit and boundary tests
        run: |
          npm ci --silent
          npm test > /tmp/unit.log 2>&1 || { tail -80 /tmp/unit.log; exit 1; }
          tail -8 /tmp/unit.log
          npm run typecheck
          npm run build
          npm run audit:api-free
      - name: Real Chromium native settings and existing session regressions
        run: |
          npx playwright-core install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -40 /tmp/browser-install.log; exit 1; }
          xvfb-run -a env DEBUG=pw:api node tools/ci-native-login-policy-smoke.mjs > /tmp/native-smoke.log 2>&1 || { tail -100 /tmp/native-smoke.log; exit 1; }
          grep -E '^PASS|"suite"' /tmp/native-smoke.log
          xvfb-run -a node tools/ci-session-continuity-smoke.mjs
      - name: Remove temporary transport and commit tested changes
        run: |
          rm .maintenance/native-policy-1849.part{1,2,3,4,5}
          rm .github/workflows/inspect-keep-signed-in-1849.yml .github/workflows/apply-native-policy-1849.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: apply and verify native SmartThings keep-signed-in setting (1.8.49)'
          git push origin HEAD:fix/native-keep-signed-in-1.8.49
