name: Apply occupancy room-sync patch
on:
  push:
    branches: [fix/occupancy-room-sync-1.8.16]
    paths: [.github/workflows/apply-occupancy.yml]
permissions:
  contents: write
concurrency:
  group: apply-occupancy-1.8.16
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-SmartThings_Web' && github.ref == 'refs/heads/fix/occupancy-room-sync-1.8.16'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/occupancy-room-sync-1.8.16
          fetch-depth: 0
      - name: Verify and apply checksummed source patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d2a9c691076f9495a5326e0c5c5f303b76ae9b3a HEAD
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          assert json.loads(Path('package.json').read_text())['version'] == '1.8.15'
          encoded = ''.join(Path(f'tools/occupancy-release.part{i}').read_text().strip() for i in range(1, 5))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e31baec7dc4809cdde513f5673e71f4aa3da47512b40bebb51863415f1c16aa2'
          Path('/tmp/occupancy.patch').write_bytes(patch)
          PY
          git apply --check /tmp/occupancy.patch
          git apply /tmp/occupancy.patch
          rm tools/occupancy-release.part{1,2,3,4}
          git diff --check
      - name: Run integration and isolated entity tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/occupancy-tests
          source /tmp/occupancy-tests/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.10,<4' 'voluptuous>=0.15,<1'
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python custom_components/smartthings_web/tests/test_occupancy.py --isolated
      - name: Commit source changes to isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: real occupancy sensors and verified room synchronization; release 1.8.16'
          git push origin HEAD:refs/heads/fix/occupancy-room-sync-1.8.16
