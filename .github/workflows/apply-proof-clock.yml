name: Apply proof clock contract
on:
  push:
    branches: [fix/light-proof-clock-contract-1.8.33]
    paths: [.github/workflows/apply-proof-clock.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-proof-clock-contract-1.8.33
          fetch-depth: 0
      - name: Apply exact reviewed test-only changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, shutil, subprocess
          base = '0770cf44615f07a525593d9b3a6e52ec84f0fdbe'
          workflow = '.github/workflows/apply-proof-clock.yml'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          if git('rev-parse', 'origin/main') != base:
              raise SystemExit('Main advanced; review required')
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) != {workflow}:
              raise SystemExit('Unexpected branch changes')
          edits = {
            'bridge/tests/runtime.test.ts': (
              'fc9aa398a7f4e93213cb1bea441f25dba2cd106d',
              'fb750eb3750e1141e70d445ec58915e38df8d06c',
              [
                ('  if (!batch) expect(log.info.mock.calls.filter(([s]) => s.startsWith("command_device:")).map(([s]) => JSON.parse(s.slice("command_device:".length))))\n    .toContainEqual(expect.objectContaining({ stage: "dispatch", preflightSource: "recent_read", preflightMs: 0, commands: ["setColor"] }));',
                 '  // Real-clock cache verification may cross a millisecond tick without I/O.\n  // Assert the actual zero-read contract, not an exactly zero wall-clock time.\n  if (!batch) expect(log.info.mock.calls.filter(([s]) => s.startsWith("command_device:")).map(([s]) => JSON.parse(s.slice("command_device:".length))))\n    .toContainEqual(expect.objectContaining({ stage: "dispatch", preflightSource: "recent_read", preflightReads: 0, commands: ["setColor"] }));')
              ]),
            'bridge/tests/command/light-plan.test.ts': (
              'eac0d99ebb2217463bc07f4326c7ec2dd2d08ee2',
              '045a0692b751ad4aad640848931a256fca40eba8',
              [
                ('second color command uses a recent read with 0ms preflight, then still performs post-command verification',
                 'second color command reuses the recent read without another preflight GET and still verifies after dispatch'),
                ('    expect(f.diagnostics).toHaveBeenCalledWith(expect.objectContaining({ stage: "dispatch", preflightSource: "recent_read", preflightMs: 0 }));',
                 '    // Elapsed CPU time can cross a real clock tick even when no GET is made.\n    expect(f.diagnostics).toHaveBeenCalledWith(expect.objectContaining({ stage: "dispatch", preflightSource: "recent_read", preflightReads: 0 }));')
              ])
          }
          for name, (before, after, replacements) in edits.items():
              if git('hash-object', name) != before:
                  raise SystemExit('Unexpected baseline: ' + name)
              path = pathlib.Path(name)
              text = path.read_text()
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit('Expected one exact replacement in ' + name)
                  text = text.replace(old, new)
              path.write_text(text)
              if git('hash-object', name) != after:
                  raise SystemExit('Unexpected updated blob: ' + name)
          git('add', '--', *edits)
          verify_index = pathlib.Path('.git/clock-verify-index').resolve()
          shutil.copyfile('.git/index', verify_index)
          env = {**os.environ, 'GIT_INDEX_FILE': str(verify_index)}
          try:
              git('update-index', '--force-remove', workflow, env=env)
              tree = git('write-tree', env=env)
              if tree != '0873610275575194f6f2378a84f1270fb2b0f126':
                  raise SystemExit('Unexpected final tree: ' + tree)
          finally:
              verify_index.unlink(missing_ok=True)
          print('Verified final tree:', tree)
          PY
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: verify zero preflight reads instead of zero elapsed milliseconds'
          git push origin HEAD:fix/light-proof-clock-contract-1.8.33
