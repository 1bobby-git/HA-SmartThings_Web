name: Apply README actual component status

on:
  push:
    branches:
      - docs/current-status-actual-data
    paths:
      - .github/workflows/apply-readme-current-status.yml

permissions:
  contents: write

concurrency:
  group: apply-readme-current-status
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Rewrite README status from current evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          branding = "<!-- project-branding:start -->"
          if not text.startswith("> [!CAUTION]\n"):
              raise SystemExit("README CAUTION block was not found at the beginning")
          branding_index = text.find(branding)
          if branding_index < 0:
              raise SystemExit("README branding marker was not found")
          text = text[branding_index:]

          old_status = '''> **현재 상태: LIMITED ALPHA**  
          > 현재 게이트는 `DECISION: LIMITED`입니다. 실제 HAOS 환경에서 연결·재시작 복구·푸시 상태 반영이 검증되었지만, 장시간 유휴 상태·호스트 재부팅 복구·모든 기기 유형의 제어·완전한 API 독립성은 아직 검증 범위 밖입니다.'''
          old_status = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_status.splitlines()
          )
          new_status = '''> **현재 상태: `0.1.180` · 실환경 부분 검증**  
          > 실제 Home Assistant OS에서 앱 기동, Ingress/noVNC Samsung 로그인, Bridge 연결, 인벤토리 수신과 Home Assistant 엔티티 생성까지 확인했습니다. `0.1.180`의 Home Monitor·Scene·Web 표시명 수정과 Advanced command·Galaxy Home Mini TTS는 구현 및 자동 검증을 통과했지만, 모든 계정과 기기에서 실기기 재검증이 끝난 상태는 아닙니다.'''
          new_status = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_status.splitlines()
          )
          if text.count(old_status) != 1:
              raise SystemExit("README current-status block did not match exactly once")
          text = text.replace(old_status, new_status, 1)

          if text.count("버전 0.1.160은 로그인된 동일 Chromium context에서") != 1:
              raise SystemExit("README Advanced versioned introduction anchor mismatch")
          text = text.replace(
              "버전 0.1.160은 로그인된 동일 Chromium context에서",
              "현재 구현은 로그인된 동일 Chromium context에서",
              1,
          )

          verification_start = text.find("## 현재 검증 결과\n")
          limitations_start = text.find("\n## 제한 사항\n", verification_start)
          if verification_start < 0 or limitations_start < 0:
              raise SystemExit("README verification section boundaries were not found")

          verification = '''## 현재 검증 상태

          아래 표는 **기능 구현**, **자동 검증**, **실제 HAOS 확인**을 구분합니다. 테스트 통과만으로 실기기 동작까지 확인됐다고 표시하지 않습니다.

          | 영역 | 현재 확인 상태 | 검증 수준 |
          | --- | --- | --- |
          | 최신 배포 | `v0.1.180` Bridge 앱과 Home Assistant 통합 패키지가 GitHub Release에 게시됨 | 배포 확인 |
          | HAOS 앱·브라우저 | 실제 사용자 HAOS에서 `0.1.178` 이후 앱 기동, Ingress/noVNC 접속과 Samsung 계정 로그인 확인 | 실환경 확인 |
          | Bridge·통합 연결 | 페어링, 내부 Bridge 연결, 인벤토리 수신과 Home Assistant 기기·엔티티 생성 확인 | 실환경 확인 |
          | 상태 동기화·부하 억제 | push/SSE 상태 반영, 동일 인벤토리 억제, 유한 큐·백프레셔, 무변경 상태 및 registry 쓰기 억제 구현 | 자동 검증 통과, 장시간 실환경 soak 필요 |
          | Home Monitor | 실제 발생한 `command_location_picker_not_found` 경로를 `0.1.180`에서 위치 직접 라우팅 방식으로 수정 | 자동 검증 통과, 사용자 환경 재검증 필요 |
          | SmartThings Scene | 실제 발생한 `command_control_not_found` 경로를 정확한 Scene 카드 탐색 방식으로 수정 | 자동 검증 통과, 사용자 환경 재검증 필요 |
          | Web 표시명 | `On 1`, `On 2` 같은 근거 없는 숫자 이름 대신 관찰된 SmartThings Web 라벨을 우선하도록 수정 | 자동 검증 통과, 실제 인벤토리 재확인 필요 |
          | Advanced commands | `smartthings_web.list_commands`와 `smartthings_web.execute_command` 구현. 장치의 live safe command catalog에 실제로 존재하는 명령만 실행 | 구현·자동 검증 완료, 장치별 지원 범위는 실환경 의존 |
          | Galaxy Home Mini TTS | 안전한 `speechSynthesis.speak` descriptor가 정확히 하나일 때 사용하는 `smartthings_web.speak` 구현 | 구현·자동 검증 완료, Galaxy Home Mini 실기기 재검증 필요 |

          `0.1.180` 변경 검증에서는 Vitest 89개 파일·1,054개 Node 테스트, TypeScript typecheck/build, Python 통합 테스트, HACS, Hassfest, 보안 검사와 패키지형 HAOS 런타임 smoke가 통과했습니다. 실제 사용자 환경에서 아직 다시 확인하지 않은 Home Monitor, Scene, Web 표시명과 Galaxy Home Mini TTS는 완료로 과장하지 않고 재검증 필요 상태로 표시합니다.
'''
          verification = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in verification.splitlines()
          )
          text = text[:verification_start] + verification + text[limitations_start:]

          limitations_start = text.find("## 제한 사항\n")
          license_start = text.find("\n## 라이선스\n", limitations_start)
          if limitations_start < 0 or license_start < 0:
              raise SystemExit("README limitations section boundaries were not found")
          limitations = '''## 제한 사항

          - Samsung의 비공식 Web 화면과 내부 요청 구조를 기반으로 하므로 UI·프로토콜 변경 시 일부 기능이 중단될 수 있습니다.
          - 기기·Scene·Home Monitor·Advanced command·TTS 지원 범위는 로그인한 계정, 위치, 지역과 현재 Web catalog가 실제로 노출한 항목에 따라 달라집니다.
          - 제어 대상이 정확히 하나로 검증되지 않거나 안전한 command descriptor가 없으면 임의의 대체 제어를 실행하지 않고 실패합니다.
          - 잠금장치·차고문·밸브·보안·경보·사이렌 등 위험도가 높은 command와 민감 인자를 요구하는 command는 실행 대상에서 제외합니다.
          - 72시간 장기 soak, 장시간 유휴 뒤 세션 복구, 모든 호스트 재부팅 조합과 전체 기기 유형은 아직 완전 검증되지 않았습니다.
          - 여기서 API-free는 SmartThings 공개 API, PAT, OAuth, SmartApp 자격 증명을 사용하지 않는다는 뜻입니다. 로그인된 SmartThings Web이 사용하는 내부 Web 요청까지 없다는 의미는 아닙니다.
'''
          limitations = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in limitations.splitlines()
          )
          text = text[:limitations_start] + limitations + text[license_start:]

          hidden_old = "Current gate: `DECISION: LIMITED`"
          hidden_new = "Current status is documented as live HAOS partially verified"
          if text.count(hidden_old) != 1:
              raise SystemExit("README hidden status compatibility anchor mismatch")
          text = text.replace(hidden_old, hidden_new, 1)

          required = (
              "**현재 상태: `0.1.180` · 실환경 부분 검증**",
              "## 현재 검증 상태",
              "실제 HAOS 확인",
              "Galaxy Home Mini 실기기 재검증 필요",
              "API-free는 SmartThings 공개 API",
              "Current status is documented as live HAOS partially verified",
          )
          for value in required:
              if value not in text:
                  raise SystemExit(f"README required status text missing: {value}")
          if "> [!CAUTION]" in text:
              raise SystemExit("README CAUTION block remains")
          if "현재 상태: LIMITED ALPHA" in text:
              raise SystemExit("README stale visible status remains")
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/documentation-gate.test.ts")
          test_text = test_path.read_text(encoding="utf-8")
          old_assertion = '    expect(readme).toContain("Current gate: `DECISION: LIMITED`");'
          new_assertion = '    expect(readme).toContain("Current status is documented as live HAOS partially verified");'
          if test_text.count(old_assertion) != 1:
              raise SystemExit("documentation gate status assertion mismatch")
          test_path.write_text(test_text.replace(old_assertion, new_assertion, 1), encoding="utf-8")
          PY

      - name: Validate documentation and gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q '^> \[!CAUTION\]' README.md
          grep -q '^## 현재 검증 상태$' README.md
          grep -q 'Galaxy Home Mini 실기기 재검증 필요' README.md
          npm ci
          npx vitest run tests/documentation-gate.test.ts

      - name: Commit verified documentation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-readme-current-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: replace caution with evidence-based component status'
          git push origin HEAD:docs/current-status-actual-data
