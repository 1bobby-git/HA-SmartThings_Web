name: Apply README actual component status

on:
  push:
    branches:
      - docs/current-status-actual-data
    paths:
      - .github/workflows/apply-readme-current-status.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply README update
        run: python .github/scripts/update_readme_current_status.py

      - name: Validate changed documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^## 현재 검증 상태$' README.md
          grep -q 'Galaxy Home Mini 실기기 재검증 필요' README.md
          if grep -q '^> \[!CAUTION\]' README.md; then
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Validate documentation gate
        run: |
          npm ci
          npx vitest run tests/documentation-gate.test.ts

      - name: Commit verified documentation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/update_readme_current_status.py
          rm -f .github/workflows/apply-readme-current-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: replace caution with evidence-based component status'
          git push origin HEAD:docs/current-status-actual-data
