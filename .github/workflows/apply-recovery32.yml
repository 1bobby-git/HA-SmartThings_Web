name: Apply verified recovery32
on:
  push:
    branches: [fix/session-recovery-light-evidence-1.8.32]
    paths: [.github/workflows/apply-recovery32.yml]
permissions:
  contents: write
concurrency:
  group: apply-recovery32
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/session-recovery-light-evidence-1.8.32
          fetch-depth: 0
      - name: Verify patch checksum and exact reviewed final tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, shutil, subprocess
          root = pathlib.Path('.')
          base = 'c2793e35f9b2786c24500f0f6ec160a0e20b3115'
          payloads = [f'.github/recovery32.patch.b64.{n}' for n in (1, 2)]
          workflow = '.github/workflows/apply-recovery32.yml'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          if git('rev-parse', 'origin/main') != base:
              raise SystemExit('Main changed; reconcile required')
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) != {*payloads, workflow}:
              raise SystemExit('Unexpected branch changes')
          encoded = ''.join((root / p).read_text().strip() for p in payloads)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=128*1024*1024)
          expected = '067fe1dfcb1d4ffbc19f0024fe99121e6f447b30d6f478d219ce5aefb6da5387'
          if len(patch) != 68063 or hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch')
          if json.loads((root / 'package.json').read_text())['version'] != '1.8.31':
              raise SystemExit('Unexpected base version')
          allowed = {
              'CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md',
              'addon/smartthings_web_bridge/DOCS.md', 'addon/smartthings_web_bridge/config.yaml',
              'bridge/src/advanced/authenticated-session.ts', 'bridge/src/advanced/command-adapter.ts',
              'bridge/src/browser/keeper-page.ts', 'bridge/src/command/advanced-first-executor.ts',
              'bridge/src/command/command-router.ts', 'bridge/src/config.ts', 'bridge/src/runtime.ts',
              'bridge/tests/advanced/command-adapter.test.ts', 'bridge/tests/browser/session-recovery.test.ts',
              'bridge/tests/command/advanced-first-executor.test.ts', 'bridge/tests/command/light-plan.test.ts',
              'bridge/tests/config.test.ts', 'bridge/tests/runtime.test.ts',
              'custom_components/smartthings_web/manifest.json', 'docs/SESSION_RECOVERY_BATCH_1.8.32.md',
              'package-lock.json', 'package.json', 'protocol/version.json',
              'tests/addon-config.test.ts', 'tests/protocol-version-contract.test.ts',
              'tools/ci-session-continuity-smoke.mjs'
          }
          if set(re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M)) != allowed:
              raise SystemExit('Unexpected patch scope')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'rm', '--', *payloads], check=True)
          index = (root / '.git/verify-recovery32-index').resolve()
          shutil.copyfile('.git/index', index)
          env = {**os.environ, 'GIT_INDEX_FILE': str(index)}
          try:
              git('update-index', '--force-remove', workflow, env=env)
              tree = git('write-tree', env=env)
              if tree != 'fa1da85040df807f543f417992e0cc9656083850':
                  raise SystemExit('Unexpected final tree: ' + tree)
          finally:
              index.unlink(missing_ok=True)
          print('Verified patch SHA256:', expected)
          print('Verified final source tree:', tree)
          PY
          git diff --cached --check
          git diff --cached --stat
      - name: Commit isolated candidate without touching main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover rejected sessions and add opt-in single-POST light plans (1.8.32)'
          git push origin HEAD:fix/session-recovery-light-evidence-1.8.32
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
