name: Apply reviewed light 1.8.25
on:
  push:
    branches:
      - fix/light-advanced-latest-1.8.25
    paths:
      - .github/workflows/apply-reviewed-light25.yml
permissions:
  contents: write
concurrency:
  group: apply-reviewed-light25
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/light-advanced-latest-1.8.25
          fetch-depth: 0
      - name: Check base and exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = 'd729381be86c1e317d4a4ee3cee9c1ef9bee0066'
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re, subprocess
          root = pathlib.Path('.')
          expected = 'dc0aa99b4afc800bb6a5c0c99a1c5844236c602d37536f16fe2299e9916c4b55'
          hashes = [
              '9d1d12201092748ee40b37cd529481bace627fdc36a02a8dbff117df746cddab',
              '837160b9ad51d8a2d68c471ad39677cf3e37172a7e6fed5e2ccfdc2575d40916',
              '4f59f1756c3841bc42b992fe608ef6b742d240b916da25e8fbe5862b9b6c572c',
              '07046846a4b644908f3d4c185eeb06eea762ac96cfd47e9ca7b9850d95b7c0c1',
              '1dc81c0ade117040a95ff7d08776e801a793913d2018259497615112a85e1a00',
              'b52c239057ad6b01d783967c947e5f15f9b8ece2e6e137d871fb73674ca2a29e',
              '26c26da8f64fcaf50844aa80883af0462c48c7fd402be3475bc267b3cbeb0755',
              '0822fd80b0e1b6d8cb5180282440af03154ea2149e40abfdd8679ad16f338ba9',
          ]
          segments = []
          for i, digest in enumerate(hashes, 1):
              segment = (root / f'.github/repair25/{i:02}.xz.b64').read_bytes()
              if hashlib.sha256(segment).hexdigest() != digest:
                  raise SystemExit(f'Patch transport checksum mismatch in segment {i}')
              segments.append(segment)
          patch = lzma.decompress(base64.b64decode(b''.join(segments), validate=True))
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed patch SHA256 mismatch')
          if json.loads((root / 'package.json').read_text())['version'] != '1.8.24':
              raise SystemExit('Base version changed; review required')
          allowed = {
              'CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md',
              'addon/smartthings_web_bridge/config.yaml',
              'bridge/src/advanced/command-adapter.ts',
              'bridge/src/command/advanced-first-executor.ts',
              'bridge/src/command/command-router.ts',
              'bridge/src/command/command-service.ts',
              'bridge/src/command/latest-light-queue.ts',
              'bridge/src/command/light-plan.ts',
              'bridge/src/command/light-status-recheck.ts',
              'bridge/src/runtime.ts', 'bridge/src/server/http-server.ts',
              'bridge/src/state/device-store.ts',
              'bridge/tests/command/latest-light-queue.test.ts',
              'bridge/tests/command/light-plan.test.ts',
              'bridge/tests/command/light-status-recheck.test.ts',
              'bridge/tests/runtime.test.ts',
              'custom_components/smartthings_web/bridge_client.py',
              'custom_components/smartthings_web/light.py',
              'custom_components/smartthings_web/manifest.json',
              'custom_components/smartthings_web/models.py',
              'custom_components/smartthings_web/tests/test_bridge_client.py',
              'custom_components/smartthings_web/tests/test_light_capabilities.py',
              'docs/LIGHT_ADVANCED_LATEST_INTENT_1.8.25.md',
              'package-lock.json', 'package.json', 'protocol/version.json',
              'tests/addon-config.test.ts', 'tests/audit-tools.test.ts',
              'tests/protocol-version-contract.test.ts', 'tools/api-free-audit.ts',
          }
          paths = set(re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M))
          if paths != allowed:
              raise SystemExit('Unexpected reviewed patch scope')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          print('Verified reviewed SHA256:', expected)
          print('Applied source/test/documentation files:', len(allowed))
          PY
          git rm -- .github/repair25/*.xz.b64 .github/light-v25.patch.part1
          git diff --cached --check
          git diff --cached --stat
      - name: Commit only to repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: serialize Advanced light dispatch and supersede stale intents (1.8.25)'
          git push origin HEAD:fix/light-advanced-latest-1.8.25
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
