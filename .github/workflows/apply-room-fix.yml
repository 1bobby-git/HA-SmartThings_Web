name: Apply reviewed room fix
on:
  push:
    branches: [fix/room-mapping-device-class-1.8.15]
    paths: [.github/workflows/apply-room-fix.yml]
permissions:
  contents: write
concurrency:
  group: apply-room-fix-1.8.15
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == '1bobby-git/HA-SmartThings_Web' && github.ref == 'refs/heads/fix/room-mapping-device-class-1.8.15'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/room-mapping-device-class-1.8.15
          fetch-depth: 0
      - name: Verify exact patch and apply
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 99e9fa86dcf372bfcd498c8baccead1d47029593 HEAD
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          assert json.loads(Path('package.json').read_text())['version'] == '1.8.14'
          names = ['part1', 'part2', 'tail1', 'tail2', 'tail3', 'tail4']
          hashes = ['cda35f80e09c0fa952a16a0530e2272733ccae687e44ee68624d4db21a1ebb65', '19f432ec4f3cb44c5059083596ee0daf99e27dbdca49d0a91b930f6c85082cf9', '04e797472ffe015bc196dcd94b3fc73f2f060a79c6ec620318af4ba96a69a8bb', 'cdb8cabf90c88965dc4dbc8214429254331a1ce290399269d4c8a5540778f265', '481220890ef332cff06c8b3d16672a5dbbd562e7a640fad3f5341a88634700d0', 'd51769c316513679b550ac7573ea95f5c61b014630b3717bf77bb37798ef21c4']
          parts = []
          for name, expected in zip(names, hashes):
              text = Path('tools/room-fix.' + name).read_text().strip()
              # Correct two identified copy errors; exact hashes remain mandatory.
              if name == 'part1':
                  text = text.replace('DKN+TFj/12uAV+eCHK3daXz12', 'DKN+TFj/12uAV+CHK3daXz12')
              if name == 'part2':
                  text = text.replace('IogXt8Y8Z4QPT8c/MnHl3', 'IogXt8Y8Z4QPT8/MnHl3')
              digest = hashlib.sha256(text.encode()).hexdigest()
              print(name, len(text), digest)
              assert digest == expected, name
              parts.append(text)
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e53bfc6c9d5a9d4478e66d588c8a7e7ff02f0cccb4a391de3c6269f979fd10a5'
          Path('/tmp/room-fix.patch').write_bytes(patch)
          PY
          git apply --check /tmp/room-fix.patch
          git apply /tmp/room-fix.patch
          rm tools/room-fix.part{1,2,3} tools/room-fix.tail{1,2,3,4}
          python -m compileall -q custom_components/smartthings_web
          python custom_components/smartthings_web/tests/test_room_sync.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md addon bridge custom_components docs package.json package-lock.json protocol tests tools/room-fix.part{1,2,3} tools/room-fix.tail{1,2,3,4}
          git commit -m 'fix: verified Advanced room synchronization and counter model labels in 1.8.15'
          git push origin HEAD:refs/heads/fix/room-mapping-device-class-1.8.15
