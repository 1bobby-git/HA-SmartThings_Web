name: Apply session continuity 1.8.38

on:
  push:
    branches:
      - fix/session-continuity-1.8.38

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/session-continuity-1.8.38
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/session-continuity-1.8.38.py
          python .github/session-continuity-1.8.38-test-adjust.py

      - name: Validate focused session changes
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run bridge/tests/browser/session-proactive-refresh.test.ts bridge/tests/browser/keeper-page.test.ts bridge/tests/runtime.test.ts
          npm run typecheck
          npm run build
          npm run audit:api-free
          npm run audit:secrets

      - name: Commit patched branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-session-continuity-1.8.38.yml
          rm -f .github/session-continuity-1.8.38.py
          rm -f .github/session-continuity-1.8.38-test-adjust.py
          rm -f .session-patch-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: proactively renew SmartThings web sessions (1.8.38)"
          git push origin HEAD:fix/session-continuity-1.8.38
