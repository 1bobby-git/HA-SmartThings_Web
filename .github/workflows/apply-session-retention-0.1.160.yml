name: Apply SmartThings session retention 0.1.160

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-session-retention-0.1.160.yml

permissions:
  contents: write

concurrency:
  group: apply-session-retention-0.1.160
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Apply bounded session-retention patch
        run: python .github/session-retention/apply_patch.py

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused session and release tests
        run: >-
          npm test -- --run
          bridge/tests/browser/keeper-page.test.ts
          bridge/tests/browser/persistent-context.test.ts
          bridge/tests/runtime.test.ts
          bridge/tests/main.test.ts
          tests/addon-config.test.ts
          tests/protocol-version-contract.test.ts
          tests/audit-tools.test.ts

      - name: Run complete Node test suite
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify API boundary
        run: npm run audit:api-free

      - name: Scan secrets
        run: npm run audit:secrets

      - name: Verify sanitized fixtures
        run: npm run audit:fixtures

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package Home Assistant app
        run: npm run package:addon

      - name: Run Home Assistant integration tests
        run: |
          python -m pip install --disable-pip-version-check "aiohttp>=3.10,<4" "yarl>=1.9,<2" "voluptuous>=0.15,<1"
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p "test_*.py"

      - name: Verify release surfaces and patch cleanliness
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const YAML = require("yaml");
          const expected = "0.1.160";
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const protocol = JSON.parse(fs.readFileSync("protocol/version.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync("custom_components/smartthings_web/manifest.json", "utf8"));
          const addon = YAML.parse(fs.readFileSync("addon/smartthings_web_bridge/config.yaml", "utf8"));
          const runtime = fs.readFileSync("bridge/src/runtime.ts", "utf8");
          for (const [name, value] of Object.entries({
            package: packageJson.version,
            packageLock: packageLock.version,
            packageLockRoot: packageLock.packages?.[""]?.version,
            protocol: protocol.bridge_version,
            manifest: manifest.version,
            addon: addon.version,
          })) {
            if (value !== expected) throw new Error(`${name}=${value}, expected ${expected}`);
          }
          if (!runtime.includes(`const bridgeVersion = "${expected}";`)) {
            throw new Error("runtime bridge version is not synchronized");
          }
          NODE
          git diff --check

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          rm -rf .github/session-retention
          rm -f .github/workflows/apply-session-retention-0.1.160.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep SmartThings browser sessions persistent"
          git push origin HEAD:main
