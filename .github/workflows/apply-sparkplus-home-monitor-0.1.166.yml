name: Apply Sparkplus Home Monitor 0.1.166

on:
  push:
    branches:
      - fix/sparkplus-home-monitor-0.1.166
    paths:
      - .github/workflows/apply-sparkplus-home-monitor-0.1.166.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify patch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/sparkplus-home-monitor-0.1.166
          fetch-depth: 0

      - name: Apply source, tests, and version changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              lines = dedent(value).strip("\n").splitlines()
              if any(not line.startswith("|") for line in lines):
                  raise SystemExit("invalid block margin")
              return "\n".join(line[1:] for line in lines)

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          command_page = "bridge/src/browser/command-page.ts"

          replace_once(
              command_page,
              block("""
              |  resolveRawDeviceId?: (alias: string) => string | undefined;
              |  resolveRawIdentifier?: (alias: string) => string | undefined;
              """),
              block("""
              |  resolveRawDeviceId?: (alias: string) => string | undefined;
              |  resolveRawLocationId?: (alias: string) => string | undefined;
              |  resolveRawIdentifier?: (alias: string) => string | undefined;
              """),
          )

          replace_once(
              command_page,
              block("""
              |  readonly #resolveRawDeviceId: ((alias: string) => string | undefined) | undefined;
              |  readonly #resolveRawIdentifier: ((alias: string) => string | undefined) | undefined;
              """),
              block("""
              |  readonly #resolveRawDeviceId: ((alias: string) => string | undefined) | undefined;
              |  readonly #resolveRawLocationId: ((alias: string) => string | undefined) | undefined;
              |  readonly #resolveRawIdentifier: ((alias: string) => string | undefined) | undefined;
              """),
          )

          replace_once(
              command_page,
              block("""
              |    this.#resolveRawDeviceId = options?.resolveRawDeviceId;
              |    this.#resolveRawIdentifier = options?.resolveRawIdentifier;
              """),
              block("""
              |    this.#resolveRawDeviceId = options?.resolveRawDeviceId;
              |    this.#resolveRawLocationId = options?.resolveRawLocationId;
              |    this.#resolveRawIdentifier = options?.resolveRawIdentifier;
              """),
          )

          replace_once(
              command_page,
              block("""
              |    try {
              |      const actionName = locationActionName(input.action);
              |      let action = await findLocationActionControl(page, actionName, 250);
              |      if (!action) {
              |        const monitor = await findHomeMonitorControl(
              |          page,
              |          homeMonitorName(input.locationNames?.[input.locationId])
              |        );
              |        if (!monitor) throw new Error("command_control_not_found");
              |        await monitor.click({ timeout: 15_000 });
              |
              |        const dialog = page.getByRole("dialog");
              |        try {
              |          await dialog.first().waitFor({ state: "visible", timeout: 15_000 });
              |        } catch {
              |          throw new Error("command_control_not_found");
              |        }
              |        if ((await dialog.count()) !== 1) {
              |          throw new Error("command_control_ambiguous");
              |        }
              |        action = await findLocationActionControl(dialog, actionName, 15_000);
              |      }
              |      if (!action) throw new Error("command_control_not_found");
              |      await action.click({ timeout: 15_000 });
              |    } finally {
              """),
              block("""
              |    try {
              |      const actionName = locationActionName(input.action);
              |      const locationName = input.locationNames?.[input.locationId];
              |      const monitorName = homeMonitorName(locationName);
              |      let action = await findHomeMonitorCardAction(
              |        page,
              |        monitorName,
              |        homeMonitorLabels(locationName),
              |        actionName,
              |        15_000
              |      );
              |      if (!action) {
              |        action = await findLocationActionControl(page, actionName, 250);
              |      }
              |      if (!action) {
              |        const monitor = await findHomeMonitorControl(page, monitorName);
              |        if (!monitor) throw new Error("command_control_not_found");
              |        await monitor.click({ timeout: 15_000 });
              |
              |        const dialog = page.getByRole("dialog");
              |        try {
              |          await dialog.first().waitFor({ state: "visible", timeout: 15_000 });
              |        } catch {
              |          throw new Error("command_control_not_found");
              |        }
              |        if ((await dialog.count()) !== 1) {
              |          throw new Error("command_control_ambiguous");
              |        }
              |        action = await findLocationActionControl(dialog, actionName, 15_000);
              |      }
              |      if (!action) throw new Error("command_control_not_found");
              |      await action.click({ timeout: 15_000 });
              |    } finally {
              """),
          )

          replace_once(
              command_page,
              block("""
              |    const routeLocation = locationIdFromUrl(page.url());
              |    if (!this.normalizeLocationId) return;
              |    if (!routeLocation) throw new Error("command_location_unknown");
              |    const currentLocationId = this.normalizeLocationId(routeLocation);
              |    if (currentLocationId === targetLocationId) return;
              """),
              block("""
              |    const routeLocation = locationIdFromUrl(page.url());
              |    if (!this.normalizeLocationId && !this.#resolveRawLocationId) return;
              |    if (!routeLocation) throw new Error("command_location_unknown");
              |    if (routeLocation === targetLocationId) return;
              |    const rawTargetLocationId = this.#resolveRawLocationId?.(targetLocationId);
              |    if (rawTargetLocationId === routeLocation) return;
              |    if (!this.normalizeLocationId) return;
              |    const currentLocationId = this.normalizeLocationId(routeLocation);
              |    if (currentLocationId === targetLocationId) return;
              """),
          )

          helper_anchor = block("""
          |async function findHomeMonitorControl(
          |  scope: CommandControlSurface,
          |  monitorName: RegExp
          |): Promise<CommandLocatorLike | undefined> {
          """)
          helper = block("""
          |async function findHomeMonitorCardAction(
          |  scope: CommandControlSurface,
          |  monitorName: RegExp,
          |  monitorLabels: readonly string[],
          |  actionName: RegExp,
          |  timeoutMs: number
          |): Promise<CommandLocatorLike | undefined> {
          |  let title: CommandLocatorLike | undefined;
          |  const heading = scope.getByRole("heading", { name: monitorName });
          |  const headingCount = await heading.count();
          |  if (headingCount > 1) throw new Error("command_control_ambiguous");
          |  if (headingCount === 1) {
          |    try {
          |      await heading.first().waitFor({ state: "visible", timeout: timeoutMs });
          |      title = heading.first();
          |    } catch {
          |      // The exact visible text variants below cover non-heading card titles.
          |    }
          |  }
          |
          |  if (!title) {
          |    for (const label of monitorLabels) {
          |      const candidate = scope.getByText(label, { exact: true });
          |      const count = await candidate.count();
          |      if (count > 1) throw new Error("command_control_ambiguous");
          |      if (count !== 1) continue;
          |      try {
          |        await candidate.first().waitFor({ state: "visible", timeout: timeoutMs });
          |        title = candidate.first();
          |        break;
          |      } catch {
          |        continue;
          |      }
          |    }
          |  }
          |  if (!title) return undefined;
          |
          |  let cardScope = title;
          |  for (let depth = 0; depth < 8; depth += 1) {
          |    const action = await findLocationActionControl(
          |      cardScope,
          |      actionName,
          |      Math.min(timeoutMs, 250)
          |    );
          |    if (action) return action;
          |    cardScope = cardScope.locator("..");
          |  }
          |  return undefined;
          |}
          |
          """)
          replace_once(command_page, helper_anchor, helper + helper_anchor)

          replace_once(
              command_page,
              block("""
              |function locationActionName(action: "armAway" | "armStay" | "disarm"): RegExp {
              |  if (action === "armAway") {
              |    return /^(?:Arm away|Away|Away mode|외출|외출 모드|외출 중|외출중)$/iu;
              |  }
              |  if (action === "armStay") {
              |    return /^(?:Arm stay|Stay|Stay mode|재실|재실 모드|재실 중|재실중|집에 있음|귀가)$/iu;
              |  }
              |  return /^(?:Disarm|Disarmed|Off|해제|해제됨|보안 해제|사용 안 함)$/iu;
              |}
              """),
              block("""
              |function locationActionName(action: "armAway" | "armStay" | "disarm"): RegExp {
              |  if (action === "armAway") {
              |    return /^(?:Arm away|Away|Away mode|외출|외출 모드|외출 중|외출중|보안\s*\(\s*외출\s*\)|보안\s*외출)$/iu;
              |  }
              |  if (action === "armStay") {
              |    return /^(?:Arm stay|Stay|Stay mode|실내|실내 모드|재실|재실 모드|재실 중|재실중|집에 있음|귀가|보안\s*\(\s*(?:실내|재실)\s*\)|보안\s*(?:실내|재실))$/iu;
              |  }
              |  return /^(?:Disarm|Disarmed|Off|해제|해제됨|보안 해제|보안\s*\(\s*해제\s*\)|사용 안 함)$/iu;
              |}
              """),
          )

          replace_once(
              command_page,
              "function controlLabelFor(attribute: string): string | undefined {",
              block("""
              |function homeMonitorLabels(locationName?: string): string[] {
              |  const labels = ["SmartThings Home Monitor", "Home Monitor", "홈 모니터", "홈모니터"];
              |  const normalizedLocationName = locationName?.trim();
              |  if (!normalizedLocationName) return labels;
              |  return [
              |    ...labels,
              |    ...labels.map((label) => `${normalizedLocationName} ${label}`)
              |  ];
              |}
              |
              |function controlLabelFor(attribute: string): string | undefined {
              """),
          )

          replace_once(
              "bridge/src/runtime.ts",
              block("""
              |      resolveRawDeviceId: (alias) => volatileIdentifiers.rawDeviceId(alias),
              |      resolveRawIdentifier: (alias) => volatileIdentifiers.rawIdentifier(alias)
              """),
              block("""
              |      resolveRawDeviceId: (alias) => volatileIdentifiers.rawDeviceId(alias),
              |      resolveRawLocationId: (alias) => volatileIdentifiers.rawLocationId(alias),
              |      resolveRawIdentifier: (alias) => volatileIdentifiers.rawIdentifier(alias)
              """),
          )

          test_path = "bridge/tests/browser/command-page.test.ts"
          test_anchor = '  test("executes one exact scene card and one Home Monitor action", async () => {'
          regression = block("""
          |  test("skips the matching Sparkplus URL picker and clicks both dashboard Home Monitor controls", async () => {
          |    const rawLocationId = "11111111-2222-4333-8444-555555555555";
          |    for (const expected of [
          |      { action: "armAway", label: "보안(외출)" },
          |      { action: "armStay", label: "보안(실내)" }
          |    ] as const) {
          |      const page = new FakeCommandPage();
          |      page.currentUrl = `https://my.smartthings.com/location/${rawLocationId}`;
          |      const missing = new FakeLocator(0, true);
          |      const title = new FakeLocator(1);
          |      const monitorCard = new FakeLocator(1);
          |      const actionControl = new FakeLocator(1);
          |      title.getByRole = vi.fn(() => missing);
          |      title.locator = vi.fn((selector?: string) =>
          |        selector === ".." ? monitorCard : missing
          |      );
          |      monitorCard.getByRole = vi.fn(
          |        (role?: string, options?: { name?: string | RegExp }) =>
          |          role === "button" &&
          |          options?.name instanceof RegExp &&
          |          options.name.test(expected.label)
          |            ? actionControl
          |            : missing
          |      );
          |      page.getByText = vi.fn((text?: string) =>
          |        text === "SmartThings Home Monitor" ? title : missing
          |      );
          |      let pickerQueries = 0;
          |      page.getByRole = vi.fn(
          |        (role: string, options?: { name?: string | RegExp }) => {
          |          if (
          |            role === "button" &&
          |            options?.name instanceof RegExp &&
          |            options.name.test("Sparkplus")
          |          ) {
          |            pickerQueries += 1;
          |          }
          |          return missing;
          |        }
          |      );
          |      let normalizeCalls = 0;
          |      const manager = { openCommandPage: vi.fn(async () => page) };
          |      const executor = new SmartThingsWebUiCommandExecutor(
          |        () => manager,
          |        () => {
          |          normalizeCalls += 1;
          |          return "loc_other";
          |        },
          |        {
          |          resolveRawLocationId: (alias) =>
          |            alias === "loc_spark" ? rawLocationId : undefined
          |        }
          |      );
          |
          |      await executor.executeLocationAction({
          |        locationId: "loc_spark",
          |        locationNames: { loc_spark: "Sparkplus" },
          |        action: expected.action
          |      });
          |
          |      expect(normalizeCalls).toBe(0);
          |      expect(pickerQueries).toBe(0);
          |      expect(title.locator).toHaveBeenCalledWith("..");
          |      expect(actionControl.click).toHaveBeenCalledWith({ timeout: 15_000 });
          |      expect(page.close).toHaveBeenCalledTimes(1);
          |    }
          |  });
          |
          """)
          replace_once(test_path, test_anchor, regression + test_anchor)

          replace_once(
              "bridge/src/runtime.ts",
              'const bridgeVersion = "0.1.165";',
              'const bridgeVersion = "0.1.166";',
          )
          replace_once(
              "custom_components/smartthings_web/manifest.json",
              '"version": "0.1.165"',
              '"version": "0.1.166"',
          )
          replace_once(
              "addon/smartthings_web_bridge/config.yaml",
              "version: 0.1.165",
              "version: 0.1.166",
          )
          replace_once(
              "package.json",
              '"version": "0.1.165"',
              '"version": "0.1.166"',
          )

          lock_path = Path("package-lock.json")
          lock_text = lock_path.read_text(encoding="utf-8")
          if lock_text.count('"version": "0.1.165"') != 2:
              raise SystemExit("package-lock.json: unexpected current-version count")
          lock_path.write_text(
              lock_text.replace('"version": "0.1.165"', '"version": "0.1.166"'),
              encoding="utf-8",
          )

          changelog_path = Path("addon/smartthings_web_bridge/CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          if not changelog.startswith("## 0.1.165\n"):
              raise SystemExit("CHANGELOG.md: unexpected release head")
          notes = (
              "## 0.1.166\n\n"
              "- 현재 브라우저 URL의 raw Location ID가 명령 대상과 일치하면 별칭 정규화나 Location picker 탐색 전에 즉시 현재 위치로 확정합니다.\n"
              "- Sparkplus 실제 대시보드의 SmartThings Home Monitor 카드 안에 노출되는 `보안(외출)` 및 `보안(실내)` 버튼을 카드 범위에서 직접 찾아 제어합니다.\n"
              "- 기존 전역 버튼 및 Home Monitor 대화상자 경로는 하위 호환 fallback으로 유지합니다.\n\n"
          )
          changelog_path.write_text(notes + changelog, encoding="utf-8")
          PY

          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused regression tests
        run: npm test -- bridge/tests/browser/command-page.test.ts

      - name: Type-check
        run: npm run typecheck

      - name: Build bridge
        run: npm run build

      - name: Package Bridge add-on
        run: npm run package:addon

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bridge/src/browser/command-page.ts \
            bridge/src/runtime.ts \
            bridge/tests/browser/command-page.test.ts \
            custom_components/smartthings_web/manifest.json \
            addon/smartthings_web_bridge/config.yaml \
            addon/smartthings_web_bridge/CHANGELOG.md \
            package.json \
            package-lock.json
          git commit -m "fix: control Sparkplus Home Monitor from matching location"
          git push origin "HEAD:${GITHUB_REF_NAME}"
