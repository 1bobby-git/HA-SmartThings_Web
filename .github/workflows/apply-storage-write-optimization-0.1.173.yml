name: Apply storage write optimization 0.1.173

on:
  push:
    branches:
      - fix/storage-write-amplification-0.1.173
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/storage-write-amplification-0.1.173
          fetch-depth: 0

      - name: Apply storage and write-amplification fixes
        run: |
          python tools/apply-storage-write-optimization-0.1.173.py
          python tools/finalize-storage-write-optimization-0.1.173.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Validate modified source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run package:addon
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reduce HAOS storage write amplification 0.1.173"
          git push origin HEAD:fix/storage-write-amplification-0.1.173
