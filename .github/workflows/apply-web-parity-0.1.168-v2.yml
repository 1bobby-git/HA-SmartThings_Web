name: Apply SmartThings Web parity 0.1.168 v2

on:
  push:
    branches:
      - fix/web-parity-advanced-ui-0.1.168
    paths:
      - .github/workflows/apply-web-parity-0.1.168-v2.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: smartthings-web-parity-0.1.168
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      WORK_BRANCH: fix/web-parity-advanced-ui-0.1.168
      VERSION: 0.1.168
    steps:
      - name: Check out latest work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/web-parity-advanced-ui-0.1.168
          fetch-depth: 0

      - name: Stop when release is already complete
        id: released
        shell: bash
        run: |
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "done=true" >> "${GITHUB_OUTPUT}"
          else
            echo "done=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Reapply source patch when the first run did not commit
        if: steps.released.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tests/web-parity-0.1.168.test.ts ]]; then
            test -f .github/workflows/apply-web-parity-0.1.168.yml
            python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-web-parity-0.1.168.yml").read_text(encoding="utf-8").splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          lines = workflow[start:end]
          common = min(len(line) - len(line.lstrip(" ")) for line in lines if line.strip())
          script = "\n".join(line[common:] if line.strip() else "" for line in lines) + "\n"
          Path("/tmp/apply_0_1_168.py").write_text(script, encoding="utf-8")
          PY
            python /tmp/apply_0_1_168.py
          fi

      - name: Restrict Bridge fallback to known add-on hosts
        if: steps.released.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/smartthings_web/bridge_client.py")
          text = path.read_text(encoding="utf-8")
          old = '''        self._fallback_base_urls = tuple(
            candidate
            for candidate in (
                "http://d55cafb9-smartthings-web-bridge:8100",
                "http://local-smartthings-web-bridge:8100",
            )
            if candidate != self._base_url
        )
'''
          new = '''        known_addon_urls = (
            "http://d55cafb9-smartthings-web-bridge:8100",
            "http://local-smartthings-web-bridge:8100",
        )
        self._fallback_base_urls = (
            tuple(candidate for candidate in known_addon_urls if candidate != self._base_url)
            if self._base_url in known_addon_urls
            else ()
        )
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Bridge fallback block is missing")
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Set up Node.js
        if: steps.released.outputs.done != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Verify Node and Bridge package
        if: steps.released.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run package:addon

      - name: Set up Python
        if: steps.released.outputs.done != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Verify Home Assistant integration
        if: steps.released.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check aiohttp yarl
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'

      - name: Commit clean verified branch
        if: steps.released.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/apply-web-parity-0.1.168.yml \
            .github/workflows/apply-web-parity-0.1.168-v2.yml \
            .github/workflows/finalize-web-parity-0.1.168.yml \
            .github/workflows/export-source-0.1.168.yml \
            .github/workflows/export-regression-baselines-0.1.168.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore SmartThings Web parity and Bridge recovery 0.1.168"
            git push origin "HEAD:${WORK_BRANCH}"
          fi

      - name: Create pull request
        if: steps.released.outputs.done != 'true'
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${WORK_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${WORK_BRANCH}" \
              --title 'fix: SmartThings Web parity 및 Bridge 자동 복구 0.1.168' \
              --body $'## 핵심 수정\n\n- Bridge 저장소형/로컬형 호스트 자동 복구\n- Home Monitor raw Location 직접 이동 및 실제 picker fallback\n- Web 기기명·presentation·아이콘 정규화\n- Counter NUMBER/RANGE와 SmartTag RADIO/OPTIONS/ACTION 컨트롤 엔티티 복구\n- Web 엔티티를 기준으로 안전 Advanced 명령 우선 실행\n- 전체 Node/HA 테스트와 Bridge 패키징 검증')"
            pr_number="${pr_url##*/}"
          fi
          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Wait for pull-request checks
        if: steps.released.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ steps.pr.outputs.number }}"
          for attempt in $(seq 1 100); do
            checks="$(gh pr checks "${pr_number}" --repo "${GITHUB_REPOSITORY}" --json name,state,bucket 2>/dev/null || true)"
            if [[ -n "${checks}" ]]; then
              result="$(CHECKS="${checks}" python - <<'PY'
          import json, os
          data=json.loads(os.environ["CHECKS"])
          if any(item.get("bucket") in {"fail", "cancel"} for item in data):
              print("failed")
          elif data and not any(item.get("bucket") in {"pending", "skipping"} for item in data):
              print("ready")
          else:
              print("pending")
          PY
              )"
              [[ "${result}" != "failed" ]] || { gh pr checks "${pr_number}" --repo "${GITHUB_REPOSITORY}"; exit 1; }
              [[ "${result}" != "ready" ]] || exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Merge pull request
        if: steps.released.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --subject 'fix: SmartThings Web parity 및 Bridge 자동 복구 0.1.168' \
            --body '이전 정상 Web 엔티티 동작을 유지하면서 Bridge 연결, Home Monitor Location, 장치 메타데이터, Web 컨트롤 및 안전 Advanced 실행 회귀를 수정한다.'

      - name: Wait for v0.1.168 release assets
        if: steps.released.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if release="$(gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease,assets 2>/dev/null)"; then
              RELEASE="${release}" VERSION="${VERSION}" python - <<'PY'
          import json, os
          data=json.loads(os.environ["RELEASE"])
          version=os.environ["VERSION"]
          assert not data.get("isDraft") and not data.get("isPrerelease")
          names={asset.get("name") for asset in data.get("assets", [])}
          assert f"smartthings-web-bridge-{version}.tgz" in names
          assert f"smartthings-web-integration-{version}.tgz" in names
          PY
              exit 0
            fi
            sleep 10
          done
          exit 1
