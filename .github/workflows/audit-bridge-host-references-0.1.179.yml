name: Audit Bridge hostname references 0.1.179

on:
  push:
    branches:
      - fix/bridge-autodiscovery-0.1.179
    paths:
      - .github/workflows/audit-bridge-host-references-0.1.179.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: List legacy repository-host references
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn --exclude-dir=.git --exclude='*.png' --exclude='*.tgz' 'd55cafb9' . || true
