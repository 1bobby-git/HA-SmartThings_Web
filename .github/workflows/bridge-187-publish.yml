name: Publish verified Bridge 1.8.7
on:
  push:
    branches: [fix/bridge-1.8.7-20260906]
    paths:
      - .github/workflows/bridge-187-publish.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: bridge-187-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 18edcf694c92aadbdba1a51d7bd527c2f3381894
          persist-credentials: false
      - name: Preserve pinned guarded publisher
        run: cp .release-bridge187/publish.py "$RUNNER_TEMP/publish-bridge187.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aa7000eec7b0d095b6baf669c20784e045f2eba2
          fetch-depth: 0
      - name: Publish only previously validated source and publicly verify every new asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/publish-bridge187.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bridge187-publication-evidence
          path: |
            ${{ runner.temp }}/bridge187-publish/result.json
            ${{ runner.temp }}/bridge187-publish/evidence/bridge-1.8.7-provenance.json
            ${{ runner.temp }}/bridge187-publish/evidence/SHA256SUMS-bridge-1.8.7.txt
          retention-days: 14
          if-no-files-found: warn
