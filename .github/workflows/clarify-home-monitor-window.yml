name: Clarify Home Monitor confirmation window

on:
  push:
    branches:
      - docs/home-monitor-confirmation-window-1.8.9
    paths:
      - '.github/workflows/clarify-home-monitor-window.yml'

permissions:
  contents: write

jobs:
  clarify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Correct only the timeout example in documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          assert 'command_confirmation_timeout: 30' in Path('addon/smartthings_web_bridge/config.yaml').read_text(encoding='utf-8')
          old = '기본 15초 확인 창에서 조회 시작 목표는 1·2·4·7·10초이며 실제 처리시간에 따라 늦어질 수 있습니다.'
          new = '확인 제한을 15초로 설정한 예에서는 조회 시작 목표가 1·2·4·7·10초입니다. 변경하지 않은 기본 설정은 30초이며 이 경우 마지막 확인 목표는 25초입니다. 실제 조회시간에 따라 시작이 늦어질 수 있습니다.'
          paths = ['CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md', 'addon/smartthings_web_bridge/DOCS.md', 'addon/smartthings_web_bridge/README.md', 'docs/HOME_MONITOR_1.8.9.md']
          for name in paths:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              assert text.count(old) == 1, name
              p.write_text(text.replace(old, new), encoding='utf-8')
          changelog = Path('addon/smartthings_web_bridge/CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^## 1\.8\.9\s*$\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          assert match
          Path('/tmp/home-monitor-release-notes.md').write_text(match.group(1).strip() + '\n', encoding='utf-8')
          PY
          git diff --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Documentation regression check
        run: |
          npm ci
          npx vitest run tests/documentation-gate.test.ts

      - name: Commit the documentation-only correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/clarify-home-monitor-window.yml
          git add CHANGELOG.md addon/smartthings_web_bridge/CHANGELOG.md addon/smartthings_web_bridge/DOCS.md addon/smartthings_web_bridge/README.md docs/HOME_MONITOR_1.8.9.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: clarify configured Home Monitor verification deadlines'
          git push origin HEAD:docs/home-monitor-confirmation-window-1.8.9

      - name: Correct published release text without changing tags or packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/v1.8.9" --jq '.target_commitish')"
          test "$target" = d84871e10cd3253bac6a7fb3e71482bf91e976b9
          gh release edit v1.8.9 --notes-file /tmp/home-monitor-release-notes.md
