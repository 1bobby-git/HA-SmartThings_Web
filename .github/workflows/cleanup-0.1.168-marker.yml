name: Clean 0.1.168 verification marker

on:
  push:
    branches:
      - fix/web-parity-advanced-ui-0.1.168
    paths:
      - .github/workflows/cleanup-0.1.168-marker.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/web-parity-advanced-ui-0.1.168
          fetch-depth: 0
      - name: Require verified source and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/web-parity-0.1.168.test.ts
          test "$(python -c 'import json; print(json.load(open("custom_components/smartthings_web/manifest.json", encoding="utf-8"))["version"])')" = "0.1.168"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            docs/0.1.168-release-marker.md \
            .github/workflows/cleanup-0.1.168-marker.yml \
            .github/workflows/apply-web-parity-0.1.168.yml \
            .github/workflows/apply-web-parity-0.1.168-v2.yml \
            .github/workflows/finalize-web-parity-0.1.168.yml \
            .github/workflows/export-source-0.1.168.yml \
            .github/workflows/export-regression-baselines-0.1.168.yml
          git commit -m "chore: remove temporary 0.1.168 workflows"
          git push origin "HEAD:${GITHUB_REF_NAME}"
