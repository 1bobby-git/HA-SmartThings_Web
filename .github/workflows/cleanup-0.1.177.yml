name: Cleanup 0.1.177

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cleanup-0.1.177
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove obsolete branches and one-shot workflow
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the 0.1.177 release exists
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.177" --jq '.tag_name' | grep -qx 'v0.1.177'

      - name: Delete obsolete fix branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'fix/ha-capability-stability-0.1.174'
            'fix/haos-runtime-startup-0.1.177'
            'fix/inventory-backpressure-0.1.175'
            'fix/low-write-storage-guard-0.1.173'
            'fix/nonblocking-data-prep-0.1.176-final'
            'fix/nonblocking-data-prep-0.1.176'
            'fix/release-gate-0.1.177'
            'fix/storage-write-amplification-0.1.173'
            'fix/web-ui-startup-0.1.175'
          )
          for branch in "${branches[@]}"; do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-0.1.177.yml
          git commit -m 'chore: finish 0.1.177 repository cleanup'
          git push origin HEAD:main
