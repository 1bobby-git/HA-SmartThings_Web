name: Cleanup HAOS data-mode fix 0.1.178

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-haos-data-mode-0.1.178.yml

permissions:
  contents: write

concurrency:
  group: cleanup-haos-data-mode-0.1.178
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release and remove temporary branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.178" --jq '.tag_name' | grep -qx 'v0.1.178'
          git push origin --delete fix/haos-data-mode-0.1.178 || true

      - name: Remove one-shot cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-haos-data-mode-0.1.178.yml
          git commit -m 'chore: finish 0.1.178 repository cleanup'
          git push origin HEAD:main
