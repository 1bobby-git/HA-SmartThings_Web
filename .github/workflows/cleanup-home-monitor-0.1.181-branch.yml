name: Cleanup merged Home Monitor 0.1.181 branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-home-monitor-0.1.181-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Delete merged work branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete fix/home-monitor-live-dom-diagnostics-0.1.181

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-home-monitor-0.1.181-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: finish Home Monitor 0.1.181 branch cleanup'
          git push origin HEAD:main
