name: Command controls review snapshot

on:
  push:
    branches:
      - fix/advanced-command-controls-1.8.14
    paths:
      - .github/workflows/command-controls-review.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: command-controls-source
          path: source.tar.gz
          retention-days: 1
          if-no-files-found: error
