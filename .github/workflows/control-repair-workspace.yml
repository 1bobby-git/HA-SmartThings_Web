name: Control repair workspace
on:
  push:
    branches:
      - fix/light-monitor-confirmation-20260908
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD | gzip > control-repair-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-repair-source
          path: control-repair-source.tar.gz
          retention-days: 1
