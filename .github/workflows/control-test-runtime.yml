name: Control test runtime
on:
  push:
    branches: [fix/control-dispatch-1.8.20]
    paths: [.github/workflows/control-test-runtime.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - run: |
          npm ci
          mkdir -p test-runtime
          cp "$(command -v node)" test-runtime/node
          python -m pip download --dest test-runtime/wheels 'voluptuous>=0.15,<1'
          tar -czf test-runtime.tar.gz node_modules test-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: control-test-runtime
          path: test-runtime.tar.gz
          retention-days: 1
          if-no-files-found: error
