name: Export regression baselines 0.1.168

on:
  push:
    branches:
      - fix/web-parity-advanced-ui-0.1.168
    paths:
      - .github/workflows/export-regression-baselines-0.1.168.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Export relevant release trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baselines
          for ref in v0.1.154 v0.1.158 v0.1.162 v0.1.165 v0.1.166 v0.1.167; do
            git archive --format=tar.gz --output="baselines/${ref}.tar.gz" "${ref}"
          done
          sha256sum baselines/*.tar.gz > baselines/SHA256SUMS
      - name: Upload baseline sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smartthings-regression-baselines
          path: baselines
          retention-days: 1
          if-no-files-found: error
