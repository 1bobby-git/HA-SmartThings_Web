name: Export source workspace 0.1.168

on:
  push:
    branches:
      - fix/web-parity-advanced-ui-0.1.168
    paths:
      - .github/workflows/export-source-0.1.168.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/web-parity-advanced-ui-0.1.168
          fetch-depth: 0

      - name: Archive workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/ha-smartthings-web-source.tgz .

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: ha-smartthings-web-source
          path: /tmp/ha-smartthings-web-source.tgz
          if-no-files-found: error
          retention-days: 1
