name: Finalize SmartThings Web 0.1.182

on:
  push:
    branches:
      - fix/haos-live-control-discovery-naming-backpressure-0.1.182
    paths:
      - .github/workflows/finalize-0.1.182.yml
      - .github/scripts/finalize_0_1_182.py

permissions:
  contents: write

concurrency:
  group: finalize-smartthings-web-0.1.182
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply final reconciliation
        run: python .github/scripts/finalize_0_1_182.py

      - name: Validate Python integration
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Node, types, build and packaged runtime
        run: |
          npm test
          npm run typecheck
          npm run build
          tools/ci-haos-runtime-smoke.sh

      - name: Validate shell and repository audits
        run: |
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/publish-discovery
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/prepare-data
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/maintain-profile
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/profile-maintenance/run
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/openbox/run
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/bridge/run
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/bridge/finish
          bash -n tools/ci-haos-runtime-smoke.sh
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/finalize_0_1_182.py
          rm -f .github/workflows/finalize-0.1.182.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize SmartThings Web 0.1.182 regressions'
          git push origin HEAD:fix/haos-live-control-discovery-naming-backpressure-0.1.182
