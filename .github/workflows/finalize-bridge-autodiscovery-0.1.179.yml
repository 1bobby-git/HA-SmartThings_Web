name: Finalize Bridge URL autodiscovery 0.1.179

on:
  push:
    branches:
      - fix/bridge-autodiscovery-0.1.179
    paths:
      - .github/workflows/finalize-bridge-autodiscovery-0.1.179.yml

permissions:
  contents: write

concurrency:
  group: finalize-bridge-autodiscovery-0.1.179
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Align current installation references
        run: python .github/scripts/finalize_bridge_docs_0_1_179.py

      - name: Reject stale current-host documentation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '저장소 설치 앱 ID: `d55cafb9_smartthings_web_bridge`' README.md
          ! grep -Fq '앱 ID가 `d55cafb9_smartthings_web_bridge`이면 저장소 설치 앱입니다' docs/local-addon-update.md
          ! grep -Fq '저장소 앱 ID가 d55cafb9_smartthings_web_bridge라면' tools/update-local-addon.sh
          grep -Fq '현재 저장소 설치 앱 ID: `8a97f131_smartthings_web_bridge`' README.md
          grep -Fq '현재 저장소 설치 내부 DNS: `8a97f131-smartthings-web-bridge`' README.md

      - name: Validate shell syntax
        run: |
          bash -n tools/update-local-addon.sh
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/publish-discovery
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/prepare-data
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/maintain-profile
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/bridge/run
          bash -n tools/ci-haos-runtime-smoke.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete Node and packaged-runtime validation
        run: |
          npm test
          npm run typecheck
          npm run build
          tools/ci-haos-runtime-smoke.sh

      - name: Run Python integration validation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Run repository audits
        run: |
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures

      - name: Remove one-time files
        run: |
          rm -f .github/workflows/audit-bridge-host-references-0.1.179.yml
          rm -f .github/workflows/finalize-bridge-autodiscovery-0.1.179.yml
          rm -f .github/scripts/finalize_bridge_docs_0_1_179.py

      - name: Commit verified final changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: align current HAOS Bridge address 0.1.179'
          git push origin HEAD:fix/bridge-autodiscovery-0.1.179
