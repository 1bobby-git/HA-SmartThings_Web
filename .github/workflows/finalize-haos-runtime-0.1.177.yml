name: Finalize HAOS runtime recovery 0.1.177

on:
  push:
    branches:
      - fix/haos-runtime-startup-0.1.177
    paths:
      - .github/workflows/finalize-haos-runtime-0.1.177.yml

permissions:
  contents: write

concurrency:
  group: finalize-haos-runtime-0.1.177
  cancel-in-progress: false

jobs:
  finalize:
    name: Apply, validate, and commit release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Finalize source and version surfaces
        run: |
          set -euo pipefail
          python tools/finalize-haos-runtime-0.1.177.py
          chmod +x \
            tools/ci-haos-runtime-smoke.sh \
            addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/prepare-data \
            addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/openbox/run
          git diff --check

      - name: Validate shell entrypoints
        run: |
          set -euo pipefail
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/prepare-data
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/scripts/maintain-profile
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/profile-maintenance/run
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/openbox/run
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/bridge/run
          sh -n addon/smartthings_web_bridge/rootfs/etc/s6-overlay/s6-rc.d/bridge/finish
          bash -n tools/ci-haos-runtime-smoke.sh

      - name: Install locked dependencies
        run: npm ci

      - name: Run Node tests, typecheck, and build
        run: |
          set -euo pipefail
          npm test
          npm run typecheck
          npm run build

      - name: Run Home Assistant integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Run packaged HAOS runtime smoke
        run: tools/ci-haos-runtime-smoke.sh

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: recover HAOS Bridge startup and noVNC 0.1.177'
          git push origin HEAD:fix/haos-runtime-startup-0.1.177
