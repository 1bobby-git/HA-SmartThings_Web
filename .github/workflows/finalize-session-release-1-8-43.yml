name: Finalize session release 1.8.43
on:
  push:
    branches: [fix/session-sso-continuity-20260913]
    paths: [.github/workflows/finalize-session-release-1-8-43.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == '1bobby-git/HA-SmartThings_Web'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Synchronize exact version assertion and publish to fix branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5b9e451f37089222275836868e752340bab02bb2'
          python - <<'PY'
          from pathlib import Path
          p = Path('bridge/tests/runtime.test.ts')
          s = p.read_text()
          old = '["bridge_init:version:1.8.41:home_monitor_direct"]'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '["bridge_init:version:1.8.43:home_monitor_direct"]'))
          PY
          git diff --check
          git diff -- bridge/tests/runtime.test.ts
          git add bridge/tests/runtime.test.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: align startup version assertion with release 1.8.43'
          git push origin HEAD:refs/heads/fix/session-sso-continuity-20260913
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Validate complete release candidate
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run package:addon
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures
