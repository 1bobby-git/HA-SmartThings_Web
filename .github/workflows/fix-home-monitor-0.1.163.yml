name: Fix Home Monitor 0.1.163

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply patch
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/fix_home_monitor.py
          python /tmp/fix_home_monitor.py
      - name: Test
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'aiohttp>=3.10,<4' 'yarl>=1.9,<2' 'voluptuous>=0.15,<1'
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          npm ci
          npm run typecheck
          npm test
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-home-monitor-0.1.163.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Home Monitor dashboard control and state sync'
          git push origin HEAD:main
