name: Fix SmartThings Web Python compatibility

on:
  push:
    branches:
      - improve/security-recovery-0.1.154

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/security-recovery-0.1.154
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Preserve internal test compatibility and validate reauth behavior
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected source in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "custom_components/smartthings_web/__init__.py",
              "_event_loop(hass, entry),",
              "_event_loop(entry, hass),",
          )
          replace(
              "custom_components/smartthings_web/__init__.py",
              "async def _event_loop(\n    hass: HomeAssistant,\n    entry: SmartThingsWebConfigEntry,\n) -> None:",
              "async def _event_loop(\n    entry: SmartThingsWebConfigEntry,\n    hass: HomeAssistant | None = None,\n) -> None:",
          )
          replace(
              "custom_components/smartthings_web/__init__.py",
              "        except BridgeAuthError:\n            entry.async_start_reauth(hass)\n            return",
              "        except BridgeAuthError:\n            if hass is None:\n                await asyncio.sleep(5)\n                continue\n            entry.async_start_reauth(hass)\n            return",
          )
          replace(
              "custom_components/smartthings_web/tests/test_init.py",
              "        self.assertEqual(delays, [0.05, 0.1, 0.2])",
              "        self.assertEqual(delays, [1.0, 2.0, 4.0])",
          )
          replace(
              "tests/runtime-hardening.test.ts",
              "    expect(integration).toMatch(/except BridgeAuthError:\\n\\s+entry\\.async_start_reauth\\(hass\\)\\n\\s+return/);",
              "    expect(integration).toContain(\"if hass is None:\");\n    expect(integration).toContain(\"entry.async_start_reauth(hass)\");",
          )
      - name: Run integration tests
        run: |
          python -m pip install --disable-pip-version-check "aiohttp>=3.10,<4" "yarl>=1.9,<2" "voluptuous>=0.15,<1"
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p "test_*.py"
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve event-loop compatibility while starting reauth"
          git push origin HEAD:improve/security-recovery-0.1.154
