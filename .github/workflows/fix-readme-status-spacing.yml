name: Normalize README status section spacing

on:
  push:
    branches:
      - docs/current-status-actual-data
    paths:
      - .github/workflows/fix-readme-status-spacing.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Normalize section spacing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = (
              ("재검증 필요 상태로 표시합니다.\n## 제한 사항", "재검증 필요 상태로 표시합니다.\n\n## 제한 사항"),
              ("내부 Web 요청까지 없다는 의미는 아닙니다.\n## 라이선스", "내부 Web 요청까지 없다는 의미는 아닙니다.\n\n## 라이선스"),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"README spacing anchor mismatch: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit spacing cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-readme-status-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: normalize current status section spacing'
          git push origin HEAD:docs/current-status-actual-data
