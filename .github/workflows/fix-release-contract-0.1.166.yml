name: Fix release contract 0.1.166

on:
  push:
    branches:
      - fix/sparkplus-home-monitor-0.1.166
    paths:
      - .github/workflows/fix-release-contract-0.1.166.yml

permissions:
  contents: write

jobs:
  fix:
    name: Update and verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/sparkplus-home-monitor-0.1.166
          fetch-depth: 0

      - name: Update release contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expected = {
              "tests/addon-config.test.ts": 6,
              "tests/protocol-version-contract.test.ts": 2,
              "protocol/version.json": 1,
          }
          for name, count in expected.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              actual = text.count("0.1.165")
              if actual != count:
                  raise SystemExit(f"{name}: expected {count} old-version matches, found {actual}")
              path.write_text(text.replace("0.1.165", "0.1.166"), encoding="utf-8")
          PY
          git diff --check
          git diff -- \
            tests/addon-config.test.ts \
            tests/protocol-version-contract.test.ts \
            protocol/version.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build bridge
        run: npm run build

      - name: Package Bridge add-on
        run: npm run package:addon

      - name: Commit verified release contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/addon-config.test.ts \
            tests/protocol-version-contract.test.ts \
            protocol/version.json
          git commit -m "test: update release contract for 0.1.166"
          git push origin "HEAD:${GITHUB_REF_NAME}"
