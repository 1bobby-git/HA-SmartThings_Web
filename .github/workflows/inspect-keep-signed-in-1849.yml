name: Inspect keep-signed-in baseline
on:
  push:
    branches: [fix/native-keep-signed-in-1.8.49]
    paths: [.github/workflows/inspect-keep-signed-in-1849.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - run: |
          npm ci
          git archive --format=tar -o source.tar HEAD
          tar -czf dependencies.tar.gz node_modules
          gzip -c "$(which node)" > node-runtime.gz
      - uses: actions/upload-artifact@v4
        with:
          name: keep-signed-in-baseline
          path: |
            source.tar
            dependencies.tar.gz
            node-runtime.gz
          retention-days: 1
