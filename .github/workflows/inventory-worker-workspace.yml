name: Inventory worker workspace
on:
  push:
    branches: [fix/inventory-worker-1.8.35]
    paths: [.github/workflows/inventory-worker-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0110aefdafd452bfc69b99bcc276633f04dcfe24
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD | gzip > inventory-worker-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inventory-worker-source
          path: inventory-worker-source.tar.gz
          retention-days: 1
