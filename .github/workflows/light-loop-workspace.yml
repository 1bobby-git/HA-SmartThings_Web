name: Light loop workspace
on:
  push:
    branches: [fix/light-event-loop-latency-1.8.33]
    paths: [.github/workflows/light-loop-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 008736d241387d1d3d46ca83a744d773cfaaed9c
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > light-loop-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: light-loop-source
          path: light-loop-source.tar.gz
          retention-days: 1
