name: Light preview workspace
on:
  push:
    branches: [fix/light-preview-evidence-1.8.31]
    paths: [.github/workflows/light-preview-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e7577a35f35002e12eaa857f3b5c4f654b56cd7
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > light-preview-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: light-preview-source
          path: light-preview-source.tar.gz
          retention-days: 1
