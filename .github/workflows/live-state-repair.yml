name: Prepare live state recovery
on:
  push:
    branches: [fix/live-state-recovery-1.8.57]
permissions:
  contents: write
concurrency:
  group: prepare-live-state-recovery
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply reviewed patch to the exact analyzed runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object bridge/src/runtime.ts)" = 249ebe8742aaf82892901a0abd36aac828303881
          git apply --check tools/live-state-repair.patch
          git apply tools/live-state-repair.patch
          python3 - <<'PY'
          from pathlib import Path
          for name in ('package.json', 'package-lock.json', 'custom_components/smartthings_web/manifest.json', 'addon/smartthings_web_bridge/config.yaml'):
              path = Path(name)
              text = path.read_text()
              assert '1.8.56' in text, name
              path.write_text(text.replace('1.8.56', '1.8.57'))
          notes = Path('release-notes/1.8.57.md').read_text()
          for name in ('CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md'):
              path = Path(name)
              text = path.read_text()
              assert '## 1.8.57' not in text, name
              path.write_text(notes.rstrip() + '\n\n' + text)
          PY
          git diff --check
      - name: Verify recovery regressions, typecheck and build
        run: |
          npm ci
          npx vitest run bridge/tests/state/state-sync-watchdog.test.ts bridge/tests/realtime bridge/tests/inspector/browser-page-websocket.test.ts bridge/tests/runtime-recovery-policy.test.ts
          npm run typecheck
          npm run build
      - name: Commit verified implementation and remove one-time preparation files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge/src/runtime.ts package.json package-lock.json custom_components/smartthings_web/manifest.json addon/smartthings_web_bridge/config.yaml CHANGELOG.md addon/smartthings_web_bridge/CHANGELOG.md
          git rm .github/workflows/live-state-repair.yml tools/live-state-repair.patch
          git commit -m 'fix: restore passive state synchronization with active sessions (1.8.57)'
          git push origin HEAD:refs/heads/fix/live-state-recovery-1.8.57
