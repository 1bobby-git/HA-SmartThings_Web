name: Verify release validation repair
on:
  push:
    branches: [fix/release-1.8.57-validation]
    paths: [.github/workflows/offline-validation-kit.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply exact locally tested changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object bridge/tests/runtime.test.ts)" = ab4540df208fa79564b052ac68840b0987e1fb13
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('.')
          for name in ['protocol/version.json','tests/addon-config.test.ts','tests/protocol-version-contract.test.ts','bridge/tests/runtime.test.ts']:
              p=root/name
              p.write_text(p.read_text().replace('1.8.56','1.8.57'))
          p=root/'bridge/tests/runtime.test.ts'
          s=p.read_text()
          s=s.replace('await context.emit("websocket", socket);','await context.pages()[0]!.emit("websocket", socket);')
          start=s.index('  test("ignores unscoped temporary socket closes')
          end=s.index('\n  test(',start+8)
          block=s[start:end].replace('await context.pages()[0]!.emit("websocket", socket);','await context.emit("websocket", socket);')
          block=block.replace('    await socket.emit("framereceived", { payload: "2" });',
          '''    const recoveredSocket = await attachRuntimeSocket(context);
              await recoveredSocket.emit("framereceived", { payload: "2" });''')
          s=s[:start]+block+s[end:]
          s=s.replace('const tempRoots: string[] = [];','''const tempRoots: string[] = [];
          const fixtureTimers: ReturnType<typeof setInterval>[] = [];

          async function keepFixtureTransportAlive(page: FakePage): Promise<void> {
            const socket = new FakeEmitter() as FakeEmitter & { url: () => string };
            socket.url = () => "wss://my.smartthings.com/socket.io/";
            await page.emit("websocket", socket);
            await socket.emit("framereceived", { payload: "2" });
            fixtureTimers.push(setInterval(() => {
              void socket.emit("framereceived", { payload: "2" });
            }, 25_000));
          }''')
          s=s.replace('afterEach(async () => {','afterEach(async () => {\n  for (const timer of fixtureTimers.splice(0)) clearInterval(timer);',1)
          titles=[
          'verified native sessions preserve the original tab beyond the old 15-minute replacement interval',
          'maintains a quiet session over a synthetic day without accumulating open pages or keeper navigation',
          'session maintenance retries transient failures at 30/60 seconds then resumes normal cadence',
          'reauth recovery verifies the protected endpoint again before permitting authentication',
          'keeps an authenticated session warm while realtime health is degraded',
          'Advanced success cannot hide the native application\'s authentication rejection'
          ]
          for title in titles:
              start=s.index('  test("'+title+'"')
              end=s.index('\n  test(',start+8)
              block=s[start:end]
              needle='await runtime.browserStartup;'
              assert block.count(needle)==1, title
              block=block.replace(needle,needle+'\n    await keepFixtureTransportAlive(keeper);')
              s=s[:start]+block+s[end:]
          p.write_text(s)
          p=root/'bridge/tests/browser/home-monitor-stability.test.ts'
          s=p.read_text().replace('keeps context-level frame freshness but scopes close recovery to CDP keeper pages','scopes Playwright and CDP liveness and close recovery to keeper pages')
          s=s.replace('expect(runtime).toContain("onSmartThingsWebSocketFrame: observeSmartThingsWebSocketFrame");','''expect(runtime).toContain("if (page && page === keeperManager.currentKeeper()) observeSmartThingsWebSocketFrame(direction);");
              expect(runtime).toContain("if (page && page === keeperManager.currentKeeper()) recoverSmartThingsWebSocket();");
              expect(runtime).toContain("if (isRealtimeKeeper()) onSmartThingsWebSocketFrame(direction);");''')
          p.write_text(s)
          p=root/'bridge/tests/runtime.test.ts'
          p.write_text(p.read_text()+'''
          test.each(["CONNECTED", "STALE"] as const)(
            "quiet %s runtime refreshes actual device state despite ongoing session/transport heartbeats",
            async (state) => {
              vi.useFakeTimers(); vi.setSystemTime(new Date("2026-09-16T00:00:00Z"));
              const keeper = new FakePage("https://my.smartthings.com/location/raw-location-001");
              const initial = advancedSwitchInventory("raw-passive-device-001", "raw-location-001");
              keeper.advancedSnapshots = [initial];
              const context = new FakeContext([keeper]);
              const newPage = vi.spyOn(context, "newPage");
              const log = { info: vi.fn(), warn: vi.fn(), error: vi.fn() };
              const runtime = await createBridgeRuntime(createDeps(createTempRoot(), { log,
                chromium: { launchPersistentContext: vi.fn(async () => context) } }));
              runtimes.push(runtime); await runtime.browserStartup;
              await keepFixtureTransportAlive(keeper);
              keeper.goto.mockClear();
              runtime.status.update({ state });
              const baseUrl = `http://127.0.0.1:${runtime.port}`;
              const headers = { authorization: `Bearer ${await exchangeBridgeToken(baseUrl)}` };
              type Inventory = { devices: { states: { attribute: string; value: unknown }[] }[] };
              const readSwitch = async () => {
                const data = await fetch(`${baseUrl}/api/v1/inventory`, { headers }).then((r) => r.json()) as Inventory;
                return data.devices[0]?.states.find((s) => s.attribute === "switch")?.value;
              };
              expect(await readSwitch()).toBe("off");
              keeper.advancedSnapshots = [JSON.parse(JSON.stringify(initial)
                .replace('"off"', '"on"').replace("2026-09-01", "2026-09-16"))];
              // Neither a DEVICE_EVENT nor a control request is emitted by this test.
              await vi.advanceTimersByTimeAsync(131_000);
              expect(await readSwitch()).toBe("on");
              expect(runtime.status.getSnapshot()).toMatchObject({ authenticated: true, decodedDeviceEventCount: 0 });
              expect(log.info.mock.calls.some(([line]) => line.startsWith('state_sync_watchdog:{"outcome":"ok"'))).toBe(true);
              expect(keeper.advancedRequestCalls.some((r) => (r as { method: string }).method === "POST")).toBe(false);
              expect(keeper.goto).not.toHaveBeenCalled();
              expect(newPage).not.toHaveBeenCalled();
            }
          );

          test("runtime passive synchronization defers while a device command is pending", async () => {
            vi.useFakeTimers(); vi.setSystemTime(10_000);
            const keeper = new FakePage("https://my.smartthings.com/location/loc-synthetic-001");
            const context = new FakeContext([keeper]);
            const log = { info: vi.fn(), warn: vi.fn(), error: vi.fn() };
            const runtime = await createBridgeRuntime(createDeps(createTempRoot(), { log,
              chromium: { launchPersistentContext: vi.fn(async () => context) } }));
            runtimes.push(runtime); await runtime.browserStartup;
            await keepFixtureTransportAlive(keeper);
            const requestCount = keeper.advancedRequestCalls.length;
            runtime.status.update({ pendingCommandCount: 1 });
            await vi.advanceTimersByTimeAsync(131_000);
            expect(keeper.advancedRequestCalls).toHaveLength(requestCount);
            expect(log.info.mock.calls.some(([line]) => line.startsWith("state_sync_watchdog:"))).toBe(false);
            runtime.status.update({ pendingCommandCount: 0 });
            await vi.advanceTimersByTimeAsync(10_000);
            expect(keeper.advancedRequestCalls.length).toBeGreaterThan(requestCount);
            expect(log.info.mock.calls.some(([line]) => line.startsWith('state_sync_watchdog:{"outcome":"ok"'))).toBe(true);
          });

          test("temporary and unscoped socket heartbeats cannot hide a stalled keeper", async () => {
            vi.useFakeTimers(); vi.setSystemTime(10_000);
            const { context, runtime, socket } = await startReadyRuntime();
            const keeper = context.pages()[0]!;
            keeper.goto.mockClear();
            const temporaryPage = await context.newPage();
            temporaryPage.currentUrl = "https://my.smartthings.com/advanced";
            const temporarySocket = new FakeEmitter() as FakeEmitter & { url: () => string };
            temporarySocket.url = () => "wss://my.smartthings.com/socket.io/";
            await temporaryPage.emit("websocket", temporarySocket);
            const unscopedSocket = new FakeEmitter() as FakeEmitter & { url: () => string };
            unscopedSocket.url = temporarySocket.url;
            await context.emit("websocket", unscopedSocket);
            vi.setSystemTime(20_000);
            await temporarySocket.emit("framereceived", { payload: "2" });
            await unscopedSocket.emit("framereceived", { payload: "2" });
            expect(runtime.status.getSnapshot().lastPushAtMs).toBe(10_000);
            await temporarySocket.emit("close");
            await unscopedSocket.emit("close");
            await vi.advanceTimersByTimeAsync(0);
            expect(keeper.goto).not.toHaveBeenCalled();
            await socket.emit("framereceived", { payload: "2" });
            expect(runtime.status.getSnapshot().lastPushAtMs).toBe(20_000);
          });
          ''')
          expected={
          'protocol/version.json':'9741bbdc5e16ccd834ed1c01df3256d5edfafd5e',
          'tests/addon-config.test.ts':'34f7a11e845a72740fee5e175bfd065b2bfa20ce',
          'tests/protocol-version-contract.test.ts':'0e4ce337056595424be36ca1c9974792fe063a30',
          'bridge/tests/runtime.test.ts':'18479c8c41c5c5a89ed67c5483f61ed828aa97f4',
          'bridge/tests/browser/home-monitor-stability.test.ts':'7cbc5d52be9f471ae2d89b63120318c74901b9b8'}
          for name, sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              assert actual==sha, (name,actual,sha)
          PY
          git diff --check
      - name: Verify all Node tests, typecheck and build
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          node tools/ci-inventory-worker-smoke.mjs
      - name: Verify all Python tests with required dependencies
        run: |
          set -euo pipefail
          python3 -m venv /tmp/stw-validation
          /tmp/stw-validation/bin/python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          /tmp/stw-validation/bin/python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
      - name: Commit verified files and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/version.json tests/addon-config.test.ts tests/protocol-version-contract.test.ts bridge/tests/runtime.test.ts bridge/tests/browser/home-monitor-stability.test.ts
          git rm .github/workflows/offline-validation-kit.yml
          git commit -m 'fix: complete 1.8.57 release validation and passive-state regressions'
          git push origin HEAD:refs/heads/fix/release-1.8.57-validation
