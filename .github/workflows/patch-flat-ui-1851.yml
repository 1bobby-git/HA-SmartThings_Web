name: Patch flat UI 1.8.51

on:
  push:
    branches:
      - ui/flat-surface-1.8.51
    paths:
      - .patch-trigger-1851

permissions:
  contents: write

concurrency:
  group: patch-flat-ui-1851
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/flat-surface-1.8.51
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply patch
        run: python tools/patch-flat-ui-1851.py
      - name: Validate focused patch
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: remove bridge shadows and corner radius (1.8.51)'
          git push origin HEAD:ui/flat-surface-1.8.51
