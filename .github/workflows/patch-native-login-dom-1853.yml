name: Patch native login DOM 1.8.53
on:
  push:
    branches: [fix/native-login-dom-1.8.53]
    paths: [.github/workflows/patch-native-login-dom-1853.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/native-login-dom-1.8.53
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply reviewed patch
        run: |
          python3 tools/_patch_native_login_1853.py
          python3 tools/_patch_native_login_tests_1853.py
          git diff --check
      - name: Node validation
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-login-validation
          npm ci
          npm run typecheck 2>&1 | tee /tmp/native-login-validation/typecheck.log
          npm test 2>&1 | tee /tmp/native-login-validation/unit.log
          npm run build
      - name: Real Chromium regressions
        run: |
          set -euo pipefail
          npx playwright-core install --with-deps chromium
          node tools/ci-native-login-dom-regression.mjs 2>&1 | tee /tmp/native-login-validation/dom.log
          xvfb-run -a node tools/ci-native-login-policy-smoke.mjs 2>&1 | tee /tmp/native-login-validation/policy.log
      - name: Commit only validated candidate
        run: |
          rm .github/workflows/patch-native-login-dom-1853.yml tools/_patch_native_login_1853.py tools/_patch_native_login_tests_1853.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recognize SmartThings login maintenance menu and switch (1.8.53)'
          git push origin HEAD:fix/native-login-dom-1.8.53
      - name: Validation evidence
        if: always()
        run: |
          mkdir -p /tmp/native-login-validation
          git diff > /tmp/native-login-validation/working.patch
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          paths=['bridge/src/browser/native-login-policy.ts','bridge/src/runtime.ts','bridge/src/server/http-server.ts','bridge/src/server/status-page.ts','bridge/src/state/runtime-state.ts','bridge/tests/browser/native-login-policy.test.ts','bridge/tests/server/http-server.test.ts','bridge/tests/server/status-page.test.ts','tools/ci-native-login-dom-regression.mjs']
          print(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-login-validation
          path: /tmp/native-login-validation
          retention-days: 3
