name: Patch native login guidance 1.8.50

on:
  push:
    branches:
      - fix/native-login-guidance-1.8.49
    paths:
      - .patch-trigger-1850

permissions:
  contents: write

concurrency:
  group: patch-native-login-guidance-1850
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/native-login-guidance-1.8.49

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Apply patch
        run: python tools/patch-native-login-guidance-1850.py

      - name: Validate focused patch
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Commit patched candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-native-login-guidance-1850.yml .patch-trigger-1850 tools/patch-native-login-guidance-1850.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: emphasize SmartThings login-maintenance guidance (1.8.50)'
          git push origin HEAD:fix/native-login-guidance-1.8.49
