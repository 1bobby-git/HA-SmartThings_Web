name: Patch soft radius 1.8.52
on:
  push:
    branches:
      - ui/soft-radius-1.8.52
    paths:
      - .soft-radius-trigger-1852
permissions:
  contents: write
concurrency:
  group: patch-soft-radius-1852
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/soft-radius-1.8.52
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply patch
        run: python tools/patch-soft-radius-1852.py
      - name: Validate focused patch
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-soft-radius-1852.yml .soft-radius-trigger-1852 tools/patch-soft-radius-1852.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: restore compact corner radii without shadows (1.8.52)'
          git push origin HEAD:ui/soft-radius-1.8.52
