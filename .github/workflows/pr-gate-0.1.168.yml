name: Gate SmartThings Web 0.1.168 pull request

on:
  push:
    branches:
      - fix/web-parity-advanced-ui-0.1.168
    paths:
      - .github/workflows/pr-gate-0.1.168.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/web-parity-advanced-ui-0.1.168
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Validate complete source
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/web-parity-0.1.168.test.ts
          test "$(python -c 'import json; print(json.load(open("custom_components/smartthings_web/manifest.json", encoding="utf-8"))["version"])')" = "0.1.168"
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run package:addon
          python -m compileall -q custom_components/smartthings_web
      - name: Remove gate after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-gate-0.1.168.yml
          git commit -m "chore: remove temporary 0.1.168 PR gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
