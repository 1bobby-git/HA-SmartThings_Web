name: Prepare Home Monitor 1.8.12
on:
  push:
    branches: [fix/home-monitor-direct-1.8.12]
    paths:
      - .github/workflows/prepare-home-monitor-1.8.12.yml
permissions:
  contents: write
concurrency:
  group: prepare-home-monitor-1.8.12
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/home-monitor-direct-1.8.12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply guarded source and version updates
        run: |
          python tools/prepare-home-monitor-1.8.12.py
          python tools/prepare-home-monitor-1.8.12-tests.py
      - name: Node tests, typecheck, build and audits
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test > /tmp/stw-node-tests.log 2>&1 || { tail -n 160 /tmp/stw-node-tests.log; exit 1; }
          tail -n 12 /tmp/stw-node-tests.log
          npm run typecheck
          npm run build
          npm run audit:api-free
          npm run audit:fixtures
          npm run audit:secrets
      - name: Real Chromium legacy and direct transport regressions
        shell: bash
        run: |
          set -euo pipefail
          npx playwright-core install --with-deps chromium > /tmp/stw-browser-install.log 2>&1 || { tail -n 60 /tmp/stw-browser-install.log; exit 1; }
          node tools/ci-home-monitor-native-smoke.mjs
      - name: Python integration regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web
      - name: Commit validated ordinary source changes only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add bridge/src/runtime.ts bridge/src/command/command-service.ts bridge/src/command/advanced-first-executor.ts tools/ci-home-monitor-native-smoke.mjs package.json package-lock.json protocol/version.json custom_components/smartthings_web/manifest.json addon/smartthings_web_bridge/config.yaml tests/protocol-version-contract.test.ts tests/addon-config.test.ts bridge/tests/runtime.test.ts README.md addon/smartthings_web_bridge/CHANGELOG.md
          test ! -f CHANGELOG.md || git add CHANGELOG.md
          test ! -f addon/smartthings_web_bridge/DOCS.md || git add addon/smartthings_web_bridge/DOCS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: route Home Monitor directly through verified armStateChange service (1.8.12)'
          git push origin HEAD:fix/home-monitor-direct-1.8.12
          git rev-parse HEAD
