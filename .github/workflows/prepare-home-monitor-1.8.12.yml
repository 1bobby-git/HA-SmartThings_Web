name: Prepare Home Monitor 1.8.12
on:
  push:
    branches: [fix/home-monitor-direct-1.8.12]
    paths:
      - .github/workflows/prepare-home-monitor-1.8.12.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect public application source referenced in supplied screenshot
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, re, urllib.request
          url = 'https://d7zh21xt4294z.cloudfront.net/assets/2.57.0/main.js'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  data = response.read(8000001)
              if len(data) > 8000000:
                  raise ValueError('public bundle exceeded bounded read')
              text = data.decode('utf-8')
              print('public_bundle_sha256=' + hashlib.sha256(data).hexdigest())
              print('public_bundle_bytes=' + str(len(data)))
              for term in ['armState', 'api/location', 'security/locations', 'ARMED_STAY']:
                  matches = list(re.finditer(re.escape(term), text))
                  print('TERM', term, 'COUNT', len(matches))
                  for match in matches[:10]:
                      print(text[max(0, match.start()-220):match.end()+320])
          except Exception as error:
              print('public_bundle_unavailable:' + type(error).__name__)
          PY
      - name: List focused source and test paths
        shell: bash
        run: |
          find tests tools -type f | grep -E 'home-monitor|native|version|release|security|api-free' | head -80
          cat package.json
