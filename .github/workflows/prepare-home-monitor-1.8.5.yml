name: Prepare Home Monitor confirmation lifecycle 1.8.5

on:
  push:
    branches: [fix/home-monitor-confirmation-lifecycle-1.8.5]
    paths:
      - .github/workflows/prepare-home-monitor-1.8.5.yml
      - .github/scripts/prepare-home-monitor-1.8.5.py
      - bridge/src/command/location-command-session.ts
      - bridge/tests/command/location-command-session.test.ts
      - tools/ci-home-monitor-confirmation-smoke.mjs

permissions:
  contents: write

concurrency:
  group: prepare-home-monitor-lifecycle-1.8.5
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply reviewed lifecycle changes
        run: |
          python .github/scripts/prepare-home-monitor-1.8.5.py
          python - <<'PY'
          from pathlib import Path

          path = Path('bridge/src/command/command-service.ts')
          text = path.read_text(encoding='utf-8')
          old = '      const failure = commandError(error);'
          assert text.count(old) == 1, 'Location error anchor changed'
          # The confirmation hook now propagates a typed error through the executor.
          # Preserve that type instead of mapping it to a generic dispatch failure.
          text = text.replace(old, '      const failure = error instanceof SafeCommandError ? error : commandError(error);', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '> **현재 상태: `1.8.4` · 실환경 부분 검증**'
          assert text.count(old) == 1, 'README status anchor changed'
          text = text.replace(old, '> **현재 상태: `1.8.5` · 실환경 부분 검증**', 1)
          anchor = '## Scene·Advanced Commands·Galaxy Home Mini TTS'
          assert text.count(anchor) == 1, 'README feature anchor changed'
          note = ('`1.8.5`는 새 Bridge 로그에서 HTML 보안 버튼 하나를 찾아 클릭한 뒤에도 상태 확인이 끝나지 않은 경로를 대상으로 합니다. '
                  '제어 탭을 클릭 직후 닫지 않고 기존 위치별 보안 상태 확인이 완료되거나 실패할 때까지 유지합니다. '
                  '클릭·일반 인벤토리 재조회 완료만으로 경보 상태를 성공으로 표시하지 않습니다. '
                  '요청별 timeout, 확인 오류의 원래 코드와 실패 시 탭 정리를 함께 검증합니다. '
                  '독립 Chromium 합성 화면과 전체 자동 검증 결과는 실제 삼성 계정의 Home Monitor 성공과 구분하며, 실환경 최종 성공은 아직 확인하지 않았습니다.\n\n')
          path.write_text(text.replace(anchor, note + anchor, 1), encoding='utf-8')

          path = Path('tools/ci-home-monitor-confirmation-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          assert text.count('html(150, mode)') == 1
          assert text.count('timeoutMs: 700') == 1
          text = text.replace('html(150, mode)', 'html(400, mode)').replace('timeoutMs: 700', 'timeoutMs: 1600')
          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Node tests, types and build
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Actual Chromium command path regression tests
        run: |
          npx playwright-core install --with-deps chromium
          node tools/ci-home-monitor-dialog-smoke.mjs
          node tools/ci-home-monitor-card-smoke.mjs
          node tools/ci-home-monitor-confirmation-smoke.mjs

      - name: Python integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Repository audits and source whitespace
        run: |
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures
          git diff --check

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          # Workflow edits use the maintainer connection separately; this job only has contents permission.
          git restore .github/workflows/validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge/src/browser/command-page.ts bridge/src/command/command-service.ts bridge/src/runtime.ts
          git add package.json package-lock.json protocol/version.json custom_components/smartthings_web/manifest.json
          git add addon/smartthings_web_bridge/config.yaml addon/smartthings_web_bridge/CHANGELOG.md README.md
          git add tests/addon-config.test.ts tests/protocol-version-contract.test.ts
          git add tools/ci-home-monitor-confirmation-smoke.mjs
          git rm .github/scripts/prepare-home-monitor-1.8.5.py
          git diff --cached --check
          git commit -m 'fix: retain Home Monitor command page through state confirmation 1.8.5'
          git push origin HEAD:fix/home-monitor-confirmation-lifecycle-1.8.5
