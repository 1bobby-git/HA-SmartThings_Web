name: Prepare Home Monitor confirmation lifecycle 1.8.5

on:
  push:
    branches: [fix/home-monitor-confirmation-lifecycle-1.8.5]
    paths:
      - .github/workflows/prepare-home-monitor-1.8.5.yml
      - .github/scripts/prepare-home-monitor-1.8.5.py
      - bridge/src/command/location-command-session.ts
      - bridge/tests/command/location-command-session.test.ts
      - tools/ci-home-monitor-confirmation-smoke.mjs

permissions:
  contents: write

concurrency:
  group: prepare-home-monitor-lifecycle-1.8.5
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply reviewed lifecycle changes
        run: python .github/scripts/prepare-home-monitor-1.8.5.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Node tests, types and build
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Actual Chromium command path regression tests
        run: |
          npx playwright-core install --with-deps chromium
          node tools/ci-home-monitor-dialog-smoke.mjs
          node tools/ci-home-monitor-card-smoke.mjs
          node tools/ci-home-monitor-confirmation-smoke.mjs

      - name: Python integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Repository audits and source whitespace
        run: |
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures
          git diff --check

      - name: Commit verified source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge/src/browser/command-page.ts bridge/src/command/command-service.ts bridge/src/runtime.ts
          git add package.json package-lock.json protocol/version.json custom_components/smartthings_web/manifest.json
          git add addon/smartthings_web_bridge/config.yaml addon/smartthings_web_bridge/CHANGELOG.md
          git add tests/addon-config.test.ts tests/protocol-version-contract.test.ts .github/workflows/validate.yml
          git rm .github/scripts/prepare-home-monitor-1.8.5.py .github/workflows/prepare-home-monitor-1.8.5.yml
          git diff --cached --check
          git commit -m 'fix: retain Home Monitor command page through state confirmation 1.8.5'
          git push origin HEAD:fix/home-monitor-confirmation-lifecycle-1.8.5
