name: Prepare Home Monitor 1.8.9

on:
  push:
    branches:
      - fix/home-monitor-state-delivery-1.8.9
    paths:
      - '.github/scripts/prepare_1_8_9.py'
      - '.github/workflows/prepare-home-monitor-1.8.9.yml'
      - 'bridge/src/command/location-rechecks.ts'
      - 'bridge/src/state/location-read-proof.ts'
      - 'bridge/tests/command/location-delivery.test.ts'

permissions:
  contents: write

concurrency:
  group: prepare-home-monitor-1.8.9
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Assemble checked source contexts
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6edcf199c413af283418ba554c7d419ecbc7c225 HEAD
          python .github/scripts/prepare_1_8_9.py
          python - <<'PY'
          from pathlib import Path
          paths = ["CHANGELOG.md", "addon/smartthings_web_bridge/CHANGELOG.md", "addon/smartthings_web_bridge/DOCS.md", "addon/smartthings_web_bridge/README.md", "docs/HOME_MONITOR_1.8.9.md"]
          for name in paths:
              path = Path(name)
              text = path.read_text(encoding="utf-8").replace("최대 5회의 순차적 상태 확인을 수행합니다.", "최대 5회의 순차적 상태 확인 사이클을 수행합니다. 날짜 없는 반대 상태의 확인은 사이클당 두 번의 읽기를 사용합니다.")
              path.write_text(text.rstrip() + "\n", encoding="utf-8")
          PY
          git diff --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Node regressions, typecheck and build
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Python integration regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web

      - name: Existing browser control regressions
        run: |
          npx playwright-core install --with-deps chromium
          node tools/ci-home-monitor-dialog-smoke.mjs
          node tools/ci-home-monitor-card-smoke.mjs
          node tools/ci-home-monitor-confirmation-smoke.mjs
          node tools/ci-home-monitor-latency-smoke.mjs
          node tools/home-monitor-selector-regression.mjs

      - name: Repository audits
        run: |
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures

      - name: Commit validated source and remove temporary preparation files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/prepare_1_8_9.py .github/workflows/prepare-home-monitor-1.8.9.yml
          git add bridge custom_components package.json package-lock.json protocol tests README.md CHANGELOG.md docs addon
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: deliver verified Home Monitor state promptly (1.8.9)'
          git push origin HEAD:fix/home-monitor-state-delivery-1.8.9
