name: Prepare native Home Monitor 1.8.11
on:
  push:
    branches:
      - fix/home-monitor-native-buttons-1.8.11
    paths:
      - .github/workflows/prepare-native-home-monitor.yml
      - tools/prepare-native-home-monitor.py
      - tools/ci-home-monitor-native-smoke.mjs
      - bridge/src/browser/home-monitor-native.ts
      - custom_components/smartthings_web/tests/test_home_monitor_transition.py
permissions:
  contents: write
concurrency:
  group: prepare-native-home-monitor-1.8.11
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply reviewed source anchors and version update
        run: python tools/prepare-native-home-monitor.py
      - name: Install locked dependencies
        run: npm ci
      - name: Node regression, typecheck, and build
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Native button lifecycle in real Chromium
        run: |
          npx playwright-core install --with-deps chromium
          node tools/ci-home-monitor-native-smoke.mjs
      - name: Python integration and boundary checks
        run: |
          python -m venv /tmp/native-home-monitor-venv
          . /tmp/native-home-monitor-venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input 'aiohttp>=3.9,<4' 'voluptuous>=0.13,<1'
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          python -m compileall -q custom_components/smartthings_web
          npm run audit:api-free
          npm run audit:secrets
          npm run audit:fixtures
      - name: Remove one-shot preparation and commit the validated diff
        run: |
          set -euo pipefail
          rm tools/prepare-native-home-monitor.py .github/workflows/prepare-native-home-monitor.yml
          git diff --check
          git fetch origin fix/home-monitor-native-buttons-1.8.11
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete native Home Monitor transitions and release metadata 1.8.11'
          git push origin HEAD:fix/home-monitor-native-buttons-1.8.11
