name: Prepare quick-start documentation contracts
on:
  push:
    branches: [docs/readme-quick-start]
    paths: [.github/workflows/prepare-readme-contracts.yml]
permissions:
  contents: write
jobs:
  documentation:
    if: github.repository == '1bobby-git/HA-SmartThings_Web' && github.ref == 'refs/heads/docs/readme-quick-start'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/readme-quick-start
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Relocate documentation assertions without changing evidence checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          def git_hash(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          def replace_once(s, old, new):
              assert s.count(old) == 1, f'Expected one exact match: {old[:90]}'
              return s.replace(old, new, 1)

          p = Path('tests/documentation-gate.test.ts')
          assert git_hash(p.read_bytes()) == '3dd8e69827c643f6ba19d92d52e70b3b10780171'
          s = original = p.read_text()
          start = s.index('    expect(readme).toContain("Current status')
          end = s.index('    expect(serviceGuide).toContain("개발자 도구")', start)
          s = s[:start] + '''    // Installation and protocol internals belong in the linked detailed docs,
              // not hidden compatibility text in the newcomer README.
              expect(addonDocs).toContain("no separate Docker installation or Docker commands are required");
              expect(addonDocs).toContain("Settings → Apps → Install app");
              expect(addonDocs).toContain("The configured slug is `smartthings_web_bridge`");
              expect(manual).toContain("npx tsx tools/haos-capture-origin-audit.ts");
              expect(readme).toContain("docs/smartthings-web-services-ui-guide.md");
              expect(readme).toContain("addon/smartthings_web_bridge/DOCS.md");
              expect(readme).toContain("[상세 문서](docs/)");
          ''' + s[end:]
          start = s.index('    expect(readme).toContain("Version 0.1.28')
          end = s.index('    expect(feasibility).toContain("Version 0.1.28', start)
          s = s[:start] + '''    // Historical evidence and long-run limits stay in their original reports.
              expect(feasibility).toContain("sequence 642 through 672 with zero gaps");
              expect(session).toContain("The privacy-safe 72-hour passive soak is deferred");
              expect(manual).toContain(
                "The probe adds no DOM state source, direct SmartThings API call, Home Assistant entity, command path, or persistent event journal."
              );
          ''' + s[end:]
          s = replace_once(s, '    expect(readme).toContain("npm run probe:physical-action:haos");\n', '')
          s = replace_once(s, '    expect(readme).toContain("npx tsx tools/haos-core-restart-continuity.ts");\n', '')
          s = replace_once(s, 'expect(`${readme}\\n${manual}\\n${soakDocs}`)', 'expect(`${manual}\\n${soakDocs}`)')
          s = replace_once(s, 'expect(`${readme}\\n${feasibility}\\n${protocol}\\n${session}`)', 'expect(`${feasibility}\\n${protocol}\\n${session}`)')
          assert original[original.index('    expect(existsSync(evidencePath))'):] == s[s.index('    expect(existsSync(evidencePath))'):]
          s += '''

          describe("New user README", () => {
            test("keeps a short introduction and the complete three-step installation", () => {
              const readme = readFileSync("README.md", "utf8");
              const visible = readme.replace(/<!--[\\s\\S]*?-->/g, "");
              expect(visible).toContain("# HA SmartThings Web");
              expect(visible).toContain("Home Assistant OS, HACS");
              expect(visible).toContain("별도의 SmartThings API 키는 필요하지 않습니다");
              expect(visible).toContain("Samsung 계정에 로그인");
              expect(visible).toContain("Home Assistant를 재시작");
              expect(visible).toContain("페어링 코드 생성");
              expect(visible).toContain("SmartThings 위치 선택");
              expect(visible).toContain("Bridge 앱과 HACS 통합을 모두 설치해야 합니다");
              expect(visible).toContain("지원 기능은 기기에 따라");
              expect(visible).toContain("비공식");
              const stepHeadings = [...visible.matchAll(/^### ([123])\\./gm)].map((match) => match[1]);
              expect(stepHeadings).toEqual(["1", "2", "3"]);
              expect(visible.split("\\n").length).toBeLessThanOrEqual(80);
              expect(visible).not.toMatch(/setPeopleCounter|peopleCounter|통신 프로토콜|안정적|동작 구조/);
              expect(readme).not.toContain("documentation-gate compatibility");
              for (const destination of [
                "docs/smartthings-web-services-ui-guide.md",
                "addon/smartthings_web_bridge/DOCS.md",
                "docs/",
                "CHANGELOG.md",
                "LICENSE"
              ]) {
                expect(visible).toContain(`](${destination})`);
                expect(existsSync(destination), destination).toBe(true);
              }
              for (const redirect of ["supervisor_addon", "hacs_repository", "config_flow_start"]) {
                expect(visible).toContain(`https://my.home-assistant.io/redirect/${redirect}/?`);
              }
              expect(visible).toContain("addon=8a97f131_smartthings_web_bridge");
              expect(visible).toContain("repository=HA-SmartThings_Web&category=integration");
              expect(visible).toContain("domain=smartthings_web");
            });
          });
          '''
          p.write_text(s)
          p = Path('tests/bridge-autodiscovery-contract.test.ts')
          assert git_hash(p.read_bytes()) == '2b64d81ee91df4f577a74d5bf6c514e7923578d7'
          s = replace_once(p.read_text(), '''    expect(readme).toContain(
                "현재 저장소 설치 앱 ID: `8a97f131_smartthings_web_bridge`"
              );
              expect(readme).toContain(
                "현재 저장소 설치 내부 DNS: `8a97f131-smartthings-web-bridge`"
              );''', '''    // The README links installation; internal DNS details stay in the guide.
              expect(readme).toContain("addon=8a97f131_smartthings_web_bridge");
              expect(readme).toContain("addon/smartthings_web_bridge/DOCS.md");
              expect(localUpdateDocs).toContain("http://8a97f131-smartthings-web-bridge:8100");''')
          p.write_text(s)
          PY
          git diff --check
      - name: Verify documentation and type contracts
        run: |
          npm ci
          npm run typecheck
          npm test -- tests/documentation-gate.test.ts tests/bridge-autodiscovery-contract.test.ts
      - name: Commit documentation-contract changes on this branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/documentation-gate.test.ts tests/bridge-autodiscovery-contract.test.ts
          git commit -m 'test: verify quick-start README and keep detailed evidence in its source docs'
          git push origin HEAD:refs/heads/docs/readme-quick-start
