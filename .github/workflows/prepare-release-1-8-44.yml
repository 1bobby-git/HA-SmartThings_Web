name: Prepare SmartThings Web 1.8.44
on:
  push:
    branches: [release/1.8.44]
    paths: [.github/workflows/prepare-release-1-8-44.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/1.8.44
      - name: Apply release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          version='1.8.44'
          previous='1.8.43'

          # package.json
          p=Path('package.json'); data=json.loads(p.read_text()); assert data['version']==previous; data['version']=version; p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          # package-lock.json root and package metadata
          p=Path('package-lock.json'); data=json.loads(p.read_text()); assert data['version']==previous; data['version']=version; assert data['packages']['']['version']==previous; data['packages']['']['version']=version; p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          # HA integration manifest
          p=Path('custom_components/smartthings_web/manifest.json'); data=json.loads(p.read_text()); assert data['version']==previous; data['version']=version; p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          # protocol bridge version only; protocol remains unchanged
          p=Path('protocol/version.json'); data=json.loads(p.read_text()); assert data['bridge_version']==previous; data['bridge_version']=version; p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          # add-on version
          p=Path('addon/smartthings_web_bridge/config.yaml'); t=p.read_text(); assert f'version: {previous}' in t; p.write_text(t.replace(f'version: {previous}', f'version: {version}', 1))

          # runtime version and exact tests
          for name in ['bridge/src/runtime.ts','bridge/tests/runtime.test.ts','tests/addon-config.test.ts','tests/protocol-version-contract.test.ts']:
              p=Path(name); t=p.read_text(); assert previous in t, name; p.write_text(t.replace(previous, version))

          notes='''## 1.8.44\n\n- 실사용 v1.8.43 로그에서 정상 keepalive·proactive refresh 이후 Samsung Account의 `no_visible_auth_input` 상태에 고착되는 문제를 후속 개선합니다.\n- proactive refresh가 SmartThings Location을 바로 열기 전에 Samsung Account를 일반 브라우저 경로로 먼저 방문해, 아직 유효한 Samsung 웹 세션이 서버에서 정상적으로 갱신될 기회를 제공합니다.\n- 로그인 감지를 top-level input뿐 아니라 open Shadow DOM, same-origin iframe 및 Samsung 계열 인증 iframe까지 확대하고 `embedded_auth_input`을 별도 인증 표면으로 구분합니다.\n- 비밀번호·OTP·이메일 값, 쿠키 값, 토큰은 읽거나 기록하지 않으며 자동 입력, MFA 우회, 쿠키 만료 변경은 하지 않습니다. 기존 persistent Chromium profile과 암호화된 session-state를 유지합니다.\n- 세션 집중 회귀 35개와 전체 Node 1,705개 테스트, typecheck, build, API-free/secrets/fixture 검사를 통과한 변경을 배포합니다.\n- Bridge 앱과 Home Assistant 통합 배포 버전은 1.8.44이며 protocol 5 호환성을 유지합니다. 이 수정은 Bridge 코드 변경이므로 **Bridge 앱을 1.8.44로 업데이트해야 적용됩니다.**\n- Samsung 서버가 세션을 실제로 폐기하거나 MFA/재인증을 요구하면 자동 우회하지 않으며 Bridge 웹 UI에서 다시 로그인해야 합니다.\n\n'''
          for name in ['CHANGELOG.md','addon/smartthings_web_bridge/CHANGELOG.md']:
              p=Path(name); p.write_text(notes + p.read_text())
          Path('release-notes/1.8.44.md').write_text(notes.split('\n\n',1)[1])
          PY
          git diff --check
          git add package.json package-lock.json custom_components/smartthings_web/manifest.json protocol/version.json addon/smartthings_web_bridge/config.yaml bridge/src/runtime.ts bridge/tests/runtime.test.ts tests/addon-config.test.ts tests/protocol-version-contract.test.ts CHANGELOG.md addon/smartthings_web_bridge/CHANGELOG.md release-notes/1.8.44.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: SmartThings Web 1.8.44 session continuity follow-up'
          git push origin HEAD:refs/heads/release/1.8.44
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run audit:api-free && npm run audit:secrets && npm run audit:fixtures
