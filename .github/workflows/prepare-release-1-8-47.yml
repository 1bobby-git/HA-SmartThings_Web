name: Prepare SmartThings Web 1.8.47

"on":
  push:
    branches:
      - release/1.8.47
    paths:
      - .github/workflows/prepare-release-1-8-47.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/1.8.47

      - name: Apply 1.8.47 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare-release-1-8-47.py
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: SmartThings Web 1.8.47 session-aware Bridge status UI'
          git push origin HEAD:refs/heads/release/1.8.47
