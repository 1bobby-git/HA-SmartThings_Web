name: Prepare SmartThings Web 0.1.154

on:
  push:
    branches:
      - improve/security-recovery-0.1.154

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/security-recovery-0.1.154
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded security and recovery changes
        shell: python
        run: |
          from __future__ import annotations

          import json
          from pathlib import Path

          VERSION_OLD = "0.1.153"
          VERSION_NEW = "0.1.154"

          def replace(path: str, old: str, new: str, *, count: int = -1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              updated = text.replace(old, new, count)
              target.write_text(updated, encoding="utf-8")

          replace(
              "addon/smartthings_web_bridge/rootfs/etc/nginx/nginx.conf",
              "    deny all;\n\n    location / {\n      proxy_pass http://127.0.0.1:8098;",
              "    deny all;\n\n    location = /api/v1/pairing-code {\n      return 403;\n    }\n\n    location / {\n      proxy_pass http://127.0.0.1:8098;",
              count=1,
          )

          replace(
              "bridge/src/server/health.ts",
              "  const live =\n    snapshot.dbAvailable &&",
              "  const live =\n    snapshot.state !== \"BROWSER_FAILED\" &&\n    snapshot.dbAvailable &&",
              count=1,
          )

          replace(
              "bridge/tests/server/health.test.ts",
              'test("keeps liveness independent from login, browser, and push status", () => {',
              'test("fails liveness after a terminal browser startup failure", () => {',
              count=1,
          )
          replace(
              "bridge/tests/server/health.test.ts",
              "    expect(report.live).toBe(true);",
              "    expect(report.live).toBe(false);",
              count=1,
          )

          replace(
              "custom_components/smartthings_web/__init__.py",
              "_EVENT_RECONNECT_MIN_DELAY = 0.05\n_EVENT_RECONNECT_MAX_DELAY = 1.0",
              "_EVENT_RECONNECT_MIN_DELAY = 1.0\n_EVENT_RECONNECT_MAX_DELAY = 60.0",
              count=1,
          )
          replace(
              "custom_components/smartthings_web/__init__.py",
              "_event_loop(entry),",
              "_event_loop(hass, entry),",
              count=1,
          )
          replace(
              "custom_components/smartthings_web/__init__.py",
              "async def _event_loop(entry: SmartThingsWebConfigEntry) -> None:",
              "async def _event_loop(\n    hass: HomeAssistant,\n    entry: SmartThingsWebConfigEntry,\n) -> None:",
              count=1,
          )
          replace(
              "custom_components/smartthings_web/__init__.py",
              "        except BridgeAuthError:\n            await asyncio.sleep(5)",
              "        except BridgeAuthError:\n            entry.async_start_reauth(hass)\n            return",
              count=1,
          )

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = VERSION_NEW
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          lock_path = Path("package-lock.json")
          lock_text = lock_path.read_text(encoding="utf-8")
          old_version_line = f'"version": "{VERSION_OLD}"'
          if lock_text.count(old_version_line) < 2:
              raise SystemExit("package-lock root versions were not found")
          lock_path.write_text(
              lock_text.replace(
                  old_version_line,
                  f'"version": "{VERSION_NEW}"',
                  2,
              ),
              encoding="utf-8",
          )

          replace(
              "addon/smartthings_web_bridge/config.yaml",
              f"version: {VERSION_OLD}",
              f"version: {VERSION_NEW}",
              count=1,
          )
          replace(
              "bridge/src/runtime.ts",
              f'const bridgeVersion = "{VERSION_OLD}";',
              f'const bridgeVersion = "{VERSION_NEW}";',
              count=1,
          )

          protocol_path = Path("protocol/version.json")
          protocol = json.loads(protocol_path.read_text(encoding="utf-8"))
          protocol["bridge_version"] = VERSION_NEW
          protocol_path.write_text(
              json.dumps(protocol, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          manifest_path = Path("custom_components/smartthings_web/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = VERSION_NEW
          manifest["codeowners"] = ["@1bobby-git"]
          manifest["issue_tracker"] = (
              "https://github.com/1bobby-git/HA-SmartThings_Web/issues"
          )
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          replace(
              "README.md",
              f"버전 {VERSION_OLD}",
              f"버전 {VERSION_NEW}",
              count=1,
          )

          changelog_path = Path("addon/smartthings_web_bridge/CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = f"## {VERSION_NEW}"
          if heading not in changelog:
              entry = (
                  f"# Changelog\n\n{heading}\n\n"
                  "- Home Assistant Core 내부 API 경로에서 페어링 코드 발급을 차단하고, "
                  "인증된 Ingress 경로에서만 발급되도록 신뢰 경계를 분리합니다.\n"
                  "- Chromium 시작 재시도를 모두 소진한 `BROWSER_FAILED` 상태는 liveness 실패로 "
                  "처리해 애드온 watchdog이 자동 복구하도록 합니다.\n"
                  "- 실행 중 브리지 토큰이 거부되면 무한 재시도 대신 Home Assistant 재인증 흐름을 "
                  "시작합니다.\n"
                  "- SSE 재연결 backoff를 1초에서 최대 60초까지 확장해 장시간 애드온 중단 시 "
                  "불필요한 연결 부하를 줄입니다.\n\n"
              )
              if not changelog.startswith("# Changelog\n"):
                  raise SystemExit("unexpected changelog header")
              changelog_path.write_text(
                  entry + changelog[len("# Changelog\n\n"):],
                  encoding="utf-8",
              )

          replace(
              "tests/addon-config.test.ts",
              f'test("packages repeatable composite Web execution as version {VERSION_OLD}", () => {{',
              f'test("packages hardened bridge recovery as version {VERSION_NEW}", () => {{',
              count=1,
          )
          replace(
              "tests/addon-config.test.ts",
              f'expect(config.version).toBe("{VERSION_OLD}");',
              f'expect(config.version).toBe("{VERSION_NEW}");',
              count=1,
          )
          replace(
              "tests/addon-config.test.ts",
              f'expect(packageMetadata.version).toBe("{VERSION_OLD}");',
              f'expect(packageMetadata.version).toBe("{VERSION_NEW}");',
              count=1,
          )
          replace(
              "tests/addon-config.test.ts",
              f'expect(protocolMetadata.bridge_version).toBe("{VERSION_OLD}");',
              f'expect(protocolMetadata.bridge_version).toBe("{VERSION_NEW}");',
              count=1,
          )
          replace(
              "tests/addon-config.test.ts",
              f'expect(runtime).toContain(\'const bridgeVersion = "{VERSION_OLD}";\');',
              f'expect(runtime).toContain(\'const bridgeVersion = "{VERSION_NEW}";\');',
              count=1,
          )
          replace(
              "tests/addon-config.test.ts",
              f'expect(changelog).toContain("## {VERSION_OLD}");',
              f'expect(changelog).toContain("## {VERSION_NEW}");\n    expect(changelog).toContain("## {VERSION_OLD}");',
              count=1,
          )

          Path("tests/runtime-hardening.test.ts").write_text(
              '''import { readFileSync } from "node:fs";
          import { describe, expect, test } from "vitest";

          const readText = (path: string) => readFileSync(path, "utf8");

          describe("runtime hardening", () => {
            test("keeps pairing-code creation on the authenticated ingress boundary", () => {
              const nginx = readText("addon/smartthings_web_bridge/rootfs/etc/nginx/nginx.conf");
              const coreServer = nginx.split("listen 8100;", 2)[1] ?? "";
              expect(coreServer).toContain("location = /api/v1/pairing-code");
              expect(coreServer).toContain("return 403;");
            });

            test("starts reauthentication and stops the stale event loop on token rejection", () => {
              const integration = readText("custom_components/smartthings_web/__init__.py");
              expect(integration).toContain("_EVENT_RECONNECT_MIN_DELAY = 1.0");
              expect(integration).toContain("_EVENT_RECONNECT_MAX_DELAY = 60.0");
              expect(integration).toContain("entry.async_start_reauth(hass)");
              expect(integration).toMatch(/except BridgeAuthError:\\n\\s+entry\\.async_start_reauth\\(hass\\)\\n\\s+return/);
            });
          });
          '''.replace("          ", ""),
              encoding="utf-8",
          )

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run Node tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden pairing and recovery for 0.1.154"
          git push origin HEAD:improve/security-recovery-0.1.154
