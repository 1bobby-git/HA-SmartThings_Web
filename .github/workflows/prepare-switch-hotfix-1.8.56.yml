name: Prepare switch confirmation hotfix 1.8.56

on:
  push:
    branches:
      - automation/prepare-switch-hotfix-1.8.56
permissions:
  contents: write
concurrency:
  group: prepare-switch-hotfix-1.8.56
  cancel-in-progress: false
jobs:
  finalize-release-notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out fully tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 780b2e3bf6ccd2462f98694d9fb1582f0f0854cb
          fetch-depth: 0
          persist-credentials: false
      - name: Put the new release entry before older entries
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in ['CHANGELOG.md', 'addon/smartthings_web_bridge/CHANGELOG.md']:
              path = Path(name)
              text = path.read_text()
              assert text.startswith('## 1.8.55\n')
              assert text.count('## 1.8.56\n') == 1
              start = text.index('## 1.8.56\n')
              end = text.index('\n## ', start)
              entry = text[start:end].rstrip()
              path.write_text(entry + '\n\n' + text[:start].rstrip() + '\n\n' + text[end:].lstrip(), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --stat
      - name: Publish documentation-only follow-up without changing tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = c99045af1af377c60ff759731034be183848453c
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/fix/switch-confirmation-1.8.56" --jq '.object.sha')" = 780b2e3bf6ccd2462f98694d9fb1582f0f0854cb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md addon/smartthings_web_bridge/CHANGELOG.md
          git commit -m 'docs: place 1.8.56 release notes first'
          git diff --exit-code 780b2e3bf6ccd2462f98694d9fb1582f0f0854cb HEAD -- . ':!CHANGELOG.md' ':!addon/smartthings_web_bridge/CHANGELOG.md'
          git -c credential.helper='!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/fix/switch-confirmation-1.8.56
          echo "Final candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
