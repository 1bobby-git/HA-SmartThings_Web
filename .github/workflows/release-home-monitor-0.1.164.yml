name: Prepare Home Monitor 0.1.164

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-home-monitor-0.1.164.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'package.json',
              'package-lock.json',
              'protocol/version.json',
              'bridge/src/runtime.ts',
              'addon/smartthings_web_bridge/config.yaml',
              'custom_components/smartthings_web/manifest.json',
              'tests/addon-config.test.ts',
              'tests/protocol-version-contract.test.ts',
          ]
          for filename in files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '0.1.163' not in text:
                  raise SystemExit(f'missing 0.1.163 in {filename}')
              path.write_text(text.replace('0.1.163', '0.1.164'), encoding='utf-8')

          changelog = Path('addon/smartthings_web_bridge/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '## 0.1.164\n\n'
          if heading not in text:
              changelog.write_text(
                  heading
                  + '- Home Monitor 가용성을 armState 수집 여부와 분리했습니다. Location이 존재하면 초기 상태가 아직 없어도 alarm_control_panel을 제어할 수 있습니다.\n'
                  + '- 다중 Location에서 추가 Location처럼 첫 SECURITY_ARM_STATE_EVENT가 아직 수신되지 않은 Home Monitor도 unavailable 대신 unknown 상태로 유지하고 외출/재실/해제 명령을 허용합니다.\n\n'
                  + text,
                  encoding='utf-8',
              )
          PY
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'aiohttp>=3.10,<4' 'yarl>=1.9,<2' 'voluptuous>=0.15,<1'
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'
          npm ci
          npm run typecheck
          npm test
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json protocol/version.json bridge/src/runtime.ts addon/smartthings_web_bridge/config.yaml addon/smartthings_web_bridge/CHANGELOG.md custom_components/smartthings_web/manifest.json tests/addon-config.test.ts tests/protocol-version-contract.test.ts
          git diff --cached --check
          git commit -m 'Release Home Monitor availability fix 0.1.164'
          git push origin HEAD:main
