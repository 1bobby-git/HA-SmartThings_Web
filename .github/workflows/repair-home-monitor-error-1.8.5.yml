name: Repair Home Monitor confirmation error 1.8.5

on:
  push:
    branches:
      - fix/home-monitor-lifecycle-1.8.5
    paths:
      - .github/workflows/repair-home-monitor-error-1.8.5.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Preserve typed confirmation errors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('bridge/src/command/command-service.ts')
          raw = path.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if actual != '8f905850a1a267a2a120d078246b9541e43c471b':
              raise SystemExit('Reviewed source changed; refusing to overwrite')
          old = '      const failure = commandError(error);\n'
          new = '      const failure = error instanceof SafeCommandError ? error : commandError(error);\n'
          text = raw.decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('Expected one location failure boundary')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge/src/command/command-service.ts
          git diff --cached --check
          git commit -m 'fix: keep Home Monitor confirmation timeout distinct from dispatch failures'
          git push origin HEAD:fix/home-monitor-lifecycle-1.8.5
