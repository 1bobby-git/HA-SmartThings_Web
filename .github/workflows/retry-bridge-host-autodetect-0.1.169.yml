name: Retry Bridge host auto-detection 0.1.169

on:
  push:
    branches:
      - fix/bridge-host-autodetect-0.1.169
    paths:
      - .github/workflows/retry-bridge-host-autodetect-0.1.169.yml

permissions:
  contents: write

jobs:
  apply:
    name: Reapply, validate, and commit 0.1.169
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/bridge-host-autodetect-0.1.169
          fetch-depth: 0

      - name: Reapply prepared source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-bridge-host-autodetect-0.1.169.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = lines[start:end]
          indent = min(len(line) - len(line.lstrip(' ')) for line in body if line.strip())
          script = '\n'.join(line[indent:] if line.strip() else '' for line in body) + '\n'
          compile(script, '/tmp/apply-bridge-host-autodetect-0.1.169.py', 'exec')
          Path('/tmp/apply-bridge-host-autodetect-0.1.169.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply-bridge-host-autodetect-0.1.169.py
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run Home Assistant integration validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check aiohttp yarl voluptuous
          python -m compileall -q custom_components/smartthings_web
          python -m unittest discover -s custom_components/smartthings_web/tests -p 'test_*.py'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm

      - name: Run Node validation and package Bridge
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run package:addon

      - name: Commit verified product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-bridge-host-autodetect-0.1.169.yml \
            .github/workflows/retry-bridge-host-autodetect-0.1.169.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: auto-detect installed Bridge hostname in 0.1.169"
          git push origin "HEAD:${GITHUB_REF_NAME}"
