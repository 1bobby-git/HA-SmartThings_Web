name: Room occupancy source snapshot
on:
  push:
    branches: [fix/advanced-rooms-occupancy-1.8.16]
    paths: [.github/workflows/review-rooms-occupancy.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rooms-occupancy-source
          path: source.tar.gz
          retention-days: 1
