name: Room review snapshot
on:
  push:
    branches: [fix/room-mapping-device-class-1.8.15]
    paths: [.github/workflows/room-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: room-review-source
          path: source.tar.gz
          retention-days: 1
