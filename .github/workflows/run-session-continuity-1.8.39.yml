name: Run session continuity 1.8.39 patch

on:
  push:
    branches:
      - fix/session-continuity-1.8.39
    paths:
      - .github/workflows/run-session-continuity-1.8.39.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Extract and apply the session patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-session-continuity-1.8.39.yml').read_text()
          begin_token = "          python3 - <<'PY'\n"
          end_token = "\n          PY\n"
          start = source.index(begin_token) + len(begin_token)
          end = source.index(end_token, start)
          body = source[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/apply-session-continuity.py').write_text(body)
          PY
          python3 /tmp/apply-session-continuity.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Preserve the existing encrypted-store envelope/constants. Only the newly
          # inserted restore helper is narrowed; the legacy addCookies fallback stays
          # in runtime.ts under its pre-existing API-free audit exception.
          p = Path('bridge/src/security/session-state.ts')
          text = p.read_text()
          pattern = re.compile(
              r'export type SessionStorageRestoreMode = "full" \| "legacy" \| "unavailable";.*?\n}\n\n(?=interface EncryptedSessionStateEnvelope)',
              re.S,
          )
          replacement = '''export type SessionStorageRestoreMode = "full" | "legacy";\n\nexport interface SessionStorageRestoreContext {\n  setStorageState?: (state: SessionStorageState) => Promise<unknown>;\n}\n\n/** Restore the complete last verified Playwright storage state when supported.\n * This covers cookies, localStorage and IndexedDB. The caller keeps the existing\n * cookie + page-localStorage compatibility path for older contexts.\n */\nexport async function restoreSessionStorageState(\n  context: SessionStorageRestoreContext,\n  state: SessionStorageState\n): Promise<SessionStorageRestoreMode> {\n  if (!context.setStorageState) return "legacy";\n  await context.setStorageState(state);\n  return "full";\n}\n\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('failed to narrow storage-state restore helper')
          p.write_text(text)

          p = Path('bridge/src/runtime.ts')
          text = p.read_text()
          old = '''    // api-free-audit: encrypted-session-restore\n    const restoreMode = await restoreSessionStorageState(context, state);\n    if (restoreMode === "unavailable") return undefined;\n    await page.goto(KEEPER_URL, { waitUntil: "domcontentloaded", timeout: 12_000 });'''
          new = '''    const restoreMode = await restoreSessionStorageState(context, state);\n    if (restoreMode === "legacy" && state.cookies.length > 0) {\n      if (!context.addCookies) return undefined;\n      // api-free-audit: encrypted-session-restore\n      await context.addCookies(state.cookies);\n    }\n    await page.goto(KEEPER_URL, { waitUntil: "domcontentloaded", timeout: 12_000 });'''
          if old not in text:
              raise SystemExit('failed to restore audited runtime cookie fallback')
          p.write_text(text.replace(old, new, 1))

          p = Path('bridge/tests/security/session-state.test.ts')
          text = p.read_text()
          text, count = re.subn(
              r'\n  test\("keeps the cookie compatibility restore when full storage restore is unavailable", async \(\) => \{.*?\n  \}\);\n',
              '''\n  test("reports legacy mode when full Playwright storage restore is unavailable", async () => {\n    const state = { cookies: [{ name: "session" }], origins: [] };\n    expect(await restoreSessionStorageState({}, state)).toBe("legacy");\n  });\n''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('failed to update storage restore fallback test')
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Focused regression tests
        run: npx vitest run bridge/tests/browser/session-recovery.test.ts bridge/tests/browser/session-proactive-refresh.test.ts bridge/tests/security/session-state.test.ts
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Security boundary audits
        run: |
          npm run audit:api-free
          npm run audit:secrets
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md addon/smartthings_web_bridge/CHANGELOG.md addon/smartthings_web_bridge/config.yaml bridge/src/browser/keeper-page.ts bridge/src/runtime.ts bridge/src/security/session-state.ts bridge/tests/browser/session-recovery.test.ts bridge/tests/security/session-state.test.ts custom_components/smartthings_web/manifest.json package.json package-lock.json protocol/version.json
          git diff --cached --check
          git commit -m "fix: harden SmartThings session recovery (1.8.39)"
          git push origin HEAD:fix/session-continuity-1.8.39
