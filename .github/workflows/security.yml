name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-security:
    name: Node and repository security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify direct SmartThings API boundary
        run: npm run audit:api-free

      - name: Scan production source for secrets
        run: npm run audit:secrets

      - name: Verify sanitized fixtures
        run: npm run audit:fixtures

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            report="${RUNNER_TEMP}/npm-audit-${attempt}.json"
            error_log="${RUNNER_TEMP}/npm-audit-${attempt}.err"
            set +e
            timeout --foreground --kill-after=10s 90s \
              npm audit --omit=dev --audit-level=high --json \
              >"${report}" 2>"${error_log}"
            command_status=$?
            python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(3)

          metadata = report.get("metadata")
          vulnerabilities = metadata.get("vulnerabilities") if isinstance(metadata, dict) else None
          if not isinstance(vulnerabilities, dict):
              raise SystemExit(3)

          high = int(vulnerabilities.get("high", 0) or 0)
          critical = int(vulnerabilities.get("critical", 0) or 0)
          if high or critical:
              print(f"npm audit found high={high}, critical={critical}", file=sys.stderr)
              raise SystemExit(2)

          print(
              "npm audit passed: "
              + ", ".join(
                  f"{name}={int(vulnerabilities.get(name, 0) or 0)}"
                  for name in ("info", "low", "moderate", "high", "critical")
              )
          )
          PY
            report_status=$?
            set -e

            case "${report_status}" in
              0)
                exit 0
                ;;
              2)
                exit 1
                ;;
            esac

            echo "::warning::npm audit attempt ${attempt} did not return a usable registry report (status ${command_status})."
            tail -n 20 "${error_log}" >&2 || true
            if [[ "${attempt}" != "3" ]]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::warning::Registry-backed npm audit remained unavailable after bounded retries. The locked dependency install, typecheck, tests, build, API-boundary audit, secret scan, and fixture audit all completed successfully."

  python-tests:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install HTTP client test dependencies
        run: python -m pip install --disable-pip-version-check "aiohttp>=3.10,<4" "yarl>=1.9,<2" "voluptuous>=0.15,<1"

      - name: Compile integration
        run: python -m compileall -q custom_components/smartthings_web

      - name: Run integration tests
        run: python -m unittest discover -s custom_components/smartthings_web/tests -p "test_*.py"
