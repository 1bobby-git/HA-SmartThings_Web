name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-security:
    name: Node and repository security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify direct SmartThings API boundary
        run: npm run audit:api-free

      - name: Scan production source for secrets
        run: npm run audit:secrets

      - name: Verify sanitized fixtures
        run: npm run audit:fixtures

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 180s npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "npm audit failed after 3 attempts." >&2
              exit 1
            fi
            echo "npm audit attempt ${attempt} failed; retrying after a bounded delay." >&2
            sleep $((attempt * 15))
          done

  python-tests:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install HTTP client test dependencies
        run: python -m pip install --disable-pip-version-check "aiohttp>=3.10,<4" "yarl>=1.9,<2" "voluptuous>=0.15,<1"

      - name: Compile integration
        run: python -m compileall -q custom_components/smartthings_web

      - name: Run integration tests
        run: python -m unittest discover -s custom_components/smartthings_web/tests -p "test_*.py"
