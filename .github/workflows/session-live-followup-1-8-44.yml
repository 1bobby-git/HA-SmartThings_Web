name: Finalize live session continuity follow-up
on:
  push:
    branches: [fix/session-continuity-1.8.44]
    paths: [.github/workflows/session-live-followup-1-8-44.yml]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/session-continuity-1.8.44
      - name: Align lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('bridge/tests/browser/session-lifecycle.test.ts')
          t=p.read_text()
          anchor='''    expect(await manager.refreshAuthenticatedSessionIfDue()).toBe("verified");\n    expect(candidate.waitForURL).toHaveBeenCalledOnce();\n    expect(manager.currentKeeper()).toBe(original);'''
          replacement='''    expect(await manager.refreshAuthenticatedSessionIfDue()).toBe("verified");\n    expect(candidate.waitForURL).toHaveBeenCalledTimes(2);\n    expect(manager.currentKeeper()).toBe(original);'''
          assert t.count(anchor)==1
          p.write_text(t.replace(anchor,replacement))
          PY
          git diff --check
          git add bridge/tests/browser/session-lifecycle.test.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: cover Samsung-first proactive refresh lifecycle'
          git push origin HEAD:refs/heads/fix/session-continuity-1.8.44
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run audit:api-free && npm run audit:secrets && npm run audit:fixtures
