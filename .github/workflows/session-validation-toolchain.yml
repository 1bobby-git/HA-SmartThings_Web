name: Session validation toolchain
on:
  push:
    branches: [fix/verified-native-session-1.8.53]
    paths: [.github/workflows/session-validation-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ebad8cc4d9c2122b385a1de3cc3a7484a33e2f1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Prepare source and dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 tools/_patch_native_login_1853.py
          python3 tools/_patch_native_login_tests_1853.py
          python3 tools/_patch_native_login_auth_1853.py
          mkdir -p /tmp/session-toolchain
          tar --exclude=.git --exclude=node_modules -czf /tmp/session-toolchain/source.tgz .
          tar -czf /tmp/session-toolchain/dependencies.tgz node_modules
          cp "$(command -v node)" /tmp/session-toolchain/node
          sha256sum /tmp/session-toolchain/* > /tmp/session-toolchain/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-validation-toolchain
          path: /tmp/session-toolchain
          retention-days: 1
