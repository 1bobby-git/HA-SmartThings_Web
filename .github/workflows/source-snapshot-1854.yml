name: Source snapshot 1854
on:
  push:
    branches: [fix/native-session-capture-1.8.54]
    paths: [.github/workflows/source-snapshot-1854.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4746b174f4ed9220e6784d8e7e0d416a8b558450
          persist-credentials: false
      - run: git archive --format=tar.gz -o /tmp/source-1853.tgz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-1853
          path: /tmp/source-1853.tgz
          retention-days: 1
