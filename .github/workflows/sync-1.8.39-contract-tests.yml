name: Synchronize 1.8.39 contract tests

on:
  push:
    branches:
      - fix/session-continuity-1.8.39
    paths:
      - .github/workflows/sync-1.8.39-contract-tests.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Synchronize release contract expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          path = "tests/addon-config.test.ts"
          replace_once(path, 'test("packages HAOS session continuity as version 1.8.38", () => {', 'test("packages HAOS session continuity as version 1.8.39", () => {')
          replace_once(path, 'expect(config.version).toBe("1.8.38");', 'expect(config.version).toBe("1.8.39");')
          replace_once(path, 'expect(packageMetadata.version).toBe("1.8.38");', 'expect(packageMetadata.version).toBe("1.8.39");')
          replace_once(path, 'expect(protocolMetadata.bridge_version).toBe("1.8.38");', 'expect(protocolMetadata.bridge_version).toBe("1.8.39");')
          replace_once(path, "expect(runtime).toContain('const bridgeVersion = \"1.8.38\";');", "expect(runtime).toContain('const bridgeVersion = \"1.8.39\";');")
          replace_once(path, 'expect(changelog).toContain("## 1.8.38");', 'expect(changelog).toContain("## 1.8.39");\n    expect(changelog).toContain("## 1.8.38");')

          p = Path("tests/protocol-version-contract.test.ts")
          text = p.read_text()
          if text.count("1.8.38") != 4:
              raise SystemExit(f"unexpected protocol version anchors: {text.count('1.8.38')}")
          p.write_text(text.replace("1.8.38", "1.8.39"))

          replace_once(
              "bridge/tests/runtime.test.ts",
              '["bridge_init:version:1.8.38:home_monitor_direct"],',
              '["bridge_init:version:1.8.39:home_monitor_direct"],'
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Full validation
        shell: bash
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run audit:api-free
          npm run audit:secrets
      - name: Commit synchronized tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/addon-config.test.ts tests/protocol-version-contract.test.ts bridge/tests/runtime.test.ts
          git diff --cached --check
          git commit -m "test: synchronize 1.8.39 release contracts"
          git push origin HEAD:fix/session-continuity-1.8.39
