name: Validate field-shape candidate 1855
on:
  push:
    branches: [fix/native-session-shape-1.8.55]
    paths: [.github/workflows/validate-1855.yml]
permissions:
  contents: write
concurrency:
  group: native-session-1855
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/native-session-shape-1.8.55
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply and verify exact local candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_1855_edit.py
          python3 tools/_1855_refine.py
          python3 tools/_1855_finish.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'CHANGELOG.md':'4f354230aa4d3ec7ea61c848655bf2027acc46daf9ceed026ddd4c55b39558de',
            'addon/smartthings_web_bridge/CHANGELOG.md':'9ecf70580bb33dfe23076846fb98822ec066971599e137a70cdbcaa30296dd6b',
            'addon/smartthings_web_bridge/config.yaml':'419a2d2ba16d251cc78980ed8e022169ebd574076c9c5cc52448ab512baff3b6',
            'bridge/src/browser/native-login-policy.ts':'d993534fcd69bd2653e88fc03c5d6240a61f6f64dfa4dae03329ff13c548a33d',
            'bridge/src/browser/native-session-maintenance.ts':'950cf24619973972b27a6352f008ed560bf9f8302ab27913ba87d266c8e8f0d1',
            'bridge/src/browser/native-session-observer.ts':'bd2ab95575dcaa28395d495dd74a5f62066db7aa7ce3726c28461bf291923a67',
            'bridge/src/runtime.ts':'1c30f74b992f03811d0ff238b6127b952d5953b026053b7eb50941e63141b58e',
            'bridge/src/server/health.ts':'0ef7603221cc35437799d48f178d0db47677389f1f10187638c25293ad90d6fe',
            'bridge/src/server/status-page.ts':'68ba188a9915e1170b4d8be8f99683890f456d4383b5881511ede63f02dbc981',
            'bridge/src/state/runtime-state.ts':'340f538d31e4e1ee198939e8c2b18b1b0663251dc9e6c3cfe61fe3fc15c8aedd',
            'bridge/tests/browser/native-session-observability.test.ts':'44dc2d014bcea0d29cc1da779ab9f75e831d387f23442d17914a0d224a02e73e',
            'bridge/tests/runtime.test.ts':'6ff92089549dc3c41d74338c5196e21a6971d48fe4d49d1815fa2d2f74038edc',
            'custom_components/smartthings_web/manifest.json':'1b3cb11dffeb7b76de6a46d7b847f76ac5ff78b6ff1276346b64d7e08bb26caf',
            'docs/native-session-maintenance.md':'9c394a5cade7b60a7a09d5a2a3347da12e282b353a09aa21c841c9e763f2de62',
            'package-lock.json':'04a6e4768a4855902f4f1ad9c2ce479ad035e7486bbbe8008ccb59aeae225dc6',
            'package.json':'680748c21272abc4ef5cff19150cf1b13120222fff992278d69dab58f69907e5',
            'protocol/version.json':'d00b99408fed1691f55b166964137688aa07e1b80161e5854fd61c03bec3cbeb',
            'tests/addon-config.test.ts':'8a90bfd446daacf6cd1b11ad5ebf0def7901ba4abcf7f121be7b54e5e99c688b',
            'tests/protocol-version-contract.test.ts':'71b5bef81a433c93e0cd2a1e99f22ce9455c2b4a8bf0f80c9b40728ebc1ad132',
            'tools/ci-native-login-dom-regression.mjs':'5a8d9fde9dcf2804e84e11e6522f3497336ee8a469b144f35ab1efad63b3744b',
            'release-notes/1.8.55.md':'93f14d0db565e40156be16b627e9bca8d8aba003462902b6691f061c18de29d3'
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == digest, (path, actual, digest)
          print('Exact local production parity:', len(expected), 'files')
          PY
          git diff --check
      - name: Full Node and security checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run audit:api-free
          npm run audit:secrets
      - name: Real Chromium session and settings regressions
        shell: bash
        run: |
          set -euo pipefail
          npx playwright-core install --with-deps chromium
          node tools/ci-native-session-smoke.mjs
          node tools/ci-native-login-dom-regression.mjs
          xvfb-run -a node tools/ci-native-login-policy-smoke.mjs
          xvfb-run -a node tools/ci-session-continuity-smoke.mjs
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm tools/_1855_edit.py tools/_1855_refine.py tools/_1855_finish.py
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate optional expiry and effective login state (1.8.55)'
          git push origin HEAD:fix/native-session-shape-1.8.55
