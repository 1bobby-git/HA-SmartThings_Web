name: SmartThings Web Bridge
slug: smartthings_web_bridge
description: Headed Chromium bridge for observing SmartThings Web traffic from Home Assistant.
version: 0.1.176
url: https://github.com/1bobby-git/HA-SmartThings_Web
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_admin: true
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8099]/health/live
arch:
  - amd64
  - aarch64
options:
  log_level: info
  dom_fallback_enabled: true
  command_confirmation_timeout: 30
  status_recheck_enabled: true
  inventory_reconciliation_interval: 21600
  debug_protocol_logging: false
schema:
  log_level: list(trace|debug|info|warning|error)
  dom_fallback_enabled: bool
  command_confirmation_timeout: int(1,120)
  status_recheck_enabled: bool
  inventory_reconciliation_interval: int(900,604800)
  debug_protocol_logging: bool
